<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Disciplina</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f2f2;--mut:#8b93a1;--ac:#ff5a36;--ok:#34c76b;--bad:#ff3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
header{padding:18px 16px 8px}
#quote{font-size:18px;font-weight:600;line-height:1.3;border-left:4px solid var(--ac);padding-left:12px}
main{padding:0 16px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.item.late{outline:2px solid var(--bad)}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:none;color:#fff;font-size:18px;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok)}
.t{flex:1}.m{font-size:12px;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14171d;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut);font-size:14px}
nav button.on{color:var(--ac);font-weight:700}
form{background:var(--card);border-radius:12px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
input,select,textarea,button.go{font:inherit;color:var(--tx);background:#0f1115;border:1px solid #2a2e38;border-radius:8px;padding:10px;width:100%}
button.go{background:var(--ac);border:0;font-weight:700}
textarea{min-height:240px}
.row{display:flex;gap:8px}.row>*{flex:1}
#warn{background:var(--bad);color:#fff;padding:10px 16px;font-size:14px;display:none}
.empty{color:var(--mut);padding:8px 0}
</style>
</head>
<body>
<div id="warn"></div>
<header><div id="quote"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const KEY='disciplina.v1';
const DEF_Q=["Nadie va a venir a salvarte. Hazlo tú.","La motivación es mentira. La disciplina es lo que queda.","Lo que hoy evitas, mañana pesa el doble.","No tienes que tener ganas. Tienes que hacerlo.","Cada vez que cumples contigo, votas por quien quieres ser.","5 minutos hoy valen más que el plan perfecto de mañana.","Tu yo de dentro de un año te está viendo ahora mismo."];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{items:[],quotes:DEF_Q,next:1};
let tab='hoy';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));resched()};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const rq=()=>S.quotes[Math.floor(Math.random()*S.quotes.length)]||'¡Hazlo!';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const isDone=i=>i.kind==='habit'?!!(i.log||{})[today()]:!!i.done;
const streak=i=>{let n=0,d=new Date();if(!(i.log||{})[dstr(d)])d.setDate(d.getDate()-1);
  while((i.log||{})[dstr(d)]){n++;d.setDate(d.getDate()-1)}return n};
// próxima hora objetivo (Date) del item o null
const dueAt=i=>{if(!i.at)return null;
  if(i.kind==='habit'){const[h,m]=i.at.split(':');const d=new Date();d.setHours(+h,+m,0,0);return d}
  return new Date(i.at)};
const late=i=>{const d=dueAt(i);return d&&d<new Date()&&!isDone(i)};

// ---------- notificaciones ----------
const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function setupNotif(){
  if(LN){
    try{
      await LN.requestPermissions();
      await LN.createChannel({id:'insist',name:'Recordatorios insistentes',importance:5,vibration:true,visibility:1});
      const e=await LN.checkExactNotificationSetting();
      if(e.exact_alarm!=='granted')await LN.changeExactNotificationSetting();
    }catch(e){}
  }else if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
}
let busy=false,again=false;
async function resched(){
  render();
  if(!LN)return;
  if(busy){again=true;return}
  busy=true;
  try{
    const p=(await LN.getPending()).notifications;
    if(p.length)await LN.cancel({notifications:p.map(n=>({id:n.id}))});
    const out=[],now=new Date();
    for(const i of S.items){
      const at=dueAt(i);if(!at)continue;
      const base={title:i.text,body:rq(),channelId:'insist',allowWhileIdle:true};
      let first=at;
      if(i.kind==='habit'){ // diario, repetido
        if(isDone(i)||at<=now)first=new Date(at.getTime()+864e5);
        out.push({...base,id:i.id*100,schedule:{at:first,every:'day',allowWhileIdle:true}});
      }else if(!isDone(i)&&at>now)out.push({...base,id:i.id*100,schedule:{at,allowWhileIdle:true}});
      if(i.nag>0&&!i.done){ // insistencia: 5 avisos extra hoy y 5 mañana (hábitos)
        const days=i.kind==='habit'?[0,1]:[0];
        for(const d of days){
          if(d===0&&isDone(i))continue;
          for(let k=1;k<=5;k++){
            let t=new Date(at.getTime()+d*864e5+k*i.nag*6e4);
            if(d===0&&t<=now&&k===1&&at<now){/* vencido: insistir desde ahora */t=new Date(now.getTime()+60e3)}
            if(t<=now)continue;
            out.push({...base,body:'🔔 ¿Ya? '+rq(),id:i.id*100+d*10+k,schedule:{at:t,allowWhileIdle:true}});
          }
        }
      }
    }
    if(out.length)await LN.schedule({notifications:out});
  }catch(e){warn('Notificaciones: '+e.message)}
  busy=false;if(again){again=false;resched()}
}
function warn(m){const w=$('#warn');w.textContent=m;w.style.display='block'}
// navegador (pruebas): avisa solo con la página abierta
if(!LN)setInterval(()=>{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  for(const i of S.items){const d=dueAt(i);if(!d||isDone(i)||!(i.nag>0||Math.abs(now-d)<3e4))continue;
    const gap=i.nag>0?i.nag*6e4:864e5;
    if(now>=d&&now-(i.last||0)>=gap){i.last=now;new Notification(i.text,{body:rq()})}}
},30000);

// ---------- UI ----------
const TABS=[['hoy','Hoy'],['task','Pendientes'],['buy','Compras'],['quotes','Frases']];
function row(i){
  const meta=[];
  if(i.kind==='habit'){const s=streak(i);if(s)meta.push('🔥 '+s+' días')}
  if(i.at)meta.push(i.kind==='habit'?'⏰ '+i.at:'⏰ '+i.at.replace('T',' '));
  if(i.nag>0)meta.push('insiste c/'+i.nag+'min');
  return `<div class="item ${isDone(i)?'done':''} ${late(i)?'late':''}">
    <button class="chk" onclick="tog(${i.id})">${isDone(i)?'✓':''}</button>
    <div class="t">${esc(i.text)}<div class="m">${meta.join(' · ')}</div></div>
    <button class="x" onclick="del(${i.id})">✕</button></div>`}
function list(arr,empty){return arr.length?arr.map(row).join(''):`<div class="empty">${empty}</div>`}
function form(kind){
  const habit=kind==='habit';
  return `<form onsubmit="add(event,'${kind}')">
  <input name="text" placeholder="${habit?'Nuevo hábito (ej. Hacer ejercicio)':kind==='buy'?'Qué comprar':'Nuevo pendiente'}" required>
  ${kind==='buy'?'':`<input name="at" type="${habit?'time':'datetime-local'}" title="Recordatorio">
  <select name="nag"><option value="0">No insistir</option><option value="5">Insistir cada 5 min</option><option value="10" selected>Insistir cada 10 min</option><option value="30">Insistir cada 30 min</option></select>`}
  <button class="go">Agregar</button></form>`}
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  const it=S.items,m=$('#main');
  if(tab==='hoy'){
    const lates=it.filter(late),pendTasks=it.filter(i=>i.kind==='task'&&!i.done);
    m.innerHTML=(lates.length?`<h2>⚠ Vencido — hazlo ya</h2>${lates.map(row).join('')}`:'')
     +`<h2>Hábitos de hoy</h2>${list(it.filter(i=>i.kind==='habit'&&!late(i)),'Aún no tienes hábitos.')}`
     +form('habit')
     +(pendTasks.filter(i=>!late(i)).length?`<h2>Pendientes</h2>${pendTasks.filter(i=>!late(i)).map(row).join('')}`:'');
  }else if(tab==='task')m.innerHTML=`<h2>Pendientes</h2>${list(it.filter(i=>i.kind==='task'),'Nada pendiente. ¿Seguro?')}${form('task')}`;
  else if(tab==='buy')m.innerHTML=`<h2>Lista de compras</h2>${list(it.filter(i=>i.kind==='buy'),'Lista vacía.')}${form('buy')}`;
  else m.innerHTML=`<h2>Tus frases (una por línea)</h2><form onsubmit="saveQ(event)"><textarea name="q">${esc(S.quotes.join('\n'))}</textarea><button class="go">Guardar</button></form>`;
  $('#quote').textContent=$('#quote').textContent||rq();
}
function add(e,kind){e.preventDefault();const f=new FormData(e.target);
  S.items.push({id:S.next++,kind,text:f.get('text').trim(),at:f.get('at')||'',nag:+(f.get('nag')||0),log:{},done:false});
  save();setupNotif()}
function tog(id){const i=S.items.find(x=>x.id===id);
  if(i.kind==='habit'){i.log=i.log||{};i.log[today()]?delete i.log[today()]:i.log[today()]=1}else i.done=!i.done;
  if(isDone(i)&&navigator.vibrate)navigator.vibrate(60);
  save()}
function del(id){if(confirm('¿Borrar?')){S.items=S.items.filter(x=>x.id!==id);save()}}
function saveQ(e){e.preventDefault();S.quotes=new FormData(e.target).get('q').split('\n').map(s=>s.trim()).filter(Boolean);if(!S.quotes.length)S.quotes=DEF_Q;save()}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){$('#quote').textContent=rq();resched()}});
setupNotif();$('#quote').textContent=rq();resched();
// PWA/offline en navegador no necesario: la app va empaquetada en el APK.
</script>
</body>
</html>
