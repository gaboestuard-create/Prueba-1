<title>Ancla</title>
<meta name="theme-color" content="#0E6B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna de tarjetas tipo "bitácora del día", barra de pestañas abajo al alcance del pulgar */
:root{
  --bg:#EDF2F0;--surface:#FFFFFF;--ink:#13242A;--mute:#566A6C;--line:#D3DFDB;
  --accent:#0E6B66;--accent-ink:#FFFFFF;--soft:#DCEBE6;--sun:#C9811F;--sun-soft:#F7E7CC;
  --ok:#2C7A4F;--warn:#A9471F;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D191C;--surface:#152428;--ink:#E4EFEC;--mute:#93A8A7;--line:#26393D;
  --accent:#4CC2B4;--accent-ink:#06211E;--soft:#1B3236;--sun:#F0B657;--sun-soft:#3A2E17;
  --ok:#5CC98A;--warn:#F08A5D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D191C;--surface:#152428;--ink:#E4EFEC;--mute:#93A8A7;--line:#26393D;
  --accent:#4CC2B4;--accent-ink:#06211E;--soft:#1B3236;--sun:#F0B657;--sun-soft:#3A2E17;
  --ok:#5CC98A;--warn:#F08A5D;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);padding:0 16px;padding-block:12px 96px}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.muted{color:var(--mute)}.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.card.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hero .muted,.card.hero .eyebrow{color:inherit;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700;font-size:18px;padding:14px 18px;width:100%}
.hero .btn-main{background:var(--accent-ink);color:var(--accent)}
.btn-soft{background:var(--soft);border-color:transparent;font-weight:700}
.btn-sun{background:var(--sun-soft);border-color:transparent;font-weight:700;color:var(--ink)}
.btn-link{background:none;border:0;padding:6px 0;min-height:0;text-decoration:underline;color:inherit;opacity:.85}
.btn-x{background:none;border:0;color:var(--mute);padding:6px 10px}
.btn-x.armed{color:var(--warn);font-weight:700}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
/* línea del medicamento */
.dose{position:relative;height:14px;border-radius:7px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.dose .ramp{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent-ink) 40%,transparent)}
.dose .best{position:absolute;top:0;bottom:0;background:var(--accent-ink)}
.dose .now{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;border-radius:2px;background:var(--sun)}
.dose-labels{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;opacity:.85}
/* tareas */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .body{flex:1;min-width:0;display:grid;gap:4px}
.task .name{font-weight:700;overflow-wrap:anywhere}
.task.done .name{text-decoration:line-through;color:var(--mute)}
.chk{width:34px;height:34px;min-height:34px;border-radius:50%;padding:0;flex:none;border:2px solid var(--mute);background:none;font-weight:700}
.done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step{font-size:14px;color:var(--mute)}
.step b{color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--soft)}
.chip.sun{background:var(--sun-soft)}
.chip.warn{background:var(--warn);color:var(--surface)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{min-height:36px;padding:6px 10px;font-size:14px}
/* calificaciones */
.rate{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:center}
.rate .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rate .opts button{padding:0;min-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts3 button{padding:8px 4px;font-weight:700}
.rate .opts button.on,.opts3 button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ends{grid-column:2;display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-4px}
/* tabla diario */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:700}
.big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0 14px;font-weight:700;color:var(--mute);font-size:15px}
nav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
/* overlay */
#ov{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#ov.alarm-firme{background:var(--sun-soft)}
#ov .say{font-family:var(--f-display);font-size:30px;font-weight:800;max-width:20ch;text-wrap:balance}
#ov .stack{display:grid;gap:10px;width:100%;max-width:380px}
.clock{font-family:var(--f-display);font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring{width:220px;height:220px;max-width:70vw;max-height:70vw;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;z-index:20;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<main id="main"></main>
<nav id="nav"></nav>
<div id="ov" hidden></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const atToday=t=>{const[h,m]=t.split(':');const d=new Date();d.setHours(+h,+m,0,0);return d};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];

const TIPOS={
  lectura:['Lectura','Abre el PDF y lee solo el primer párrafo.'],
  escrito:['Ensayo o reporte','Escribe el título y 3 ideas sueltas, aunque estén feas.'],
  presentacion:['Presentación','Crea la primera diapositiva: solo el título.'],
  investigacion:['Investigación','Busca 2 fuentes y guarda los links.'],
  examen:['Estudiar para examen','Lee tus apuntes del primer tema 5 minutos.'],
  equipo:['Trabajo en equipo','Manda un mensaje al grupo.'],
  otro:['Otro','Haz la parte más pequeña posible.']
};
const CAMA=['Siéntate en la cama. Solo eso.','Pon los pies en el piso.','Párate y tómate un vaso de agua.','Abre la cortina o prende la luz.','Haz 5 sentadillas. Nada más.'];
const CASA=['Deja la mochila y quítate los zapatos.','Tómate un vaso de agua.','Come algo, aunque sea poquito.','Haz 5 lagartijas. Nada más.'];
// actividad: [primer paso, minutos, pide anotar una idea al final]
const ACTS={
  'Hacer tarea':['Abre la tarea y lee solo las instrucciones.',5],
  'Estudiar':['Abre tus apuntes en el primer tema.',5],
  'Caminar':['Ponte los tenis y sal a la puerta. Con 10 minutos cuenta.',10],
  'Limpiar':['Recoge 5 cosas que estén fuera de lugar.',5],
  'Lavar':['Junta la ropa sucia en un solo montón.',5],
  'Hacer comida':['Saca lo que vas a usar y ponlo en la mesa.',5],
  'Video o podcast':['Elige uno que te dé curiosidad y dale play.',20,1]};
const actBtns=cls=>Object.entries(ACTS).map(([n,[,m]])=>`<button class="${cls}" data-act="timer" data-chore="${n}">${n}<span class="small" style="display:block;opacity:.75;font-weight:400">${m} min</span></button>`).join('');
const RATES=[['e','Energía','baja','alta'],['a','Ánimo','bajo','bueno'],['f','Foco','disperso','enfocado'],['s','Sueño anoche','mal','bien'],['ap','Apetito','poco','normal']];

function fresh(){return{v:1,t:0,cfg:{onset:90,len:6,limit:''},
  tasks:[
    {id:uid(),name:'Ejemplo: leer el capítulo de Incoterms',type:'lectura',subj:'Comercio internacional',due:'',step:'',today:'',done:''},
    {id:uid(),name:'Ejemplo: presentación sobre mercados emergentes',type:'presentacion',subj:'',due:'',step:'',today:'',done:''}],
  rem:[
    {id:'r1',text:'¿Ya tomaste tu medicamento?',kind:'fixed',at:'09:00',mode:'tranqui',pill:1},
    {id:'r2',text:'Empieza lo difícil: ya estás en tu mejor rato',kind:'pill',at:90,mode:'firme'},
    {id:'r3',text:'Movimiento: 5 sentadillas o 5 lagartijas',kind:'pill',at:240,mode:'tranqui'},
    {id:'r4',text:'Check-in de la noche (30 segundos)',kind:'fixed',at:'21:30',mode:'tranqui'}],
  days:{}}}

// ---------- guardado: cuenta de Claude si se puede, si no este navegador ----------
const LKEY='ancla.v1';
const ls={get(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}},set(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}};
// agrega lo nuevo a datos guardados antes de que existiera
function migrate(){
  if(!S.m1){S.m1=1;S.cfg.med2??='Segunda pastilla';S.rem.push(
    {id:'r5',text:'¿Ya comiste? Aunque no tengas hambre',kind:'fixed',at:'13:00',mode:'tranqui',meal:'c'},
    {id:'r6',text:'Snack: algo chiquito para llegar con gasolina',kind:'fixed',at:'15:00',mode:'tranqui',meal:'s'})}
  return S}
const MEALS=[['d','Desayuno'],['c','Comida'],['s','Snack']];
let S=ls.get()||fresh(); migrate();
let dbDoc=null, sync='local', saveT=0, saving=false, dirty=false;
function save(){S.t=Date.now();ls.set();render();clearTimeout(saveT);saveT=setTimeout(flush,1200);clearTimeout(schedT);schedT=setTimeout(schedule,800)}

// ---------- APK: avisos del sistema aunque la app esté cerrada ----------
const LN=window.Capacitor?.isNativePlatform?.()&&window.Capacitor.Plugins?.LocalNotifications;
let schedT=0;
// versión de esta APK (el workflow la reemplaza con el commit); si el Release es más nuevo, avisamos
const BUILD='__BUILD__',APK_URL='https://github.com/gaboestuard-create/Prueba-1/releases/download/ancla-apk/ancla.apk';
let upd=false;
async function checkUpdate(){
  try{const r=await fetch('https://api.github.com/repos/gaboestuard-create/Prueba-1/releases/tags/ancla-apk',{cache:'no-store'});
    if(!r.ok)return;const sha=(await r.json()).target_commitish;
    if(sha&&sha!==BUILD&&!upd){upd=true;render()}}catch(e){}
}
async function nativeSetup(){
  if(!LN)return;
  checkUpdate();
  try{await LN.requestPermissions();
    await LN.createChannel({id:'ancla',name:'Avisos de Ancla',importance:5,vibration:true,visibility:1});
    const e=await LN.checkExactNotificationSetting?.();if(e&&e.exact_alarm!=='granted')await LN.changeExactNotificationSetting();
  }catch(e){}
  schedule();
}
// reprograma todo: hoy y los de hora fija de mañana; firme = 5 avisos cada 3 min hasta que respondas
async function schedule(){
  if(!LN)return;
  try{
    const p=(await LN.getPending()).notifications;if(p.length)await LN.cancel({notifications:p.map(n=>({id:n.id}))});
    const out=[],now=Date.now();
    for(const off of [0,1]){
      const dt=new Date();dt.setDate(dt.getDate()+off);const d=S.days[dkey(dt)]||{},w=off?null:win();
      S.rem.forEach((r,i)=>{
        if(r.pill&&d.pill||r.meal&&(d.meals||{})[r.meal])return;
        const a=(d.ack||{})[r.id]||{};if(a.ok)return;
        let at;if(r.kind==='fixed'){const x=atToday(r.at);x.setDate(x.getDate()+off);at=x.getTime()}else{if(!w)return;at=w.t.getTime()+r.at*6e4}
        at=a.until||at;
        for(let j=0;j<(r.mode==='firme'?5:1);j++){const t=at+j*18e4;if(t<=now)continue;
          out.push({id:off*10000+i*10+j+1,title:r.text,body:r.mode==='firme'?'Abre Ancla y toca "Ya empecé".':'Ancla',channelId:'ancla',schedule:{at:new Date(t),allowWhileIdle:true}})}
      });
    }
    if(out.length)await LN.schedule({notifications:out});
  }catch(e){}
}
async function flush(){
  if(!dbDoc)return; if(saving){dirty=true;return}
  saving=true;
  try{await dbDoc.set(JSON.parse(JSON.stringify(S)));sync='cuenta'}catch(e){sync='error'}
  saving=false; if(dirty){dirty=false;flush()} else render();
}
(async()=>{
  if(!window.claude?.use)return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=db&&user&&await user.id(); if(!id)return;
    dbDoc=db.collection('data/users/'+id).doc('ancla');
    const snap=await dbDoc.get();
    if(snap.exists&&(snap.data().t||0)>=(S.t||0)){S=JSON.parse(JSON.stringify(snap.data()));migrate();ls.set();sync='cuenta';render()}
    else flush();
  }catch(e){sync='error';render()}
})();

const day=(k=dkey())=>S.days[k]||(S.days[k]={pill:'',mov:{s:0,l:0},focus:0,check:{},note:'',ack:{},tried:0});
const touch=()=>{day().tried=1};
function win(k=dkey()){const p=S.days[k]?.pill;if(!p)return null;const t=atToday(p);
  const a=new Date(t.getTime()+S.cfg.onset*6e4),b=new Date(a.getTime()+S.cfg.len*36e5);return{t,a,b}}
const todayTasks=()=>S.tasks.filter(t=>t.today===dkey());
const nextTask=()=>todayTasks().find(t=>!t.done);
const stepOf=t=>t.step||(TIPOS[t.type]||TIPOS.otro)[1];

// ---------- sonido ----------
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('pointerdown',ac,{once:true});
function tone(f,dur,when=0,vol=.15){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;
  o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
const chime=()=>{tone(660,.7);tone(880,.9,.2)};
const alarmBeep=()=>{tone(880,.18,0,.3);tone(880,.18,.25,.3);tone(1175,.35,.5,.3)};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let toastT=0;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

// ---------- vistas ----------
let recallOff=0,tab='hoy',armed='',pillEdit=false,addRem=false;
try{tab=localStorage.getItem('ancla.tab')||'hoy'}catch(e){}
const TABS=[['hoy','Hoy'],['tareas','Tareas'],['diario','Diario'],['avisos','Avisos']];

function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-act="tab" data-k="${k}" aria-current="${k===tab?'page':'false'}">${l}</button>`).join('');
  $('#main').innerHTML=({hoy:vHoy,tareas:vTareas,diario:vDiario,avisos:vAvisos})[tab]();
}

const med2Row=d=>S.cfg.med2?`<div class="row" style="border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:10px"><span class="grow">${esc(S.cfg.med2)}</span>
  <button style="background:transparent;border-color:currentColor;color:inherit;font-weight:700" data-act="med2" aria-pressed="${!!d.med2}">${d.med2?'✓ Tomada':'Ya me la tomé'}</button></div>`:'';
function vPill(){
  const d=day(),w=win(),now=new Date();
  if(!d.pill||pillEdit){
    const late=S.cfg.limit&&hm(now)>S.cfg.limit;
    return `<section class="card hero"><span class="eyebrow">Medicamento</span>
      <h2>${pillEdit?'¿A qué hora te la tomaste?':'¿Ya te la tomaste?'}</h2>
      ${late&&!pillEdit?`<p class="small" style="margin:0">Ya pasó la hora límite que pusiste (${esc(S.cfg.limit)}). Si no la has tomado, sigue lo que acordaste con tu psiquiatra.</p>`:''}
      ${pillEdit?`<input type="time" id="pill-time" value="${d.pill||hm(now)}"><div class="row"><button class="btn-main grow" data-act="pill-set">Guardar hora</button><button class="btn-link" data-act="pill-cancel">Cancelar</button></div>`
      :`<button class="btn-main" data-act="pill-now">Ya me la tomé</button><button class="btn-link" data-act="pill-edit">Me la tomé a otra hora</button>`}
      ${med2Row(d)}
    </section>`}
  const span=w.b.getTime()+2*36e5-w.t.getTime(),pct=x=>Math.max(0,Math.min(100,(x-w.t.getTime())/span*100));
  let msg;
  if(now<w.a)msg=`Empieza a hacer efecto como a las <b>${hm(w.a)}</b>. Mientras, algo ligero: ordena tu espacio o elige tus 3 de hoy.`;
  else if(now<w.b)msg=`Estás en tu mejor rato hasta las <b>${hm(w.b)}</b>. Úsalo para lo difícil.`;
  else msg=`Ya vas de bajada. Lo ligero también cuenta: cuando llegues, toca <b>Llegué a casa</b>.`;
  return `<section class="card hero"><div class="row"><span class="eyebrow grow">Medicamento · tomado ${esc(d.pill)}</span><button class="btn-link small" data-act="pill-edit">Cambiar</button></div>
    <p style="margin:0">${msg}</p>
    <div class="dose" role="img" aria-label="Mejor rato de ${hm(w.a)} a ${hm(w.b)}">
      <div class="ramp" style="left:0;width:${pct(w.a.getTime())}%"></div>
      <div class="best" style="left:${pct(w.a.getTime())}%;width:${pct(w.b.getTime())-pct(w.a.getTime())}%"></div>
      <div class="now" style="left:${pct(now.getTime())}%"></div></div>
    <div class="dose-labels"><span>${esc(d.pill)}</span><span>${hm(w.a)} – ${hm(w.b)}</span><span>${hm(new Date(w.t.getTime()+span))}</span></div>
    ${med2Row(d)}
    <span class="small muted">Horas aproximadas. Ajústalas en Avisos según cómo lo sientas.</span></section>`
}

function taskRow(t,short){
  const tp=(TIPOS[t.type]||TIPOS.otro)[0],meta=[tp];
  if(t.subj)meta.push(esc(t.subj));
  let due='';
  if(t.due&&!t.done){const n=Math.round((new Date(t.due+'T00:00')-new Date(dkey()+'T00:00'))/864e5);

// ---------- overlay: temporizador, modo cama, alarma ----------
let OV=null,T=null,C=0,FL=CAMA,ring=null,beepI=0,WL=null,tickI=0;
function openOv(m){OV=m;renderOv()}
function closeOv(){OV=null;clearInterval(beepI);clearInterval(tickI);ring=null;try{WL&&WL.release()}catch(e){}WL=null;$('#ov').hidden=true;$('#ov').className='';render()}
function wake(){try{navigator.wakeLock?.request('screen').then(l=>WL=l).catch(()=>{})}catch(e){}}

function startTimer(id,min,chore){
  const t=S.tasks.find(x=>x.id===id),a=ACTS[chore]||[];min=min||a[1]||5;
  T={id,name:t?t.name:chore||'Lo que tengas enfrente',step:t?stepOf(t):a[0]||'',total:min*6e4,start:Date.now(),fin:false,learn:a[2]};
  touch();save();wake();openOv('timer');
  clearInterval(tickI);tickI=setInterval(tickTimer,250);
}
function endSeg(){if(!T||T.closed)return;const m=Math.round(Math.min(Date.now()-T.start,T.total)/6e4);T.closed=1;if(m){day().focus+=m;save()}}
function tickTimer(){
  if(OV!=='timer'||!T||T.fin)return;
  const left=T.total-(Date.now()-T.start);
  if(left<=0){T.fin=true;endSeg();chime();buzz([200,100,200]);renderOv();return}
  const el=$('#clock');if(el)el.textContent=pad(Math.floor(left/6e4))+':'+pad(Math.floor(left%6e4/1e3));
  const c=$('#arc');if(c)c.style.strokeDashoffset=String(628*(1-left/T.total));
}

function renderOv(){
  const o=$('#ov');o.hidden=false;o.className='';
  if(OV==='timer'){
    if(T.fin){o.innerHTML=`<span class="eyebrow">Se acabaron tus minutos</span><div class="say">¿Sigues un rato más?</div>
      <div class="stack"><button class="btn-main" data-act="more" data-v="5">5 minutos más</button><button class="btn-soft" data-act="more" data-v="15">15 minutos más</button>
      <button data-act="finish">La terminé</button><button class="btn-link" data-act="close">Ya por hoy, y está bien</button></div>`;return}
    o.innerHTML=`<span class="eyebrow">Solo esto</span><div class="say" style="font-size:24px">${esc(T.name)}</div>
      ${T.step?`<p class="step" style="margin:0;max-width:32ch">Primer paso: <b>${esc(T.step)}</b></p>`:''}
      <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" stroke="var(--line)"/><circle id="arc" cx="110" cy="110" r="100" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="0"/></svg><div class="clock" id="clock">--:--</div></div>
      <div class="stack"><button class="btn-link" data-act="stop">Parar</button></div>`;
    tickTimer();return}
  if(OV==='cama'){
    if(C<FL.length){o.innerHTML=`<div class="dots">${FL.map((_,i)=>`<i class="${i<=C?'on':''}"></i>`).join('')}</div>
      <div class="say">${FL[C]}</div><div class="stack"><button class="btn-main" data-act="cama-next">Hecho</button><button class="btn-link" data-act="close">Salir</button></div>`;return}
    const nx=nextTask();
    if(FL===CASA){o.innerHTML=`<div class="say">Ya llegaste y ya te moviste. Ahora, un ratito de:</div>
      <div class="stack"><div class="grid2">${actBtns('btn-soft')}</div>
      ${nx?`<button class="btn-soft" data-act="timer" data-id="${nx.id}">${esc(nx.name)}</button>`:''}
      <button class="btn-link" data-act="close">Hoy toca descansar, y está bien</button></div>`;return}
    o.innerHTML=`<div class="say">Ya estás de pie. Eso era lo más difícil.</div>
      <div class="stack">${nx?`<button class="btn-main" data-act="timer" data-id="${nx.id}">5 minutos de: ${esc(nx.name)}</button>`:`<button class="btn-main" data-act="tab-close" data-k="tareas">Elegir mis 3 de hoy</button>`}
      <button class="btn-link" data-act="close">Cerrar</button></div>`;return}
  if(OV==='idea'){o.innerHTML=`<span class="eyebrow">Cosas interesantes</span><div class="say" style="font-size:24px">¿Qué fue lo más interesante?</div>
      <p class="small muted" style="margin:0;max-width:34ch">Una frase con tus palabras. Escribirla te ayuda a recordarla, y aquí te la voy a volver a mostrar.</p>
      <div class="stack"><textarea id="idea-txt" placeholder="Ej. México le vende a EE. UU. casi el 80% de lo que exporta"></textarea>
      <input id="idea-src" placeholder="De dónde (opcional): video, podcast, clase…" autocomplete="off">
      <button class="btn-main" data-act="idea-save">Guardar</button><button class="btn-link" data-act="close">Ahora no</button></div>`;return}
  if(OV==='alarm'){
    const r=ring,a=day().ack[r.id]||{};o.className=r.mode==='firme'?'alarm-firme':'';
    o.innerHTML=`<span class="eyebrow">${r.mode==='firme'?'Modo firme':'Recordatorio'}</span><div class="say">${esc(r.text)}</div>
      <div class="stack">${r.pill?`<button class="btn-main" data-act="al-pill">Ya me la tomé</button>`:`<button class="btn-main" data-act="al-ok">Ya empecé</button>`}
      ${(a.s||0)<2?`<button class="btn-soft" data-act="al-snooze">Dame 10 min</button>`:`<p class="small muted" style="margin:0">Ya usaste tus 2 "dame 10 min". Solo el primer paso, ándale.</p>`}
      ${r.mode==='firme'?'':`<button class="btn-link" data-act="al-ok">Cerrar</button>`}</div>`}
}

function dueRem(){
  const d=day(),now=Date.now(),w=win();
  for(const r of S.rem){
    if(r.pill&&d.pill||r.meal&&(d.meals||{})[r.meal])continue;
    let at;if(r.kind==='fixed')at=atToday(r.at).getTime();else{if(!w)continue;at=w.t.getTime()+r.at*6e4}
    const a=d.ack[r.id]||{};if(a.ok)continue;
    if(now>=(a.until||at)&&now-at<3*36e5)return r;
  }
}
function fire(r){
  ring=r;openOv('alarm');
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('Ancla',{body:r.text})}catch(e){}}
  if(r.mode==='firme'){alarmBeep();buzz([400,200,400]);clearInterval(beepI);beepI=setInterval(()=>{alarmBeep();buzz([400,200,400])},3000)}
  else{chime();buzz(200)}
}
function ack(fields){const d=day(),r=ring;d.ack[r.id]={...(d.ack[r.id]||{}),...fields};save();closeOv()}
let lastKey=dkey();
setInterval(()=>{
  if(dkey()!==lastKey){lastKey=dkey();if(!OV)render()}
  if(OV)return;const r=dueRem();if(r)fire(r);
},10000);
setInterval(()=>{if(!OV&&tab==='hoy'&&!document.activeElement?.matches('textarea,input'))render()},60000);

// ---------- acciones ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='TEXTAREA')return;
  const act=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
  if(!['del','delrem','delidea'].includes(act))armed='';
  const d=day(),t=id&&S.tasks.find(x=>x.id===id);
  switch(act){
    case 'tab':tab=k;try{localStorage.setItem('ancla.tab',k)}catch(e){}render();scrollTo(0,0);break;
    case 'tab-close':closeOv();tab=k;render();break;
    case 'pill-now':d.pill=hm(new Date());touch();pillEdit=false;save();chime();toast('Anotado. Tu ventana de foco ya está calculada.');break;
    case 'pill-edit':pillEdit=true;render();break;
    case 'pill-cancel':pillEdit=false;render();break;
    case 'pill-set':{const v=$('#pill-time').value;if(v){d.pill=v;touch()}pillEdit=false;save();break}
    case 'cama':case 'casa':FL=act==='cama'?CAMA:CASA;C=0;touch();save();wake();openOv('cama');break;
    case 'cama-next':if(C===FL.length-1){d.mov[FL===CAMA?'s':'l']+=5;save()}C++;renderOv();break;
    case 'timer':startTimer(id,0,b.dataset.chore);break;
    case 'stop':{const l=T?.learn;endSeg();T=null;l?openOv('idea'):closeOv();break}
    case 'more':startTimer(T.id,+b.dataset.v,T.name);break;
    case 'finish':{const x=S.tasks.find(y=>y.id===T.id),l=T.learn;if(x){x.done=dkey();touch();save()}T=null;if(l){openOv('idea');break}closeOv();toast('Hecha. Bien ahí.');break}
    case 'close':{const l=T?.learn;endSeg();T=null;l?openOv('idea'):closeOv();break}
    case 'idea':openOv('idea');break;
    case 'idea-save':{const text=$('#idea-txt').value.trim();if(!text){$('#idea-txt').focus();break}
      S.ideas=[...(S.ideas||[]),{id:uid(),k:dkey(),text,src:$('#idea-src').value.trim()}];touch();save();closeOv();toast('Guardada. Otro día te la recuerdo.');break}
    case 'recall':recallOff++;render();break;
    case 'delidea':if(armed===id){S.ideas=S.ideas.filter(x=>x.id!==id);armed='';save()}else{armed=id;render()}break;
    case 'done':t.done=t.done?'':dkey();if(t.done){touch();chime();buzz(60)}save();break;
    case 'today':if(t.today===dkey())t.today='';else if(todayTasks().filter(x=>!x.done).length>=3){toast('Ya tienes 3 para hoy. Quita una primero.');break}else t.today=dkey();save();break;
    case 'del':if(armed===id){S.tasks=S.tasks.filter(x=>x.id!==id);armed='';save()}else{armed=id;render()}break;
    case 'mov':d.mov[k]+=5;touch();save();buzz(40);break;
    case 'meal':d.meals={...d.meals,[k]:!(d.meals||{})[k]};touch();save();break;
    case 'med2':d.med2=!d.med2;save();break;
    case 'rate':d.check={...d.check,[k]:+b.dataset.v};touch();save();break;
    case 'copy':{const txt=summaryText(),box=$('#copy-box');
      const fallback=()=>{box.hidden=false;box.value=txt;box.style.minHeight='200px';box.select();toast('Selecciona el texto y cópialo.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Resumen copiado.'),fallback)}catch(err){fallback()}break}
    case 'test':ring={id:'test',text:k==='firme'?'Así suena el modo firme':'Así suena el modo tranqui',mode:k};fire(ring);break;
    case 'mode':{const r=S.rem.find(x=>x.id===id);r.mode=r.mode==='firme'?'tranqui':'firme';save();break}
    case 'delrem':if(armed===id){S.rem=S.rem.filter(x=>x.id!==id);armed='';save()}else{armed=id;render()}break;
    case 'addrem':addRem=!addRem;render();break;
    case 'al-ok':if(ring.id==='test')closeOv();else ack({ok:1});break;
    case 'al-pill':d.pill=hm(new Date());touch();ack({ok:1});break;
    case 'al-snooze':if(ring.id==='test')closeOv();else{const a=d.ack[ring.id]||{};ack({s:(a.s||0)+1,until:Date.now()+10*6e4})}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.cfg){const v=el.type==='number'?+el.value:el.value;if(el.type!=='number'||(v>=+el.min&&v<=+el.max)){S.cfg[el.dataset.cfg]=v;save()}}
  else if(el.id==='note'){day().note=el.value.trim();touch();save()}
  else if(el.id==='f-type'){$('#f-step').placeholder=(TIPOS[el.value]||TIPOS.otro)[1]}
  else if(el.id==='f-kind'){const p=el.value==='pill';$('#f-at-l').innerHTML=p?'Minutos después<input name="at" type="number" min="0" max="900" step="15" value="90" id="f-at">':'Hora<input name="at" type="time" value="18:00" id="f-at">'}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(e.target);
  if(e.target.id==='f-task'){
    const name=f.get('name').trim();if(!name)return;
    S.tasks.push({id:uid(),name,type:f.get('type'),subj:f.get('subj').trim(),due:f.get('due'),step:f.get('step').trim(),today:'',done:''});
    save();toast('Agregada. Toca "Para hoy" si va en tus 3.');
  }else if(e.target.id==='f-rem'){
    const kind=f.get('kind'),at=kind==='pill'?Math.max(0,+f.get('at')||0):f.get('at');if(!at&&kind==='fixed')return;
    S.rem.push({id:uid(),text:f.get('text').trim(),kind,at,mode:f.get('mode')});addRem=false;save();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){schedule();if(LN)checkUpdate();if(!OV)render()}});
render();nativeSetup();
</script>
