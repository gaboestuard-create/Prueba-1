<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
</head>
<body>
<title>World Leader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* WORLD LEADER · estilos
   Concepto: el globo ocupa toda la pantalla; la interfaz flota encima como
   cristal ahumado con filo dorado (poder) y cian (información).
   Un solo tema oscuro, por decisión de diseño: es una sala de mando. */
:root {
  color-scheme: dark;
  --bg: #02040a; --ink: #e9eef7; --mut: #8d9bb4; --line: rgba(160, 190, 255, .15);
  --glass: linear-gradient(160deg, rgba(22, 32, 56, .8), rgba(7, 11, 21, .86));
  --gold: #e8c36a; --gold2: #b8862b; --cyan: #4fd8ff; --red: #ff5a4d; --green: #5fe3a1; --violet: #b99cff;
  --fd: 'Cinzel', 'Trajan Pro', Georgia, serif; --fb: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; --fc: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --sl: max(16px, env(safe-area-inset-left, 0px)); --sr: max(16px, env(safe-area-inset-right, 0px)); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--fb); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; padding-left: 0; padding-right: 0; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--fd); font-weight: 700; letter-spacing: .03em; }
h2 { font-size: 19px; line-height: 1.2; } h3 { font: 600 15px/1.25 var(--fb); }
h4 { font: 600 12px/1.2 var(--fc); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 16px 0 8px; display: flex; gap: 8px; align-items: baseline; }
h4 small { letter-spacing: 0; text-transform: none; font: 400 12px var(--fb); } h4 b { margin-left: auto; letter-spacing: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
button:disabled { opacity: .42; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
small { font-size: 12px; } .mut { color: var(--mut); } .fine { font-size: 12px; margin-top: 12px; max-width: 68ch; } .center { text-align: center; display: block; }
.num, table td.num { font-variant-numeric: tabular-nums; } .nowrap { white-space: nowrap; }
.up { color: var(--green); } .down { color: var(--red); } .gold { color: var(--gold); } .good { color: var(--green); } .bad { color: var(--red); }
.eyebrow { font: 600 11px/1 var(--fc); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); margin-bottom: 6px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -4px; }
.flag { font-size: 16px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', var(--fc); letter-spacing: .04em; } .flag.xl { font-size: 34px; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; overscroll-behavior: contain; }

#globe { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 60%, #071224, var(--bg) 70%); }
#globe canvas { display: block; }
#labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.glabel { position: absolute; left: 0; top: 0; font: 600 10.5px/1 var(--fc); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .8); text-shadow: 0 1px 3px #000, 0 0 8px #000; white-space: nowrap; will-change: transform; }
.glabel.me { color: var(--gold); font-size: 12px; }
#app { position: relative; z-index: 2; }
.glass { background: var(--glass); backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 44px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); }

/* --- botones, chips, campos --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 9px; font: 600 13px/1.1 var(--fb); background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16); transition: transform .14s, background .14s, box-shadow .14s, border-color .14s; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .32); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
.btn.gold { background: linear-gradient(180deg, #f3d488, var(--gold2)); color: #1c1403; border-color: #f7e2a8; box-shadow: 0 0 0 0 rgba(232, 195, 106, .5); }
.btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #fbe3a6, #c9983a); box-shadow: 0 4px 22px rgba(232, 195, 106, .35); }
.btn.red { border-color: rgba(255, 90, 77, .55); color: #ffb3ac; } .btn.red:hover:not(:disabled) { background: rgba(255, 90, 77, .2); }
.btn.ghost { background: transparent; } .btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12px; } .btn.lg { min-height: 46px; padding: 10px 22px; font-size: 15px; }
.btn.armed { background: var(--red); color: #fff; border-color: #fff; animation: pulse .7s infinite alternate; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font: 500 12px/1.3 var(--fb); background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .13); color: var(--ink); white-space: nowrap; }
button.chip { transition: background .14s, transform .14s; } button.chip:hover { background: rgba(255, 255, 255, .16); transform: translateY(-1px); }
.chip.good { color: var(--green); border-color: rgba(95, 227, 161, .4); background: rgba(95, 227, 161, .09); } .chip.bad { color: #ff9c93; border-color: rgba(255, 90, 77, .45); background: rgba(255, 90, 77, .1); }
.chip.gold { color: var(--gold); border-color: rgba(232, 195, 106, .5); background: rgba(232, 195, 106, .1); } .chip.cyan { color: var(--cyan); border-color: rgba(79, 216, 255, .4); background: rgba(79, 216, 255, .08); } .chip.violet { color: var(--violet); border-color: rgba(185, 156, 255, .5); }
.chip .ic { width: 13px; height: 13px; vertical-align: -2px; } .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .dots { font-style: normal; font-size: 7px; color: var(--gold); letter-spacing: 1px; }
.fxl { flex-basis: 100%; font-size: 12px; color: var(--mut); }
input, select, textarea { background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; padding: 7px 10px; min-height: 36px; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px rgba(79, 216, 255, .18); }
textarea { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; } select option { background: #0c1322; }
label { display: flex; flex-direction: column; gap: 4px; font: 500 12px var(--fb); color: var(--mut); min-width: 0; } label input, label select { color: var(--ink); font-size: 14px; }
label.check, label.inl { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; } input[type=checkbox] { min-height: 0; width: 18px; height: 18px; accent-color: var(--gold); }
.w50 { width: 62px; } .w70 { width: 84px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; } .row.top { align-items: flex-start; } .row.end { justify-content: flex-end; margin-top: 14px; } .row.wrap, .wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 8px; } .grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; } .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 12px; }
.card { background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.kvs > div { background: rgba(255, 255, 255, .045); border-radius: 9px; padding: 7px 9px; min-width: 0; } .kvs small { display: block; color: var(--mut); font: 500 11px var(--fc); letter-spacing: .08em; text-transform: uppercase; } .kvs b { font: 600 15px var(--fb); font-variant-numeric: tabular-nums; }
.kvs.big { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin-bottom: 12px; } .kvs.big b { font-size: 19px; }
.bar { display: block; position: relative; height: 7px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; flex: 1; min-width: 40px; }
.bar i { display: block; height: 100%; border-radius: 9px; background: var(--cyan); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar.green i { background: var(--green); } .bar.red i { background: var(--red); } .bar.gold i { background: var(--gold); } .bar.tall { height: 14px; }
.bar.need { overflow: visible; } .bar.need::after { content: ""; position: absolute; left: var(--need); top: -3px; bottom: -3px; width: 2px; background: #fff; border-radius: 2px; box-shadow: 0 0 6px #fff; }
.relbar { display: block; position: relative; height: 7px; border-radius: 9px; background: rgba(255, 255, 255, .1); flex: 1; min-width: 60px; } .relbar i { position: absolute; top: 0; bottom: 0; border-radius: 9px; transition: width .5s; } .relbar .pos { background: var(--green); } .relbar .neg { background: var(--red); } .relbar b { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .6); }
.line { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(40px, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); } .line.sec { grid-template-columns: minmax(0, 1.3fr) minmax(40px, 1fr) 30px 44px; } .line > span:first-child { min-width: 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
.spark .line { fill: none; stroke-width: 1.6; display: initial; padding: 0; border: 0; } .spark .area { opacity: .16; stroke: none; } .spark.up { color: var(--green); } .spark.down { color: var(--red); } .spark path.line, .spark circle { stroke: currentColor; } .spark .area, .spark circle { fill: currentColor; } .spark { max-width: 100%; height: auto; }
.tblw { overflow-x: auto; margin: 0 -4px; } table { border-collapse: collapse; width: 100%; font-size: 13px; } th { font: 600 11px var(--fc); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; } td { padding: 6px 8px; border-bottom: 1px solid rgba(255, 255, 255, .06); vertical-align: middle; }
.warn-box { background: rgba(255, 90, 77, .12); border: 1px solid rgba(255, 90, 77, .4); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; color: #ffc2bc; }
.portrait { position: relative; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex: none; border: 1px solid rgba(232, 195, 106, .55); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); } .portrait.big { width: 84px; height: 84px; border-radius: 16px; }
.portrait .pt { display: block; width: 100%; height: 100%; } .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.xbtn { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .07); transition: background .14s, transform .14s; z-index: 2; } .xbtn:hover { background: rgba(255, 255, 255, .18); transform: rotate(90deg); }
.lnk { color: var(--cyan); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.searchbox { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .18); border-radius: 9px; padding: 0 10px; color: var(--mut); } .searchbox input { border: 0; background: none; box-shadow: none; flex: 1; min-width: 0; padding-left: 0; color: var(--ink); }
.list { display: flex; flex-direction: column; } .li { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 8px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, .05); transition: background .12s; } .li:hover { background: rgba(255, 255, 255, .08); } .li.on { background: rgba(232, 195, 106, .14); box-shadow: inset 3px 0 0 var(--gold); } .li .relbar { max-width: 110px; } .pad { padding: 12px; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; } .tabs button { padding: 10px 12px; font: 600 13px var(--fc); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); border-bottom: 2px solid transparent; white-space: nowrap; transition: color .14s; } .tabs button:hover { color: var(--ink); } .tabs button.on { color: var(--gold); border-color: var(--gold); }

/* --- inicio y creación --- */
.start { position: fixed; inset: 0; display: flex; align-items: center; pointer-events: none; padding: 24px var(--sr) 24px var(--sl); background: linear-gradient(90deg, rgba(2, 4, 10, .88), rgba(2, 4, 10, .25) 55%, transparent); }
.start-in { pointer-events: auto; max-width: 560px; margin-left: clamp(0px, 6vw, 90px); animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; }
.logo { font: 900 clamp(46px, 9.5vw, 104px)/.92 var(--fd); letter-spacing: .02em; background: linear-gradient(180deg, #fff3c9 10%, var(--gold) 48%, #7a5514 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 30px rgba(232, 195, 106, .28)); }
.logo span { display: block; letter-spacing: .12em; font-size: .78em; }
.tagline { font: 500 clamp(16px, 2.2vw, 21px)/1.3 var(--fb); margin: 18px 0 26px; color: #cfd8e8; } .start-btns { display: flex; flex-wrap: wrap; gap: 10px; } .start .fine { color: var(--mut); margin-top: 22px; }
.create { position: fixed; left: var(--sl); top: calc(16px + var(--st)); bottom: calc(16px + var(--sb)); width: min(460px, calc(100vw - 32px)); display: flex; flex-direction: column; animation: slideL .35s cubic-bezier(.2, .8, .2, 1) both; }
.create > header { padding: 16px 16px 0; } .steps { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--line); } .steps button { padding: 8px 10px; font: 600 12px var(--fc); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); border-bottom: 2px solid transparent; } .steps button.on { color: var(--gold); border-color: var(--gold); }
.create-body { flex: 1; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; } .create-body .list { flex: 1; min-height: 120px; } .create > footer { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); }
.tree { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; } .branch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; position: relative; } .branch h4 { grid-column: 1/-1; margin: 0; } .branch .link { display: none; }
.trait { display: flex; flex-direction: column; gap: 3px; padding: 8px; border-radius: 10px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .12); transition: transform .14s, border-color .14s, background .14s; min-width: 0; } .trait:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .35); } .trait b { font-size: 13px; } .trait small { font-size: 11px; line-height: 1.25; } .trait .pro { color: var(--green); } .trait .con { color: #ff9c93; }
.trait.on { background: rgba(232, 195, 106, .16); border-color: var(--gold); box-shadow: 0 0 18px rgba(232, 195, 106, .25); } .trait.locked { opacity: .45; }

/* --- HUD --- */
.hud { position: fixed; top: calc(8px + var(--st)); left: var(--sl); right: var(--sr); display: flex; align-items: center; gap: 12px; padding: 6px 12px; animation: drop .4s both; }
.hud-id { display: flex; align-items: center; gap: 10px; min-width: 0; border-radius: 10px; padding: 2px 6px 2px 2px; transition: background .14s; } .hud-id:hover { background: rgba(255, 255, 255, .08); } .hud-id span { display: flex; flex-direction: column; min-width: 0; } .hud-id b { font: 700 15px var(--fd); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hud-id small { color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-stats { display: flex; gap: 6px; margin-left: auto; } .stat { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); transition: background .14s, transform .14s; } .stat:hover { background: rgba(255, 255, 255, .12); transform: translateY(-1px); } .stat .ic { color: var(--gold); } .stat span { display: flex; flex-direction: column; line-height: 1.15; } .stat b { font: 600 15px var(--fb); font-variant-numeric: tabular-nums; white-space: nowrap; } .stat em { font-style: normal; color: var(--mut); font-size: 11px; } .stat small { color: var(--mut); font-size: 11px; white-space: nowrap; } .stat i { font-style: normal; } .stat.warn { box-shadow: inset 0 0 0 1px rgba(255, 90, 77, .6); } .stat.warn .ic, .stat.warn b { color: var(--red); }
.hud-date { text-align: right; padding-left: 8px; border-left: 1px solid var(--line); } .hud-date b { display: block; font: 700 14px var(--fd); letter-spacing: .05em; white-space: nowrap; } .hud-date small { color: var(--mut); }
.modes { position: fixed; top: calc(76px + var(--st)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(6, 10, 20, .7); border: 1px solid var(--line); backdrop-filter: blur(10px); max-width: calc(100vw - 32px); }
.modes button { padding: 6px 12px; border-radius: 99px; font: 600 12px var(--fc); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); transition: background .14s, color .14s; white-space: nowrap; } .modes button:hover { color: var(--ink); } .modes button.on { background: var(--cyan); color: #012; }
.legend { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; color: #c5cfdf; font-size: 11px; padding: 2px 10px; border-radius: 99px; background: rgba(6, 10, 20, .72); pointer-events: none; }
.dock { position: fixed; left: var(--sl); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 6px; }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 62px; padding: 8px 2px; border-radius: 10px; color: var(--mut); font: 600 10px var(--fc); letter-spacing: .08em; text-transform: uppercase; transition: background .14s, color .14s, transform .14s; } .dock button:hover { background: rgba(255, 255, 255, .09); color: var(--ink); transform: scale(1.05); } .dock button.on { background: rgba(232, 195, 106, .16); color: var(--gold); } .dock .ic { width: 22px; height: 22px; }
.endturn { position: fixed; right: var(--sr); bottom: calc(16px + var(--sb)); display: flex; align-items: center; gap: 8px; padding: 13px 20px; border-radius: 14px; font: 700 15px var(--fd); letter-spacing: .06em; color: #1c1403; background: linear-gradient(180deg, #f6dc98, var(--gold2)); border: 1px solid #fbe9b8; box-shadow: 0 8px 30px rgba(232, 195, 106, .3); transition: transform .15s, box-shadow .15s; animation: glow 2.6s ease-in-out infinite; }
.endturn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 40px rgba(232, 195, 106, .5); } .endturn:active:not(:disabled) { transform: scale(.97); } .endturn.pend { background: linear-gradient(180deg, #8fe6ff, #1f9fc8); border-color: #c8f3ff; color: #012; animation: pulse .9s infinite alternate; }

/* --- panel de país y paneles de gabinete --- */
.cpanel > details { margin-bottom: 8px; }
.cpanel { position: fixed; right: var(--sr); top: calc(120px + var(--st)); bottom: calc(84px + var(--sb)); width: 348px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: thin; animation: slideR .3s cubic-bezier(.2, .8, .2, 1) both; }
.cpanel h4 { margin: 4px 0 0; } .cp-head { display: flex; align-items: center; gap: 12px; padding-right: 36px; } .cp-head h2 { font-size: 20px; }
.leader { display: flex; gap: 12px; align-items: center; background: rgba(255, 255, 255, .045); border-radius: 12px; padding: 10px; } .leader > div:last-child { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; } .leader b { font-size: 15px; } .leader small { color: var(--mut); }
.relbox { display: flex; flex-direction: column; gap: 6px; } .relbox .row { justify-content: space-between; } .why { display: flex; flex-direction: column; gap: 2px; font-size: 12px; background: rgba(0, 0, 0, .3); border-radius: 8px; padding: 8px; } .why div { display: flex; justify-content: space-between; gap: 10px; }

  for (const s of D.SANC0) S.sanc.push({ by: s[0], on: s[1], s: 0 });
  for (const k in D.COMMODITIES) S.mkt.com[k] = { p: D.COMMODITIES[k].p * rr(.92, 1.08), h: [] };
  for (const c of D.COMPANIES) S.mkt.co[c.id] = { p: c.p * rr(.95, 1.05), h: [] };
  for (let i = 0; i < 8; i++) marketTurn(); // historial inicial para las gráficas
  // --- el jugador
  const c = P(); c.lider = { n: S.leader.n, verificado: true, img: S.leader.img };
  if (o.custom) { // país creado por el jugador sobre un territorio existente
    if (o.custom.n) c.n = o.custom.n; if (o.custom.reg) c.reg = o.custom.reg; if (o.custom.ideo != null) c.ideo = +o.custom.ideo;
    c.custom = 1; c.blocs = []; S.tr = S.tr.filter(t => t.a !== o.iso && t.b !== o.iso); S.sanc = S.sanc.filter(s => s.by !== o.iso && s.on !== o.iso);
    S.wars = S.wars.filter(w => !w.att.includes(o.iso) && !w.def.includes(o.iso));
  }
  if (o.partido) c.partido = o.partido;
  c.stock = {}; initPolitics();
  for (const t of S.leader.traits) { const st = TR[t].start; if (!st) continue; for (const k in st.sec || {}) S.pol.sec[k].a = clamp(S.pol.sec[k].a + st.sec[k], 0, 100); for (const k in st.rep || {}) repAdd(k, st.rep[k]); }
  dirty();
  const f = resFlow(); for (const k in f) c.stock[k] = Math.round(f[k].reserve);
  S.stats.gdp0 = c.gdp;
  news(`${S.leader.n} asume el poder en ${c.n}`, 'pol', o.iso, 3);
  S.fin = finance(true);
  return S;
}

/* ---- guardado / carga ---- */
function save() { return JSON.stringify(S); }
function load(str) {
  let o; try { o = typeof str === 'string' ? JSON.parse(str) : str; } catch (e) { return { ok: false, msg: 'El archivo no es un JSON válido' }; }
  if (!o || o.v !== 1 || !o.c || !o.c[o.player] || !o.pol || !o.mkt) return { ok: false, msg: 'No es una partida de World Leader compatible' };
  for (const iso of ISOS) if (!o.c[iso]) return { ok: false, msg: 'A la partida le faltan países (' + iso + ')' };
  S = o; dirty(); Bus.emit('loaded'); Bus.emit('state');
  return { ok: true, msg: 'Partida cargada: ' + dateStr() };
}

/* ---- puerta única de acciones ---- */
const ACT = {}, OPS = {};
const FREE = { decide: 1, edit: 1, asylum: 1 };
const fail = msg => ({ ok: false, msg });
const canPay = x => P().tr - x >= -P().gdp * .15;
function useCP(n) { if (S.pol.cp < n) return false; S.pol.cp -= n; return true; }
function act(name, a) {
  let r;
  if (!S) r = fail('No hay partida en curso');
  else if (S.over && name !== 'asylum') r = fail('La partida ha terminado');
  else if (!ACT[name]) r = fail('Acción desconocida: ' + name);
  else if (S.pend.length && !FREE[name]) r = fail('Resuelve primero la decisión pendiente');
  else { try { r = ACT[name](a || {}) || {}; } catch (e) { if (typeof console !== 'undefined') console.error(e); r = fail('Error interno: ' + e.message); } }
  if (r.ok !== false) r.ok = true;
  if (r.msg) Bus.emit('toast', { ok: r.ok, msg: r.msg });
  if (S) Bus.emit('state');
  return r;
}
function over(reason) { if (S.over) return; S.over = { r: reason, t: S.turn, date: dateStr(), title: repTitle() }; Bus.emit('over', S.over); }
function pushPend(p) { S.pend.push(p); }


/* ---------- engine/20-economy.js ---------- */
/* =====================================================================
   SISTEMA · ECONOMÍA: presupuesto, materias primas, comercio y bolsa
   Dinero en miles de millones de $ (mM). 1 turno = 1 trimestre.
   ===================================================================== */

/* flujo de materias primas del jugador por turno */
function resFlow() {
  const c = P(), out = {};
  for (const k in D.COMMODITIES) {
    const prod = D.PROD[Math.min(5, c.rec[k] || 0)] * (1 + lawSum('prodMul'));
    const cons = k === 'pet' ? c.gdp / 400 * (1 - lawSum('oilSave')) : k === 'gas' ? c.gdp / 800 : k === 'tri' ? Math.sqrt(c.pop * c.gdp) / 150 : 0;
    const exp = S.contracts.filter(x => x.com === k).reduce((s, x) => s + x.q, 0);
    out[k] = { prod, cons, exp, net: prod - cons - exp, stock: (c.stock && c.stock[k]) || 0, reserve: cons * 4 + 5 };
  }
  return out;
}
function tradeIncome() {
  const me = S.player, g = P().gdp; let v = 0, n = 0;
  for (const b of ISOS) if (b !== me && S.c[b].alive && hasT('com', me, b) && !IX().sp[key(me, b)] && !atWar(me, b)) { v += .0015 * Math.sqrt(g * S.c[b].gdp); n++; }
  return { v: v * Math.max(.2, 1 + mod('tradeInc') + lawSum('trade')), n };
}
const portValue = () => Object.keys(S.port).reduce((s, id) => s + S.port[id].q * S.mkt.co[id].p, 0);
const taxRate = () => clamp(S.pol.tax + lawSum('tax') / 100, .08, .45);

/* Presupuesto del turno. dry=true solo calcula (para la UI); dry=false lo aplica. */
function finance(dry) {
  const c = P(), inc = {}, exp = {}, war = inWar(S.player);
  inc.imp = c.gdp * taxRate() / 4 * (.8 + c.stab / 500) * (1 + mod('income'));
  inc.com = tradeIncome().v;
  inc.div = Object.keys(S.port).reduce((s, id) => s + S.port[id].q * S.mkt.co[id].p * CO[id].y / 400, 0) * (1 + mod('divid'));
  if (mod('graft')) inc.res = c.gdp * .0012;
  exp.pub = c.gdp * S.pol.spend / 4;
  exp.ley = c.gdp * lawSum('cost') / 400;
  exp.mil = upkeep(S.player) * (war ? 1.5 : 1);
  exp.int = c.tr < 0 ? -c.tr * .03 : 0;
  // materias primas: contratos, importación automática del déficit y venta del excedente
  const f = resFlow(); let imp = 0, mat = 0, con = 0, short = 0;
  for (const k in f) {
    let st = f[k].stock + f[k].prod - f[k].cons; const m = S.mkt.com[k];
    for (const x of S.contracts) if (x.com === k) {
      const q = Math.min(x.q, Math.max(0, st)); st -= q; con += q * x.p;
      if (!dry) { x.left--; if (q < x.q) addMod(S.player, x.to, 'Incumpliste un contrato de suministro', -6, .5, 1); }
    }
    if (st < 0) { if (canPay(imp - st * m.p * 1.08)) imp += -st * m.p * 1.08; else if (k === 'pet') short = 1; st = 0; }
    else if (S.auto && st > f[k].reserve) { mat += (st - f[k].reserve) * m.p * .95; st = f[k].reserve; }
    if (!dry) c.stock[k] = st;
  }
  inc.mat = mat; inc.con = con; exp.imp = imp;
  let ti = 0, te = 0; for (const k in inc) ti += inc[k]; for (const k in exp) te += exp[k];
  const fin = { inc, exp, ti, te, net: ti - te };
  if (!dry) {
    c.tr += fin.net; S.flags.oilShort = short;
    S.contracts = S.contracts.filter(x => { if (x.left > 0) return true; news(`Termina tu contrato de ${D.COMMODITIES[x.com].n.toLowerCase()} con ${nm(x.to)}`, 'eco', x.to); return false; });
  }
  return fin;
}

/* crecimiento del PIB (pp por turno) */
function growthOf(iso) {
  const c = C(iso), gpc = c.gdp / Math.max(.001, c.pop);
  let g = gpc < 5 ? 1 : gpc < 15 ? .8 : gpc < 35 ? .5 : .35;
  let s = 0; for (const x of S.sanc) if (x.on === iso && S.c[x.by].alive) s += .25 * clamp(S.c[x.by].gdp / c.gdp, .05, 1.5);
  g -= Math.min(1.2, s);
  if (inWar(iso)) g -= .6; if (c.stab < 30) g -= .4;
  if (isP(iso)) {
    g += mod('growth') + lawSum('grow') + Math.min(.3, tradeIncome().n * .03) - (S.flags.oilShort ? .3 : 0) - (c.tr < -c.gdp * .2 ? .2 : 0);
    for (const m of S.gm) g += m.v;
  }
  return g;
}

/* ---- bolsa y materias primas ---- */
function marketTurn() {
  const M = S.mkt; M.sent = M.sent * .6 + rr(-.015, .015);
  for (const k in M.com) {
    const m = M.com[k], d = D.COMMODITIES[k]; let f = 1 + .1 * (d.p - m.p) / d.p + rr(-d.vol, d.vol);
    for (const s of M.shocks) if (s.k === k) f *= s.m;
    m.p = clamp(m.p * f, d.p * .3, d.p * 4); m.h.push(+m.p.toFixed(3)); if (m.h.length > 24) m.h.shift();
  }
  for (const id in M.co) {
    const m = M.co[id], d = CO[id], home = ownerOf(d.home), h = S.c[home];
    let f = 1.008 + M.sent + rr(-.06, .06) + (h.stab - 55) / 2500;
    if (inWar(home)) f += d.sec === 'def' ? .03 : -.04;
    f -= Math.min(.05, S.sanc.filter(x => x.on === home).length * .01);
    for (const s of M.shocks) if (s.k === d.sec || s.k === 'all' || (s.k === 'home' && home === S.player)) f *= s.m;
    m.p = Math.max(d.p * .05, m.p * f); m.h.push(+m.p.toFixed(2)); if (m.h.length > 24) m.h.shift();
  }
  M.shocks = [];
}

const fee = () => mod('fee') ? 0 : .01;
ACT.buyStock = a => {
  const m = S.mkt.co[a.id], amt = +a.amt; if (!m || !(amt > 0)) return fail('Orden inválida');
  if (!canPay(amt)) return fail('No tienes fondos suficientes');
  if (IX().sp[key(S.player, ownerOf(CO[a.id].home))]) return fail('Las sanciones bloquean esa inversión');
  P().tr -= amt; const p = S.port[a.id] || (S.port[a.id] = { q: 0, c: 0 }); p.q += amt * (1 - fee()) / m.p; p.c += amt;
  return { msg: `Inviertes ${money(amt)} en ${CO[a.id].n}` };
};
ACT.sellStock = a => {
  const p = S.port[a.id], m = S.mkt.co[a.id]; if (!p || !m) return fail('No tienes esa posición');
  const fr = clamp(+a.frac || 1, .01, 1), v = p.q * fr * m.p * (1 - fee()), gain = v - p.c * fr;
  P().tr += v; p.q *= 1 - fr; p.c *= 1 - fr; if (p.q < 1e-6) delete S.port[a.id];
  return { msg: `Vendes ${CO[a.id].n} por ${money(v)} (${gain >= 0 ? 'ganancia' : 'pérdida'} ${money(Math.abs(gain))})` };
};
ACT.buyCom = a => {
  const m = S.mkt.com[a.k], q = +a.q; if (!m || !(q > 0)) return fail('Orden inválida');
  const cost = q * m.p * 1.03; if (!canPay(cost)) return fail('No tienes fondos suficientes');
  P().tr -= cost; P().stock[a.k] = (P().stock[a.k] || 0) + q; m.p *= 1 + q * .002;
  return { msg: `Compras ${q} u de ${D.COMMODITIES[a.k].n.toLowerCase()} por ${money(cost)}` };
};
ACT.sellCom = a => {
  const m = S.mkt.com[a.k], q = Math.min(+a.q, P().stock[a.k] || 0); if (!m || !(q > 0)) return fail('No tienes existencias');
  const v = q * m.p * .97; P().tr += v; P().stock[a.k] -= q; m.p *= Math.max(.7, 1 - q * .002);
  return { msg: `Vendes ${Math.round(q)} u de ${D.COMMODITIES[a.k].n.toLowerCase()} por ${money(v)}` };
};
ACT.setAuto = a => { S.auto = !!a.on; return { msg: S.auto ? 'El excedente se exportará automáticamente' : 'Acumularás el excedente en reservas' }; };
/* contrato de exportación: precio fijo +10% durante 8 turnos, mejora la relación; incumplirlo la daña */
ACT.contract = a => {
  const k = a.k, q = +a.q, to = a.iso, me = S.player;
  if (!D.COMMODITIES[k] || !(q > 0) || !S.c[to] || !S.c[to].alive || to === me) return fail('Contrato inválido');
  if (rel(me, to) < 0) return fail(`${nm(to)} no firma contratos contigo: la relación es negativa`);
  if (IX().sp[key(me, to)]) return fail('Hay sanciones entre ambos países');
  if ((S.c[to].rec[k] || 0) >= 3) return fail(`${nm(to)} ya produce de sobra ese recurso`);
  if (resFlow()[k].net < q) return fail('No produces excedente suficiente para garantizar el suministro');
  if (S.contracts.length >= 8) return fail('Ya tienes el máximo de contratos');
  S.contracts.push({ to, com: k, q, p: +(S.mkt.com[k].p * 1.1).toFixed(3), left: 8 });
  addMod(me, to, 'Contrato de suministro', 5 * (1 + mod('relGain')), .5);
  Bus.emit('route', { a: me, b: to });
  return { msg: `Contrato firmado: ${q} u/turno de ${D.COMMODITIES[k].n.toLowerCase()} a ${nm(to)} durante 8 turnos` };
};
ACT.cancelContract = a => {
  const x = S.contracts[a.i]; if (!x) return fail('Contrato inexistente');
  S.contracts.splice(a.i, 1); addMod(S.player, x.to, 'Cancelaste un contrato', -8, .5, 1); repAdd('conf', -2);
  return { msg: `Cancelas el contrato con ${nm(x.to)}: lo recordarán` };
};


/* ---------- engine/30-politics.js ---------- */
/* =====================================================================
   SISTEMA · POLÍTICA INTERNA: congreso, leyes, sectores, elecciones
   ===================================================================== */
const isDem = () => P().reg === 'dem' || P().reg === 'hib';

function initPolitics() {
  const iso = S.player, c = P(), pol = S.pol;
  let seats;
  if (D.PARTIES[iso] && !c.custom) seats = D.PARTIES[iso].map(p => ({ n: p[0], ideo: p[1], s: p[2], g: p[3] ? 1 : 0 }));
  else if (!isDem()) seats = [{ n: c.partido, ideo: c.ideo, s: 88, g: 1 }, { n: 'Disidencia tolerada', ideo: c.ideo > 0 ? -1 : 1, s: 12, g: 0 }];
  else {
    const r = c.reg === 'hib' ? 56 : 46, o = c.ideo >= 0 ? -1 : 1;
    seats = [{ n: c.partido, ideo: c.ideo, s: r, g: 1 }, { n: 'Aliados de gobierno', ideo: clamp(c.ideo - o, -2, 2) / 2, s: 7, g: 1 },
    { n: D.GEN_PARTIES[o][0], ideo: o * 1.5, s: 100 - r - 7 - 13, g: 0 }, { n: D.GEN_PARTIES[0][0], ideo: 0, s: 13, g: 0 }];
  }
  if (c.custom || !D.PARTIES[iso]) seats[0].n = c.partido;
  const tot = seats.reduce((s, p) => s + p.s, 0); seats.forEach(p => p.s = p.s / tot * 100);
  pol.seats = seats;
  // sectores: el peso electoral depende del tipo de país
  const gpc = c.gdp / c.pop, w = {}; let sum = 0;
  for (const k in D.SECTORS) { let x = D.SECTORS[k].w; if (k === 'rur' && gpc < 8) x += .08; if (k === 'med' && gpc > 25) x += .06; if (k === 'rel' && (c.reg === 'teo' || D.C[iso].region === 'MOR')) x += .06; w[k] = x; sum += x; }
  for (const k in w) pol.sec[k] = { a: 50, w: w[k] / sum };
  pol.nextElec = isDem() ? 8 : 0;
}
const approval = () => Object.keys(S.pol.sec).reduce((s, k) => s + S.pol.sec[k].a * S.pol.sec[k].w, 0);
function secAdd(id, v) {
  if (v > 0) v *= Math.max(.2, 1 + mod('secGain'));
  const one = k => { S.pol.sec[k].a = clamp(S.pol.sec[k].a + v, 0, 100); };
  if (id === 'all') Object.keys(S.pol.sec).forEach(one); else if (S.pol.sec[id]) one(id);
}
function secBase(k) { let v = 50; for (const id in S.pol.laws) v += (LAW[id].sec || {})[k] || 0; for (const t of S.leader.traits) v += ((TR[t].start || {}).sec || {})[k] || 0; return clamp(v, 10, 90); }
/* control territorial: fracción de mis regiones gobernadas por mi partido (solo países con subdivisiones) */
function localCtl() { const r = D.SUB_RULING[S.player]; if (!r || P().custom) return null; const mine = P().terr.filter(t => t.o === S.player && t.p); return mine.length ? mine.filter(t => t.p === r).length / mine.length : null; }

/* ---- votación de leyes ---- */
const lawPop = l => Object.keys(l.sec || {}).reduce((s, k) => s + S.pol.sec[k].w * l.sec[k], 0);
function lawForecast(l, extra) {
  const ap = approval(), pop = lawPop(l), lc = localCtl(), by = []; let yes = 0;
  for (const p of S.pol.seats) {
    const dist = Math.abs((l.eco || 0) - p.ideo);
    let x = (p.g ? .75 : -.1) - .22 * dist * (p.g ? .5 : 1) + (ap - 50) / 80 + pop / 30 + mod('lawVote') + (extra || 0) + (lc == null ? 0 : (lc - .5) * .1);
    if (!p.g && (l.auth || 0) > 0 && isDem()) x -= .2 * l.auth;
    const f = clamp(.5 + x, .03, .97); by.push({ n: p.n, s: p.s, f, g: p.g, ideo: p.ideo }); yes += p.s * f;
  }
  return { yes, by, need: (l.maj || .5) * 100, pop };
}
const invLaw = l => { const sec = {}; for (const k in l.sec || {}) sec[k] = -l.sec[k]; return { n: l.n, eco: -(l.eco || 0), auth: -(l.auth || 0), sec, maj: l.maj }; };
const bribeCost = () => P().gdp * .002 * Math.max(.2, 1 - mod('bribe'));
function runVote(l, extra, title) {
  const f = lawForecast(l, extra); let yes = 0;
  const by = f.by.map(p => { const y = Math.round(p.s * clamp(p.f + rr(-.12, .12), 0, 1)); yes += y; return { n: p.n, s: Math.round(p.s), yes: y, g: p.g, ideo: p.ideo }; });
  const res = { title, by, yes, need: f.need, pass: yes > f.need };
  Bus.emit('vote', res); return res;
}
function enactLaw(l) {
  for (const id in S.pol.laws) if (l.grp && LAW[id].grp === l.grp) { delete S.pol.laws[id]; news(`Queda derogada: ${LAW[id].n}`, 'pol'); }
  S.pol.laws[l.id] = S.turn; S.stats.laws++;
  for (const k in l.sec || {}) secAdd(k, l.sec[k]);
  for (const k in l.rep || {}) repAdd(k, l.rep[k]);
  if (l.once) applyFx(l.once, {});
}
ACT.proposeLaw = a => {
  const l = LAW[a.id], pol = S.pol, mode = a.mode || 'normal'; if (!l) return fail('Ley desconocida');
  if (pol.laws[l.id] != null) return fail('Esa ley ya está vigente');
  if ((pol.cool[l.id] || 0) > S.turn) return fail(`El congreso no la volverá a discutir hasta dentro de ${pol.cool[l.id] - S.turn} turnos`);
  if (mode === 'decree') {
    if (!mod('decree') && isDem()) return fail('Solo un líder de Mano de hierro puede gobernar por decreto en democracia');
    if (!useCP(3)) return fail('Necesitas 3 de capital político');
    enactLaw(l); repAdd('dem', -8); P().stab = clamp(P().stab - 3, 0, 100); secAdd('all', -2);
    news(`Por decreto: ${l.n}`, 'pol', S.player, 2);
    return { msg: `Impones por decreto: ${l.n}. El mundo toma nota.` };
  }
  let extra = 0, cp = 2;
  if (mode === 'lobby') { cp = 3; extra = .12; }
  if (pol.cp < cp) return fail(`Necesitas ${cp} de capital político`);
  if (mode === 'bribe') { const cost = bribeCost(); if (!canPay(cost)) return fail('No tienes fondos para comprar votos'); P().tr -= cost; extra = .2; }
  useCP(cp);
  if (mode === 'bribe' && chance(.25 * (1 + mod('scandal')))) S.later.push({ t: S.turn + ri(1, 3), p: 1, fx: [['sec', 'all', -7], ['rep', 'conf', -5], ['flag', 'scandal']], msg: `Se destapa la compra de votos para aprobar "${l.n}"` });
  const res = runVote(l, extra, l.n);
  if (res.pass) { enactLaw(l); news(`El congreso aprueba: ${l.n} (${res.yes}–${100 - res.yes})`, 'pol', S.player, 2); return { vote: res, msg: `Aprobada: ${l.n}` }; }
  pol.cool[l.id] = S.turn + 4; secAdd('all', -1);
  news(`El congreso tumba tu propuesta: ${l.n} (${res.yes}–${100 - res.yes})`, 'pol', S.player, 2);
  return { vote: res, ok: false, msg: `Rechazada: ${l.n}. No podrás reintentarlo en 4 turnos.` };
};
ACT.repealLaw = a => {
  const l = LAW[a.id]; if (!l || S.pol.laws[l.id] == null) return fail('Esa ley no está vigente');
  if (!useCP(2)) return fail('Necesitas 2 de capital político');
  const res = runVote(invLaw(l), 0, 'Derogar: ' + l.n);
  if (!res.pass) { secAdd('all', -1); return { vote: res, ok: false, msg: `El congreso mantiene la ley: ${l.n}` }; }
  delete S.pol.laws[l.id]; for (const k in l.sec || {}) secAdd(k, -l.sec[k] * .6);
  news(`Derogada: ${l.n}`, 'pol', S.player, 2);
  return { vote: res, msg: `Derogada: ${l.n}` };
};

/* ---- evolución por turno: sectores, estabilidad, capital político ---- */
function politicsTurn(g) {
  const pol = S.pol, c = P(), war = inWar(S.player);
  for (const k in pol.sec) {
    const s = pol.sec[k]; let d = (secBase(k) - s.a) * .08;
    if (g > .7 && (k === 'emp' || k === 'med' || k === 'obr')) d += .5; if (g < 0) d -= .6;
    if (c.tr < -c.gdp * .1) d -= .5;
    if (war) { const sc = warScoreFor(S.player); d += k === 'jov' ? -1.2 : k === 'mil' ? (sc >= 0 ? 1 : -1.5) : -.25; }
    s.a = clamp(s.a + d, 0, 100);
  }
  const ap = approval();
  const target = 32 + ap * .5 + lawSum('stab') + (g > 0 ? 3 : -4) - (war ? 6 : 0) - (c.tr < -c.gdp * .2 ? 8 : 0);
  c.stab = clamp(c.stab + (target - c.stab) * .12 + mod('stabT') + rr(-1, 1), 0, 100);
  pol.cp = clamp(pol.cp + 3 + mod('cp') + (ap > 60 ? 1 : 0) - (ap < 35 ? 1 : 0), 0, 12);
  if (mod('repPazT') && !war) repAdd('paz', mod('repPazT'));
}

/* ---- elecciones ---- */
function electionTurn() {
  if (!isDem() || S.over) return;
  const left = S.pol.nextElec - S.turn;
  if (left === 2) {
    const opts = [
      { t: 'Campaña millonaria', fx: [['$g', -.6], ['camp', 5]] },
      { t: 'Prometerlo todo', fx: [['camp', 6]], hid: [['later', 4, .8, [['sec', 'all', -6]], 'Las promesas de campaña incumplidas te pasan factura']] },
      { t: 'Campaña limpia y austera', fx: [['camp', 1], ['rep', 'dem', 3]] }];
    if (P().reg === 'hib' || mod('graft') || mod('decree')) opts.push({ t: 'Preparar el fraude', fx: [['camp', 12], ['rep', 'dem', -15]], hid: [['chance', .4, [['later', 3, 1, [['stab', -20], ['sec', 'all', -10], ['rep', 'conf', -10]], 'Pruebas del fraude electoral sacan al país a la calle']], []]] });
    pushPend({ k: 'elec', t: 'Arranca la campaña electoral', x: `Faltan dos trimestres para las elecciones. Tu aprobación está en ${Math.round(approval())}%. ¿Cómo vas a pelear la reelección?`, iso: S.player, opts });
  }
  if (left <= 0) {
    const lc = localCtl();
    const share = clamp(50 + (approval() - 50) * .9 + mod('elect') + lawSum('elect') + S.pol.camp + 2 + (P().reg === 'hib' ? 5 : 0) + (lc == null ? 0 : (lc - .5) * 4) - (S.flags.scandal ? 4 : 0) + rr(-4, 4), 5, 95);
    const win = share >= 50; S.pol.camp = 0; delete S.flags.scandal;
    Bus.emit('election', { share, win });
    if (!win) { news(`${S.leader.n} pierde las elecciones con el ${share.toFixed(1)}% de los votos`, 'elec', S.player, 3); return over('eleccion'); }
    S.pol.nextElec = S.turn + 16; S.stats.elections++;
    // el congreso y los gobiernos locales se recomponen según el resultado
    const d = (share - 50) * .5, gov = S.pol.seats[0], opp = S.pol.seats.filter(p => !p.g).sort((a, b) => b.s - a.s)[0];
    if (opp) { const x = clamp(d, -gov.s + 5, opp.s - 3); gov.s += x; opp.s -= x; }
    const rul = D.SUB_RULING[S.player];
    if (rul && !P().custom) for (const t of P().terr) if (t.o === S.player && t.p) { if (t.p !== rul && chance((share - 50) / 40)) t.p = rul; else if (t.p === rul && chance((54 - share) / 30)) t.p = 'Oposición'; }
    secAdd('all', 2);
    news(`${S.leader.n} gana la reelección con el ${share.toFixed(1)}% de los votos`, 'elec', S.player, 3);
  }
}


/* ---------- engine/40-diplomacy.js ---------- */
/* =====================================================================
   SISTEMA · DIPLOMACIA: tratados, visitas, ayuda, sanciones, bases,
   territorio por tratado y asilo. Cada país recuerda (S.mods).
   ===================================================================== */
const TNEED = { com: 5, pna: 15, ali: 45, def: 60 }, TCP = { com: 1, pna: 1, ali: 2, def: 3 };
const TNAME = { com: 'Tratado comercial', pna: 'Pacto de no agresión', ali: 'Alianza', def: 'Pacto de defensa mutua' };
const gain = v => v * Math.max(.2, 1 + mod('relGain'));

function addTreaty(t, a, b) { if (hasExplicit(t, a, b)) return; S.tr.push({ t, a, b, s: S.turn }); dirty(); }
function endTreaties(a, b, types) { const n = S.tr.length; S.tr = S.tr.filter(t => !(((t.a === a && t.b === b) || (t.a === b && t.b === a)) && (!types || types.includes(t.t)))); if (S.tr.length !== n) dirty(); return n - S.tr.length; }
function addSanction(by, on) { if (sanctioned(by, on) || by === on) return false; S.sanc.push({ by, on, s: S.turn }); endTreaties(by, on, ['com']); dirty(); return true; }
function liftSanction(by, on) { const n = S.sanc.length; S.sanc = S.sanc.filter(s => !(s.by === by && s.on === on)); dirty(); return n !== S.sanc.length; }
const sumPow = list => list.reduce((s, x) => s + power(x), 0);
/* amenaza percibida: el vecino hostil más fuerte frente a mi fuerza y la de mis aliados */
function threat(iso) {
  const mine = power(iso) + .5 * sumPow(alliesOf(iso)) + 1; let worst = inWar(iso) ? 1.2 : 0;
  for (const r of nb(iso)) if (rel(iso, r) < -30) worst = Math.max(worst, (power(r) + .3 * sumPow(alliesOf(r))) / mine);
  return worst;
}
function relAll(v, label, filter, T) {
  const me = S.player;
  for (const z of alive()) {
    if (z === me) continue; const c = S.c[z];
    const ok = filter === 'big' ? c.gdp > 500 : filter === 'rich' ? c.gdp / c.pop > 20 : filter === 'friends' ? rel(me, z) > 30 : filter === 'trade' ? hasT('com', me, z)
      : filter === 'enemiesOfT' ? T && z !== T && rel(z, T) < -30 : filter === 'neighbors' ? nb(me).includes(z) : true;
    if (ok) addMod(me, z, label || 'Tus decisiones', v > 0 ? gain(v) : v, .5, v < 0);
  }
}

/* evaluación de un tratado: la UI la muestra antes de proponer */
function treatyEval(type, iso) {
  const me = S.player, r = rel(me, iso), R = [['Relación actual', r]]; let s = r;
  const add = (t, v) => { v = Math.round(v); if (v) { R.push([t, v]); s += v; } };
  add('Tus rasgos', mod('treatyAcc')); add('Tu fama de confiable', S.rep.conf * .15);
  if (type === 'ali' || type === 'def') {
    const strong = power(me) > power(iso); add(strong ? 'Les conviene tu ejército' : 'Eres más débil que ellos', strong ? 8 : -5);
    if (threat(iso) > 1) add('Se sienten amenazados', 12);
    if (inWar(me)) add('No quieren heredar tu guerra', -15);
    add('Eres aliado de sus rivales', -12 * Math.min(2, alliesOf(me).filter(a => a !== iso && rel(iso, a) < -40).length));
  }
  if (type === 'com') add('Interés económico', Math.min(10, P().gdp / C(iso).gdp * 3));
  add('Agravios que no olvidan', grudge(iso, me) * .5);
  return { score: Math.round(s), need: TNEED[type], reasons: R, odds: s - TNEED[type] };
}
function dipCheck(iso) {
  if (!S.c[iso] || iso === S.player) return 'País inválido';
  if (!S.c[iso].alive) return `${nm(iso)} ya no existe como Estado`;
  if (atWar(S.player, iso)) return `Estás en guerra con ${nm(iso)}`;
  return null;
}
ACT.propose = a => {
  const iso = a.iso, t = a.t, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  if (!TNEED[t]) return fail('Tratado desconocido');
  if (hasT(t, me, iso)) return fail(`Ya tienes ese acuerdo con ${nm(iso)}`);
  if (t === 'com' && IX().sp[key(me, iso)]) return fail('Hay sanciones entre ambos: levántalas primero');
  const c = C(iso); if ((c.ask[t] || 0) > S.turn) return fail(`${nm(iso)} no quiere volver a discutirlo todavía (${c.ask[t] - S.turn} turnos)`);
  if (!useCP(TCP[t])) return fail(`Necesitas ${TCP[t]} de capital político`);
  const ev = treatyEval(t, iso);
  if (ev.score + rr(-6, 6) < ev.need) { c.ask[t] = S.turn + 3; addMod(me, iso, 'Propuesta rechazada', -3, 1); return { ok: false, msg: `${nm(iso)} rechaza tu ${TNAME[t].toLowerCase()}` }; }
  addTreaty(t, me, iso); addMod(me, iso, 'Firma de tratado', gain(6), .5);
  if (t !== 'com') repAdd('conf', 2); if (t === 'pna') repAdd('paz', 2);
  news(`${P().n} y ${nm(iso)} firman: ${TNAME[t]}`, 'dip', iso, 2);
  Bus.emit('treaty', { t, a: me, b: iso, name: TNAME[t] }); if (t === 'com') Bus.emit('route', { a: me, b: iso });
  return { msg: `${nm(iso)} firma: ${TNAME[t]}` };
};
ACT.breakTreaty = a => {
  const iso = a.iso, t = a.t, me = S.player; if (!hasExplicit(t, me, iso)) return fail('No existe ese tratado (los de bloque no se rompen uno a uno)');
  endTreaties(me, iso, [t]); const k = 1 + mod('betray');
  addMod(me, iso, 'Rompiste un tratado', -(t === 'com' ? 15 : t === 'pna' ? 25 : 40) * k, .3, 1);
  repAdd('conf', -(t === 'com' ? 5 : t === 'pna' ? 10 : 18) * k);
  for (const z of alliesOf(iso)) if (z !== me) addMod(me, z, 'No cumples tu palabra', -6 * k, .4, 1);
  news(`${P().n} rompe su ${TNAME[t].toLowerCase()} con ${nm(iso)}`, 'dip', iso, 2);
  return { msg: `Rompes el tratado. ${nm(iso)} y sus aliados lo recordarán.` };
};
ACT.visit = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const c = C(iso); if ((c.ask.visit || 0) > S.turn) return fail(`Acabas de reunirte con ${nm(iso)}: espera ${c.ask.visit - S.turn} turnos`);
  if (!canPay(.3)) return fail('No hay fondos para el viaje'); if (!useCP(1)) return fail('Necesitas 1 de capital político');
  P().tr -= .3; c.ask.visit = S.turn + 3; Bus.emit('trip', { a: me, b: iso });
  if (rel(me, iso) < -40 && chance(.35)) { addMod(me, iso, 'Desaire en visita oficial', -5, .5); return { ok: false, msg: `${c.lider.n} te recibe con frialdad: la visita empeora las cosas` }; }
  const g = gain(ri(5, 10)); addMod(me, iso, 'Visita de Estado', g, .5);
  return { msg: `Visita a ${nm(iso)}: relación +${Math.round(g)}` };
};
ACT.invite = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const c = C(iso); if ((c.ask.visit || 0) > S.turn) return fail(`Acabas de reunirte con ${nm(iso)}: espera ${c.ask.visit - S.turn} turnos`);
  if (!canPay(.5)) return fail('No hay fondos para la recepción'); if (!useCP(1)) return fail('Necesitas 1 de capital político');
  c.ask.visit = S.turn + 3;
  if (rel(me, iso) <= -20) { addMod(me, iso, 'Invitación rechazada', -2, 1); return { ok: false, msg: `${c.lider.n} rechaza tu invitación` }; }
  P().tr -= .5; Bus.emit('trip', { a: iso, b: me });
  const g = gain(ri(4, 8)); addMod(me, iso, 'Recepción oficial', g, .5); secAdd('all', 1);
  return { msg: `${c.lider.n} visita tu capital: relación +${Math.round(g)} y algo de prestigio en casa` };
};
/* regalar ayuda económica (eco), material (mat: materia prima) o militar (mil: % de una categoría) */
ACT.giveAid = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const c = C(iso), p = P(); let val = 0, what = '';
  if (a.kind === 'eco') { val = +a.v; if (!(val > 0) || !canPay(val)) return fail('No tienes esos fondos'); p.tr -= val; c.tr += val; what = money(val); }
  else if (a.kind === 'mat') { const q = Math.min(+a.v, p.stock[a.k] || 0); if (!(q > 0)) return fail('No tienes existencias de ese recurso'); p.stock[a.k] -= q; val = q * S.mkt.com[a.k].p; what = `${Math.round(q)} u de ${D.COMMODITIES[a.k].n.toLowerCase()}`; }
  else if (a.kind === 'mil') {
    const cl = costLvl(me); let n = 0;
    for (const k in D.UNITS) if (D.UNITS[k].cat === a.k) { const x = Math.floor((p.u[k] || 0) * clamp(+a.v, .05, .5)); p.u[k] -= x; c.u[k] = (c.u[k] || 0) + x; n += x; val += x * D.UNITS[k].cost * cl; }
    if (!n) return fail('No tienes unidades suficientes para enviar'); what = `${n} unidades de ${D.CATS[a.k].toLowerCase()}`;
    secAdd('mil', -3); for (const z of enemiesOf(iso)) addMod(me, z, 'Armaste a su enemigo', -15, .3, 1);
  } else return fail('Tipo de ayuda desconocido');
  const g = gain(clamp(30 * val / (c.gdp * .01 + .01), 2, a.kind === 'mil' ? 35 : 30));
  addMod(me, iso, a.kind === 'mil' ? 'Ayuda militar' : 'Ayuda recibida', g, .5); c.stab = clamp(c.stab + 2, 0, 100);
  repAdd('gen', clamp(val / (p.gdp * .002), 1, 6));
  if (a.kind !== 'mil') for (const z of enemiesOf(iso)) addMod(me, z, 'Financiaste a su enemigo', -8, .5, 1);
  news(`${p.n} envía ayuda a ${c.n}: ${what}`, 'dip', iso);
  Bus.emit('trip', { a: me, b: iso, cargo: 1 });
  return { msg: `${c.n} agradece la ayuda: relación +${Math.round(g)}` };
};
ACT.askAid = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const c = C(iso), p = P(); if ((c.ask.aid || 0) > S.turn) return fail(`Ya le pediste ayuda hace poco (${c.ask.aid - S.turn} turnos)`);
  if (!useCP(1)) return fail('Necesitas 1 de capital político');
  c.ask.aid = S.turn + 6; const r = rel(me, iso) + mod('aid');
  const need = a.kind === 'mil' ? 55 : 40;
  if (r < need || (a.kind === 'mil' && !alliesOf(me).includes(iso)) || (a.kind === 'mat' && (c.rec[a.k] || 0) < 3)) { addMod(me, iso, 'Pediste ayuda sin éxito', -2, 1); return { ok: false, msg: `${c.n} se niega a ayudarte${a.kind === 'mil' ? ': solo arma a sus aliados cercanos' : ''}` }; }
  let what;
  if (a.kind === 'eco') { const v = Math.min(c.gdp * .003, p.gdp * .02); p.tr += v; c.tr -= v; what = money(v); }
  else if (a.kind === 'mat') { p.stock[a.k] = (p.stock[a.k] || 0) + 6; what = `6 u de ${D.COMMODITIES[a.k].n.toLowerCase()}`; }
  else { let n = 0; for (const k of ['inf', 'tan', 'art']) { const x = Math.floor((c.u[k] || 0) * .05); c.u[k] -= x; p.u[k] = (p.u[k] || 0) + x; n += x; } what = `${n} unidades terrestres`; }
  addMod(me, iso, 'Les debes un favor', -8, .5); repAdd('gen', -2);
  news(`${c.n} envía ayuda a ${p.n}: ${what}`, 'dip', iso); Bus.emit('trip', { a: iso, b: me, cargo: 1 });
  return { msg: `${c.n} te envía ${what}. Ahora les debes un favor.` };
};
ACT.sanction = a => {
  const iso = a.iso, me = S.player; if (!S.c[iso] || !S.c[iso].alive || iso === me) return fail('País inválido');
  if (sanctioned(me, iso)) return fail('Ya lo tienes sancionado'); if (!useCP(2)) return fail('Necesitas 2 de capital político');
  const aggr = S.wars.some(w => w.att[0] === iso && !w.casus);
  addSanction(me, iso); addMod(me, iso, 'Les impusiste sanciones', -15, .3, 1); repAdd('paz', aggr ? 3 : -2);
  for (const z of alive()) { if (z === me || z === iso) continue; if (alliesOf(iso).includes(z)) addMod(me, z, 'Sancionaste a su aliado', -6, .5, 1); else if (rel(z, iso) < -40) addMod(me, z, 'Sancionaste a su rival', gain(6), .5); }
  news(`${P().n} impone sanciones a ${nm(iso)}`, 'dip', iso, 2);
  return { msg: `Sanciones contra ${nm(iso)}: su economía crecerá menos y el comercio entre ambos se corta` };
};
ACT.lift = a => {
  if (!liftSanction(S.player, a.iso)) return fail('No tienes sanciones contra ese país');
  addMod(S.player, a.iso, 'Levantaste las sanciones', gain(8), .5); news(`${P().n} levanta las sanciones a ${nm(a.iso)}`, 'dip', a.iso);
  return { msg: `Levantas las sanciones a ${nm(a.iso)}` };
};
/* base estratégica en suelo extranjero: da alcance militar sobre su región */
ACT.base = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  if (S.bases.some(b => b.by === me && b.in === iso)) return fail('Ya tienes una base allí');
  const cost = 5 * costLvl(iso) + 2; if (!canPay(cost)) return fail(`Necesitas ${money(cost)}`); if (S.pol.cp < 2) return fail('Necesitas 2 de capital político');
  const sc = rel(me, iso) + (threat(iso) > 1 ? 15 : 0) + mod('treatyAcc');
  if (!alliesOf(me).includes(iso) && sc < 70) { useCP(1); addMod(me, iso, 'Pediste instalar una base', -3, 1); return { ok: false, msg: `${nm(iso)} no acepta tropas extranjeras en su suelo (necesitas alianza o relación de 70)` }; }
  useCP(2); P().tr -= cost; S.bases.push({ by: me, in: iso, s: S.turn }); dirty();
  for (const z of alive()) if (z !== me && z !== iso && (rel(z, iso) < -40 || (D.C[iso].bord.includes(z) && rel(me, z) < 0))) addMod(me, z, `Tu base militar en ${nm(iso)}`, -12, .3, 1);
  news(`${P().n} abre una base militar en ${nm(iso)}`, 'mil', iso, 2);
  return { msg: `Base establecida en ${nm(iso)}: ahora tienes alcance militar en ${D.REGIONS[D.C[iso].region]}` };
};

/* ---- territorio ---- */
function moveTerr(victim, i, taker, k) { // k = fracción del PIB que sobrevive al cambio de manos
  const v = C(victim), t = v.terr[i], own = ownCount(victim); if (!t || t.o !== victim || !own) return false;
  const g = v.gdp / own, pp = v.pop / own; v.gdp -= g; v.pop -= pp; t.o = taker; t.g = g; t.pp = pp; t.k = k;
  C(taker).gdp += g * k; C(taker).pop += pp; dirty(); return true;
}
function restoreTerr(victim, i) {
  const v = C(victim), t = v.terr[i]; if (!t || t.o === victim) return false;
  const tk = C(t.o); if (tk.alive) { tk.gdp = Math.max(tk.gdp * .2, tk.gdp - (t.g || 0) * (t.k || 1)); tk.pop = Math.max(.01, tk.pop - (t.pp || 0)); }
  v.gdp += t.g || 0; v.pop += t.pp || 0; t.o = victim; delete t.g; delete t.pp; delete t.k; dirty(); return true;
}
ACT.buyTerr = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const v = C(iso), i = +a.i, t = v.terr[i]; if (!t || t.o !== iso) return fail('Ese territorio no está disponible');
  if (i === 0) return fail('Ningún país vende su capital'); if (ownCount(iso) <= 2) return fail('No le queda territorio que ceder');
  if (!nb(me).includes(iso)) return fail('Solo puedes negociar territorio con países vecinos');
  const price = v.gdp / ownCount(iso) * 6; if (!canPay(price)) return fail(`Piden ${money(price)}`); if (S.pol.cp < 3) return fail('Necesitas 3 de capital político');
  if (rel(me, iso) < 55 - (v.stab < 35 ? 15 : 0)) { useCP(1); addMod(me, iso, 'Quisiste comprar su territorio', -6, .5, 1); return { ok: false, msg: `${nm(iso)} se ofende: su territorio no está en venta (necesitas relación de 55)` }; }
  useCP(3); P().tr -= price; v.tr += price; moveTerr(iso, i, me, 1);
  news(`${nm(iso)} cede ${t.n} a ${P().n} por tratado`, 'dip', iso, 3); Bus.emit('treaty', { t: 'terr', a: me, b: iso, name: 'Cesión de ' + t.n });
  return { msg: `${t.n} pasa a tu soberanía por ${money(price)}` };
};
ACT.cedeTerr = a => {
  const iso = a.iso, me = S.player, e = dipCheck(iso); if (e) return fail(e);
  const i = +a.i, t = P().terr[i]; if (!t || t.o !== me || i === 0) return fail('No puedes ceder ese territorio');
  if (ownCount(me) <= 2) return fail('No te queda territorio que ceder'); if (!nb(me).includes(iso)) return fail('Solo puedes ceder territorio a un vecino');
  moveTerr(me, i, iso, 1); addMod(me, iso, 'Les cediste territorio', gain(35), .2); secAdd('mil', -10); secAdd('all', -4); repAdd('gen', 3); repAdd('paz', 4);
  news(`${P().n} cede ${t.n} a ${nm(iso)} por tratado`, 'dip', iso, 3); Bus.emit('treaty', { t: 'terr', a: me, b: iso, name: 'Cesión de ' + t.n });
  return { msg: `Cedes ${t.n} a ${nm(iso)}. En casa no lo celebran.` };
};
/* asilo: abdicar hacia un país amigo, o buscar refugio tras caer */
ACT.asylum = a => {
  const iso = a.iso, me = S.player; if (!S.c[iso] || !S.c[iso].alive || iso === me) return fail('País inválido');
  if (S.over && S.over.asylum !== undefined) return fail('Ya pediste asilo');

  if (!S.over) { if (!ok) { addMod(me, iso, 'Pediste asilo', -2, 1); return fail(`${nm(iso)} no te daría asilo (necesitas relación de 30)`); } over('exilio'); }
  S.over.asylum = ok ? iso : null; S.over.asked = iso;

/* ---------- engine/50-war.js ---------- */
/* =====================================================================
   SISTEMA · GUERRA: declaración con reacciones en cadena, batallas por
   turno, conquista territorio a territorio, paz, anexión y títeres.
   war = { id, att:[líder,...], def:[líder,...], s:turno, score:-100..100 (a favor del atacante), casus }
   ===================================================================== */
const warById = id => S.wars.find(w => w.id === id);
function warScoreFor(iso) { let s = 0; for (const w of warsOf(iso)) s += w.att.includes(iso) ? w.score : -w.score; return s; }

function joinWar(w, iso, side) {
  if (w.att.includes(iso) || w.def.includes(iso) || !C(iso).alive) return;
  const foes = side === 'att' ? w.def : w.att; if (foes.some(f => alliesOf(iso).includes(f) && hasExplicit('def', iso, f))) return;
  w[side].push(iso); for (const f of foes) endTreaties(iso, f); dirty();
  addMod(iso, foes[0], 'Guerra entre ambos', -30, .25, 1);
  news(`${nm(iso)} entra en la guerra del lado de ${nm(w[side][0])}`, 'war', iso, isP(iso) || isP(w.att[0]) || isP(w.def[0]) ? 3 : 2);
}
function callToArms(w, ally, foe, side) {

/* =====================================================================
   SISTEMA · EVENTOS: intérprete de efectos (fx), eventos interactivos,
   titulares del mundo, consecuencias diferidas y Asamblea de la ONU.
   ===================================================================== */
const REPN = { paz: 'Reputación pacífica', conf: 'Confianza mundial', dem: 'Reputación democrática', gen: 'Reputación generosa' };
const RELF = { big: 'Relación con las potencias', rich: 'Relación con los países ricos', friends: 'Relación con tus amigos', trade: 'Relación con tus socios comerciales', enemiesOfT: 'Relación con sus enemigos', neighbors: 'Relación con tus vecinos' };

function applyFx(list, ctx) {
  const c = P(), T = ctx && ctx.T;
  for (const f of list || []) {
    const [k, a, b, d, e] = f;
    switch (k) {
      case '$': c.tr += a; break;
      case '$g': c.tr += c.gdp * a / 100; break;
      case 'stab': c.stab = clamp(c.stab + a, 0, 100); break;
      case 'cp': S.pol.cp = clamp(S.pol.cp + a, 0, 12); break;
      case 'sec': secAdd(a, b); break;
      case 'rep': repAdd(a, b); break;
      case 'rel': { const t = a === 'T' ? T : a; if (t && t !== S.player && S.c[t] && S.c[t].alive) addMod(S.player, t, d || 'Una decisión tuya', b > 0 ? gain(b) : b, .5, b < 0); break; }
      case 'relAll': relAll(a, b, d, T); break;
      case 'grow': S.gm.push({ v: a, t: b }); break;
      case 'price': case 'stock': S.mkt.shocks.push({ k: a, m: b }); break;
      case 'stockHome': S.mkt.shocks.push({ k: 'home', m: a }); break;
      case 'sent': S.mkt.sent += a; break;
      case 'prod': c.rec[a] = Math.min(5, (c.rec[a] || 0) + b); break;
      case 'units': for (const u in D.UNITS) if (D.UNITS[u].cat === a) c.u[u] = Math.max(0, Math.round((c.u[u] || 0) * (1 + b / 100))); break;
      case 'flag': S.flags[a] = 1; break;
      case 'camp': S.pol.camp += a; break;
      case 'sellRes': for (const r in c.stock) { c.tr += c.stock[r] * a * S.mkt.com[r].p; c.stock[r] *= 1 - a; } break;
      case 'later': S.later.push({ t: S.turn + a, p: b, fx: d, msg: e, T }); break;
      case 'chance': applyFx(chance(a) ? b : d, ctx); break;
      case 'chanceAppr': applyFx(chance(clamp(approval() / 100 + .1, .1, .9)) ? a : b, ctx); break;
      case 'over': over(a); break;
      case 'do': if (OPS[a]) OPS[a](b || {}); break;
    }
  }
}
/* texto de cada efecto para la UI: [texto, tono] con tono >0 bueno, <0 malo, 0 neutro */
function describeFx(list, T) {
  const out = [], sub = (l) => describeFx(l, T).forEach(x => out.push(['· ' + x[0], x[1]]));
  for (const f of list || []) {
    const [k, a, b, d] = f;
    if (k === '$') out.push([(a >= 0 ? '+' : '−') + money(Math.abs(a)), a]);
    else if (k === '$g') out.push([(a >= 0 ? '+' : '−') + money(Math.abs(P().gdp * a / 100)), a]);
    else if (k === 'stab') out.push(['Estabilidad ' + sg(a), a]);
    else if (k === 'cp') out.push(['Capital político ' + sg(a), a]);
    else if (k === 'sec') out.push([(a === 'all' ? 'Todos los sectores' : D.SECTORS[a].n) + ' ' + sg(b), b]);
    else if (k === 'rep') out.push([REPN[a] + ' ' + sg(b), b]);
    else if (k === 'rel') { const t = a === 'T' ? T : a; if (t && S.c[t]) out.push(['Relación con ' + nm(t) + ' ' + sg(b), b]); }
    else if (k === 'relAll') out.push([(RELF[d] || 'Relación con todos') + ' ' + sg(a), a]);
    else if (k === 'grow') out.push([`Crecimiento ${sg(a)} pp durante ${b} turnos`, a]);
    else if (k === 'prod') out.push([`Producción de ${D.COMMODITIES[a].n.toLowerCase()} +${b}`, 1]);
    else if (k === 'units') out.push([`Fuerzas de ${D.CATS[a].toLowerCase()} ${sg(b)}%`, b]);
    else if (k === 'price') out.push([`${D.COMMODITIES[a].n} ${b > 1 ? '▲' : '▼'}`, 0]);
    else if (k === 'stock') out.push([`Bolsa${D.STOCK_SECTORS[a] ? ' · ' + D.STOCK_SECTORS[a] : a === 'home' ? ' nacional' : ''} ${b > 1 ? '▲' : '▼'}`, b > 1 ? 1 : -1]);
    else if (k === 'camp') out.push([`Campaña +${a} pts`, 1]);
    else if (k === 'sellRes') out.push([`Vendes el ${Math.round(a * 100)}% de tus reservas`, -1]);
    else if (k === 'over') out.push(['Pierdes el poder', -1]);
    else if (k === 'later') { out.push([`En ${a} turnos (${Math.round(b * 100)}%):`, 0]); sub(d); }
    else if (k === 'chance') { out.push([`${Math.round(a * 100)}% de probabilidad:`, 0]); sub(b); if (d && d.length) { out.push(['Si no:', 0]); sub(d); } }
    else if (k === 'chanceAppr') { out.push([`${Math.round(clamp(approval() / 100 + .1, .1, .9) * 100)}% de éxito (depende de tu aprobación):`, 0]); sub(a); out.push(['Si fracasa:', 0]); sub(b); }
  }
  return out;
}

/* ---- eventos interactivos ---- */
function pickTarget(kind) {
  const me = S.player, near = nb(me);
  if (kind === 'rival') { let best = null, bv = -15; for (const z of alive()) if (z !== me && (near.includes(z) || C(z).gdp > 700)) { const r = rel(me, z); if (r < bv) { bv = r; best = z; } } return best; }

  if (kind === 'ally') { const a = alliesOf(me); return a.length ? pick(a) : null; }

}
function condOk(q) {

  if (q.turnGte && S.turn < q.turnGte) return false;
  if (q.stabLt && !(P().stab < q.stabLt)) return false;
  if (q.secLt && !(S.pol.sec[q.secLt[0]].a < q.secLt[1])) return false;
  if (q.debt && !(P().tr < -P().gdp * .12)) return false;
  if (q.rival && !pickTarget('rival')) return false;

}
function eventOk(e) {

  return condOk(q);
}
function playerEvent() {
  if (S.over) return;

  const urgent = ok.filter(e => e.w >= 30);
  if (!urgent.length && !chance(.55)) return;
  const sc = Math.max(.3, 1 + mod('scandal') + lawSum('scandal'));
  const e = urgent.length ? pick(urgent) : wpick(ok, x => x.w * (x.scandal ? sc : 1));

  S.evSeen[e.id] = S.turn; if (e.pre) applyFx(e.pre, {});
  const sub = s => T ? s.split('{T}').join(nm(T)) : s;
  pushPend({ k: 'event', id: e.id, t: e.t, x: sub(e.x), iso: T || S.player, opts: e.opts.map(o => ({ t: sub(o.t), fx: o.fx || [], hid: o.hid || [] })) });
}
ACT.decide = a => {
  const p = S.pend[0], o = p && p.opts[+a.i]; if (!o) return fail('No hay decisión pendiente');
  if (o.req && o.req.cp && S.pol.cp < o.req.cp) return fail(`Necesitas ${o.req.cp} de capital político`);
  S.pend.shift();
  const shown = describeFx(o.fx, p.iso);

  if (p.k === 'event') news(`${p.t}: ${o.t.charAt(0).toLowerCase() + o.t.slice(1)}`, 'pol', S.player);

/* ---- titulares del mundo ---- */
function worldEvents() {
  const n = (chance(.75) ? 1 : 0) + (chance(.25) ? 1 : 0), used = [];
  for (let i = 0; i < n; i++) {
    const e = wpick(D.WORLD_EVENTS.filter(x => !used.includes(x) && x.t !== S.flags.lastWE), x => x.w); if (!e) break; used.push(e); S.flags.lastWE = e.t;
    let X = null;
    if (e.x) { const pool = alive().filter(z => e.x === 'any' ? C(z).gdp > 30 : e.x === 'unstable' ? C(z).stab < 45 : (C(z).rec[e.x.slice(5)] || 0) >= 3); if (!pool.length) continue; X = pick(pool); }

/* ---- Asamblea de la ONU: una resolución cada 4 turnos ---- */
const UNT = { condena: 'Condena', sanc: 'Sanciones internacionales', cese: 'Alto el fuego', clima: 'Pacto climático', ayuda: 'Ayuda humanitaria', comercio: 'Acuerdo de libre comercio' };
function unText(r) {

/* ---------- ui/40-panels.js ---------- */
/* =====================================================================
   INTERFAZ · paneles del gabinete: Economía, Política, Diplomacia,
   Ejército, Mundo, Editor (modo dios) y Partida
   ===================================================================== */
const PT = { eco: 'Economía', pol: 'Política interna', dip: 'Diplomacia', mil: 'Fuerzas armadas', world: 'El mundo', edit: 'Editor · modo dios', sys: 'Partida' };
const PTABS = {
  eco: [['pre', 'Presupuesto'], ['rec', 'Materias primas'], ['com', 'Comercio'], ['bol', 'Bolsa']],
  pol: [['ley', 'Leyes'], ['con', 'Congreso'], ['sec', 'Sectores'], ['reg', 'Regiones'], ['ele', 'Elecciones']],
  dip: [['rel', 'Relaciones'], ['tra', 'Tratados'], ['onu', 'ONU'], ['rep', 'Reputación']],
  mil: [['fue', 'Fuerzas'], ['bas', 'Bases'], ['gue', 'Guerras']],
  world: [['ran', 'Ranking'], ['not', 'Noticias']]
};
function panelHTML() {
  const p = UI.panel, t = PTABS[p] ? curTab(p, PTABS[p][0][0]) : '';
