<title>Pelotazo</title>
<meta name="theme-color" content="#0d1f16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Juego a pantalla completa: el lienzo 3D detrás y la interfaz encima. Estilo de un solo mundo (oscuro). */
:root{
  --noche:#0d1f16;          /* fondo y paneles */
  --panel:rgba(9,24,17,.86);
  --tiza:#f3f6ee;           /* texto principal, como las líneas del campo */
  --gris:#a7b9ab;
  --amarillo:#ffd23f;       /* el jugador que controlas */
  --local:#2f7bff;
  --visita:#e8463a;
  --borde:rgba(243,246,238,.18);
  --f-titulo:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-texto:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--noche);color:var(--tiza);font-family:var(--f-texto);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* ---------- marcador y avisos ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px)}
#marcador{display:inline-flex;align-items:stretch;border-radius:10px;overflow:hidden;background:var(--panel);font-family:var(--f-titulo);font-size:18px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#marcador .eq{padding:7px 9px;letter-spacing:.04em}
#marcador .eq.l{background:var(--local)} #marcador .eq.v{background:var(--visita)}
#marcador .gol{padding:7px 10px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
#marcador .reloj{padding:7px 10px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
#quien{margin-top:6px;font-size:13px;font-weight:800;color:var(--amarillo);text-shadow:0 1px 3px rgba(0,0,0,.8)}
#radar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:132px;height:86px;border-radius:6px;opacity:.85}
#bPausa{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);width:42px;height:42px;border-radius:12px;border:1px solid var(--borde);background:var(--panel);font-family:var(--f-titulo);font-size:16px}
#aviso{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-titulo);font-size:clamp(34px,8vw,76px);letter-spacing:.02em;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
#aviso small{display:block;font-family:var(--f-texto);font-weight:800;font-size:clamp(14px,2.6vw,20px);margin-top:4px}
#aviso.ver{opacity:1}
#aviso.chico{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:clamp(20px,4vw,30px)}
@media (max-width:600px){#radar{left:auto;right:calc(env(safe-area-inset-right,0px) + 12px);transform:none;top:calc(env(safe-area-inset-top,0px) + 58px);width:100px;height:65px}}
#potencia{position:absolute;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 250px);width:150px;height:12px;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid var(--borde);overflow:hidden;opacity:0;transition:opacity .1s}
#potencia i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be36b,var(--amarillo) 70%,#ff6b3d)}
#potencia.ver{opacity:1}
#girar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:800;display:none}
body.tactil.vertical #girar{display:block}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;max-width:min(90vw,420px);text-align:center;opacity:0;transition:opacity .25s}
#toast.ver{opacity:1}

/* ---------- controles táctiles ---------- */
#tactil{position:fixed;inset:0;display:none;pointer-events:none}
body.tactil #tactil{display:block}
#zonaStick{position:absolute;left:0;bottom:0;width:48%;height:70%;pointer-events:auto}
#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(243,246,238,.35);background:rgba(0,0,0,.18);left:calc(env(safe-area-inset-left,0px) + 110px);top:calc(100% - env(safe-area-inset-bottom,0px) - 110px)}
#stickBase.activo{background:rgba(0,0,0,.28)}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(243,246,238,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#stickKnob.sprint{background:var(--amarillo)}
#botones{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:236px;height:220px;pointer-events:none}
.b{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(10,24,17,.55);font-weight:800;font-size:13px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.b.on{background:rgba(255,210,63,.85);color:#1b1400;border-color:#fff}
.b.apagado{opacity:.4}
.b[data-b="shot"]{width:92px;height:92px;right:0;top:20px;font-family:var(--f-titulo);font-size:20px;background:rgba(232,70,58,.6)}
.b[data-b="pass"]{width:88px;height:88px;right:98px;top:104px;font-family:var(--f-titulo);font-size:19px;background:rgba(47,123,255,.6)}
.b[data-b="long"]{width:66px;height:66px;right:12px;top:126px}
.b[data-b="tackle"]{width:62px;height:62px;right:108px;top:28px}
.b[data-b="sprint"]{width:64px;height:64px;right:178px;top:20px}
@media (max-width:500px){#botones{transform:scale(.8);transform-origin:bottom right}#stickBase{left:calc(env(safe-area-inset-left,0px) + 76px)}}

/* ---------- pantallas (inicio, pausa, final) ---------- */
#capa{position:fixed;inset:0;background:rgba(6,16,11,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;touch-action:pan-y}
.hoja{width:min(560px,100%);background:var(--panel);border:1px solid var(--borde);border-radius:18px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto;touch-action:pan-y}
.hoja h1{font-family:var(--f-titulo);font-weight:400;font-size:clamp(40px,9vw,64px);margin:0;line-height:.95;letter-spacing:.01em;text-wrap:balance}
.hoja h1 span{color:var(--amarillo)}
.hoja h2{font-family:var(--f-titulo);font-weight:400;font-size:28px;margin:0 0 4px}
.hoja p{margin:8px 0;color:var(--gris);font-size:15px;line-height:1.45}
.etq{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);font-weight:800;margin:16px 0 6px}
.ayuda{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.ayuda b{color:var(--tiza);white-space:nowrap}
.ayuda span{color:var(--gris)}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px;background:rgba(255,255,255,.1)}
.btn.prin{background:var(--amarillo);color:#1b1400;font-family:var(--f-titulo);font-weight:400;font-size:22px;padding:12px 26px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--borde);background:transparent;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
.seg button.sel{background:var(--tiza);color:var(--noche);border-color:var(--tiza)}
.resultado{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--f-titulo);font-size:44px;margin:10px 0}
.resultado .eq{font-size:18px;padding:6px 10px;border-radius:8px}
.cifras{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.cifras span:nth-child(3n+1){text-align:right}
.cifras span:nth-child(3n+2){color:var(--gris);text-align:center}
.lista{display:grid;gap:6px;font-size:13px}
.lista div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--borde);padding-top:6px}
.lista button{border:1px solid var(--borde);background:transparent;border-radius:8px;padding:4px 10px;font-weight:800;font-size:12px}
@media (prefers-reduced-motion:reduce){#aviso,#toast,#potencia{transition:none}}
</style>

<canvas id="cv" tabindex="0" aria-label="Campo de juego"></canvas>
<div id="hud">
  <div id="marcador"><span class="eq l" id="nomL">HAL</span><span class="gol" id="goles">0 - 0</span><span class="eq v" id="nomV">TOR</span><span class="reloj" id="reloj">0'</span></div>
  <div id="quien"></div>
  <canvas id="radar" width="132" height="86"></canvas>
  <button id="bPausa" aria-label="Pausa">II</button>
  <div id="aviso"></div>
  <div id="potencia"><i></i></div>
  <div id="toast"></div>
  <div id="girar">Gira el teléfono para ver más campo</div>
</div>
<div id="tactil">
  <div id="zonaStick"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="botones">
    <button class="b" data-b="sprint">Sprint</button>
    <button class="b" data-b="tackle">Entrada</button>
    <button class="b" data-b="shot">Tiro</button>
    <button class="b" data-b="pass">Pase</button>
    <button class="b" data-b="long">Pase<br>largo</button>
  </div>
</div>
<div id="capa" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   PELOTAZO · fútbol de acción en 3D (capa 1: prototipo jugable)
   Secciones: utilidades · equipos · estado del partido · balón ·
   jugadores e IA · controles · reglas básicas · gráficos · interfaz ·
   guardado protegido · arranque
   ===================================================================== */
const JUEGO_VERSION = '0.1.0';

/* ---------- utilidades ---------- */
const PL = 105, PW = 68, HL = PL / 2, HW = PW / 2;     // campo en metros
const GW2 = 3.66, GH = 2.44, BR = 0.11;                // portería (media anchura, altura) y radio del balón
const AREA_D = 16.5, AREA_W2 = 20.16;
const DT = 1 / 60;                                     // paso fijo de la simulación
const GRAV = 9.8, ROCE = 0.6, AIRE = 0.08;             // rozamiento del balón en el suelo y en el aire
let semilla = 20261003;
function rng() { semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a, b) => a + (b - a) * rng();
const gauss = () => { let u = 0; while (!u) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const angDif = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
// distancia de un punto a un segmento (para saber si un pase tiene la línea libre)
function distSeg(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, l2 = vx * vx + vz * vz || 1;
  const t = clamp(((px - ax) * vx + (pz - az) * vz) / l2, 0, 1);
  return hyp(px - ax - vx * t, pz - az - vz * t);
}

/* ---------- equipos (nombres inventados) ---------- */
const NOMBRES = ['Teo', 'Bruno', 'Iker', 'Mateo', 'Dani', 'Leo', 'Hugo', 'Nico', 'Rafa', 'Tomás', 'Gael', 'Julián', 'Ciro', 'Elías', 'Fausto', 'Lalo', 'Remo', 'Simón', 'Uriel', 'Valen', 'Ximo', 'Yago', 'Abel', 'Íñigo', 'Pau', 'Quique', 'Saúl', 'Tobías'];
const APELLIDOS = ['Arrieta', 'Bustamante', 'Cendoya', 'Duarte', 'Escalona', 'Ferraz', 'Galindo', 'Herrán', 'Ibargüen', 'Jaramillo', 'Lozada', 'Montiel', 'Nájera', 'Olmedo', 'Pizarro', 'Quiroga', 'Robledo', 'Salcedo', 'Tovar', 'Urbina', 'Valdés', 'Zamora', 'Barragán', 'Corvalán', 'Echeverri', 'Fonseca', 'Gamarra', 'Larrea', 'Medrano', 'Ocampo', 'Peñalver', 'Riquelme', 'Sotomayor', 'Taboada', 'Villamil', 'Zubiri'];
const EQUIPOS = [
  { id: 'HAL', nombre: 'Halcones del Norte', camiseta: 0x2f7bff, pantalon: 0xf2f4f8, medias: 0x2f7bff, portero: 0x2bc46a },
  { id: 'TOR', nombre: 'Toros del Valle', camiseta: 0xe8463a, pantalon: 0x20222b, medias: 0xe8463a, portero: 0xffc928 },
];
// 4-3-3. fx: de la portería propia (0) a la rival (1); fz: de una banda (-1) a la otra (1)
const FORMACION = [
  { r: 'POR', fx: .03, fz: 0, n: 1 },
  { r: 'DEF', fx: .2, fz: -.72, n: 3 }, { r: 'DEF', fx: .17, fz: -.26, n: 4 }, { r: 'DEF', fx: .17, fz: .26, n: 5 }, { r: 'DEF', fx: .2, fz: .72, n: 2 },
  { r: 'MED', fx: .35, fz: 0, n: 6 }, { r: 'MED', fx: .42, fz: -.45, n: 8 }, { r: 'MED', fx: .42, fz: .45, n: 10 },
  { r: 'DEL', fx: .6, fz: -.7, n: 11 }, { r: 'DEL', fx: .66, fz: 0, n: 9 }, { r: 'DEL', fx: .6, fz: .7, n: 7 },
];
const PIEL = [0xf1c9a5, 0xd9a27b, 0xb47a4f, 0x8a5636, 0x5e3a24, 0xe8b894];
const PELO = [0x1d1510, 0x3b2516, 0x6b4423, 0xc99b4d, 0x0f0f12, 0x8a2f1a, 0xd8d0c0];

function crearEquipo(i) {
  const E = EQUIPOS[i];
  const eq = { i, ...E, dir: i === 0 ? 1 : -1, pl: [], goles: 0 };
  FORMACION.forEach((f, k) => {
    const st = r => clamp(r + rnd(-.12, .12), .3, .98);
    const p = {
      eq, k, rol: f.r, num: f.n, por: f.r === 'POR',
      nombre: APELLIDOS[Math.floor(rng() * APELLIDOS.length)], nombre1: NOMBRES[Math.floor(rng() * NOMBRES.length)],
      vel: st(f.r === 'DEL' ? .78 : f.r === 'DEF' ? .62 : .68), pas: st(f.r === 'MED' ? .8 : .66), tir: st(f.r === 'DEL' ? .78 : f.r === 'MED' ? .64 : .45),
      def: st(f.r === 'DEF' ? .8 : f.r === 'MED' ? .64 : .45), reg: st(f.r === 'DEL' ? .75 : .62), par: st(.72),
      base: f, x: 0, z: 0, vx: 0, vz: 0, cara: 0, fase: rng() * 6,
      tx: 0, tz: 0, prisa: false,
      entrada: null, entT: 0, entCD: 0, entHecha: false, suelo: 0, tropiezo: 0, protegido: 0, patadaCD: 0, patadaT: 0,
      decT: rng() * .4, desT: rng() * 2, desX: 0, desZ: 0, desmarque: false, retener: 0, estirada: null, celebra: 0,
      piel: PIEL[Math.floor(rng() * PIEL.length)], pelo: PELO[Math.floor(rng() * PELO.length)],
    };
    eq.pl.push(p);
  });
  return eq;
}
function posFormacion(eq, fx, fz) { return { x: eq.dir * (-HL + fx * PL), z: fz * HW * .82 * eq.dir }; }

/* ---------- estado del partido ---------- */
const G = {
  listo: false, fase: 'menu', pausa: true, t: 0, reloj: 0, eqs: [], todos: [], ctrl: null, posesion: null,
  balon: null, saque: null, muerto: 0, golT: 0, idPatada: 0, buffer: null, carga: null, cambioT: 0, presion: false,
  usuario: 0, autoplay: false, stats: null, pasosPorFrame: 0, frames: 0, ultimoAviso: '',
};
function nuevoBalon() { return { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: 0, dueno: null, tipo: null, destino: null, ultimo: null, pateador: null, id: 0, paraPor: null, batido: null, rotX: 0, rotZ: 0 }; }

function nuevoPartido(semillaNueva) {
  if (semillaNueva != null) semilla = semillaNueva;
  G.eqs = [crearEquipo(0), crearEquipo(1)];
  G.eqs[0].rival = G.eqs[1]; G.eqs[1].rival = G.eqs[0];
  G.todos = [...G.eqs[0].pl, ...G.eqs[1].pl];
  G.balon = nuevoBalon();
  G.reloj = 0; G.t = 0; G.fase = 'juego'; G.buffer = null; G.carga = null;
  G.stats = { tiros: [0, 0], aPuerta: [0, 0], pos: [0, 0], pases: [0, 0], pasesOk: [0, 0] };
  G.ctrl = null;
  saqueInicial(G.eqs[0]);
  if (typeof alCambiarEquipos === 'function') alCambiarEquipos();
}
const eqUsuario = () => G.eqs[G.usuario];
const esUsuario = p => !G.autoplay && p.eq.i === G.usuario;
const porteriaPropiaX = eq => -eq.dir * HL;
const enAreaPropia = (p, x, z) => Math.abs(z) < AREA_W2 && x * p.eq.dir < -HL + AREA_D + .5 && x * p.eq.dir > -HL - 1;
const DIF = [ // fácil, normal, difícil (afecta a la computadora rival)
  { decision: .6, errPase: 1.6, entrada: .65, errTiro: 1.4, parada: -.15, reaccion: .2 },
  { decision: .4, errPase: 1, entrada: 1, errTiro: 1, parada: 0, reaccion: .1 },
  { decision: .25, errPase: .7, entrada: 1.25, errTiro: .8, parada: .08, reaccion: .03 },
];
const dif = eq => (esUsuarioEq(eq) ? DIF[1] : DIF[DATOS.ajustes.dif] || DIF[1]);
const esUsuarioEq = eq => !G.autoplay && eq.i === G.usuario;

/* ---------- balón: predicción de trayectoria ---------- */
const NP = 60, PH = .05;               // 3 s de predicción en pasos de 0,05 s
const PX = new Float32Array(NP), PY = new Float32Array(NP), PZ = new Float32Array(NP);
function predecirBalon() {
  const b = G.balon;
  let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
  if (b.dueno) { for (let i = 0; i < NP; i++) { PX[i] = b.x; PY[i] = b.y; PZ[i] = b.z; } return; }
  const kS = Math.exp(-ROCE * PH);
  for (let i = 0; i < NP; i++) {
    if (y > BR + .01 || vy > 0) {
      vy -= GRAV * PH; x += vx * PH; y += vy * PH; z += vz * PH;
      if (y < BR) { y = BR; if (vy < -1.2) { vy = -vy * .5; vx *= .88; vz *= .88; } else vy = 0; }
    } else { x += vx * PH; z += vz * PH; vx *= kS; vz *= kS; }
    PX[i] = x; PY[i] = y; PZ[i] = z;
  }
}
// tiempo que tarda un jugador en llegar al balón (y en qué punto)
function intercepcion(p) {
  const sp = velMax(p, true) * .9;
  for (let i = 0; i < NP; i++) {
    if (PY[i] > 1.3) continue;
    const d = Math.max(0, hyp(PX[i] - p.x, PZ[i] - p.z) - .6);
    if (d / sp + .12 <= (i + 1) * PH) return { t: (i + 1) * PH, x: PX[i], z: PZ[i] };
  }
  const d = hyp(PX[NP - 1] - p.x, PZ[NP - 1] - p.z);
  return { t: NP * PH + d / sp, x: PX[NP - 1], z: PZ[NP - 1] };
}

/* ---------- balón: física sencilla ---------- */
function pasoBalon(dt) {
  const b = G.balon;
  if (b.dueno) {
    const o = b.dueno;
    if (o.por && o.retener > 0) { // el portero lo lleva en las manos
      b.x = o.x + Math.cos(o.cara) * .35; b.z = o.z + Math.sin(o.cara) * .35; b.y = 1.05; b.vx = b.vy = b.vz = 0; return;
    }
    const sp = hyp(o.vx, o.vz);
    const d = .52 + Math.min(.38, sp * .045) + Math.sin(o.fase * .5) * .06 * Math.min(1, sp / 5);
    const tx = o.x + Math.cos(o.cara) * d, tz = o.z + Math.sin(o.cara) * d;
    const k = Math.min(1, dt * 22);
    const nx = b.x + (tx - b.x) * k, nz = b.z + (tz - b.z) * k;
    b.rotX += (nz - b.z) / BR; b.rotZ -= (nx - b.x) / BR;

  if (gk && Math.abs(b.x - gk.x) < 1 && Math.abs(b.z - gk.z) < 1.6 && b.y < 2.7) {

// cámara: sigue al balón
function moverCamara(dt) {
  const b = G.balon, cam = R.cam, modo = DATOS.ajustes.cam;
  const aspecto = window.innerWidth / Math.max(1, window.innerHeight);
  const vertical = aspecto < 1;
  const lead = G.autoplay ? 0 : eqUsuario().dir * 4;
  const objX = clamp(b.x + lead, -HL + (modo === 'arriba' ? 10 : 14), HL - (modo === 'arriba' ? 10 : 14));
  const objZ = clamp(b.z * .7, -HW + 10, HW - 8);
  const k = 1 - Math.exp(-dt * 4.5);
  R.camX += (objX - R.camX) * k; R.camZ += (objZ - R.camZ) * k;
  let h, d, fov;
  if (modo === 'arriba') { h = 44; d = 8; fov = 40; }
  else if (modo === 'lejos') { h = 30; d = 36; fov = 34; }
  else { h = 21; d = 25; fov = 38; }
  if (vertical) { const f = 1 + (1 / aspecto - 1) * .55; h *= f; d *= f; }
  cam.fov = fov; cam.position.set(R.camX, h, R.camZ + d); cam.lookAt(R.camX, 0, R.camZ - (modo === 'arriba' ? 0 : 3)); cam.updateProjectionMatrix();
}
function ajustarTamano() {

  R.renderer.setPixelRatio(Math.max(.5, ratio));

  R.cam.aspect = window.innerWidth / Math.max(1, window.innerHeight); R.cam.updateProjectionMatrix();
  document.body.classList.toggle('vertical', window.innerHeight > window.innerWidth);
  const gr = q === 'baja' || (q === 'auto' && R.calidad < .6);

}
// calidad automática: si va lento, baja la resolución
function medirFps(dt) {
  if (DATOS.ajustes.calidad !== 'auto' || G.pausa) return;
  R.fpsT += dt; R.fpsN++;
  if (R.fpsT >= 3) {
    const fps = R.fpsN / R.fpsT; R.fpsT = 0; R.fpsN = 0; G.fps = Math.round(fps);

  }
}

function iniciarTactil() {
  const zona = $('zonaStick'), base = $('stickBase'), knob = $('stickKnob');
  const R0 = 52;
  let id = null, ox = 0, oy = 0;
  const casa = () => { base.style.left = ''; base.style.top = ''; };
  const mover = e => {
    let dx = e.clientX - ox, dy = e.clientY - oy; const d = hyp(dx, dy);
    const m = Math.min(1, d / R0);
    TACT.mx = d ? dx / d * m : 0; TACT.mz = d ? dy / d * m : 0;
    TACT.sprint = d > R0 * 1.35;
    const kd = Math.min(d, R0 * 1.35), kx = d ? dx / d * kd : 0, ky = d ? dy / d * kd : 0;
    knob.style.transform = `translate(${kx}px,${ky}px)`; knob.classList.toggle('sprint', TACT.sprint);
  };

    if (id !== null) return; id = e.pointerId; e.preventDefault();
    try { zona.setPointerCapture(id); } catch (er) { }

    ox = e.clientX; oy = e.clientY; base.style.left = (ox - r.left) + 'px'; base.style.top = (oy - r.top) + 'px'; base.classList.add('activo');
    mover(e);

  const fin = e => { if (e.pointerId !== id) return; id = null; TACT.mx = TACT.mz = 0; TACT.sprint = false; knob.style.transform = ''; knob.classList.remove('sprint'); base.classList.remove('activo'); casa(); };
  zona.addEventListener('pointerup', fin); zona.addEventListener('pointercancel', fin); zona.addEventListener('lostpointercapture', fin);
  document.querySelectorAll('.b').forEach(bt => {
    const k = bt.dataset.b; const ids = new Set();
    const on = () => { TACT[k] = ids.size > 0; bt.classList.toggle('on', TACT[k]); };
    bt.addEventListener('pointerdown', e => { e.preventDefault(); ids.add(e.pointerId); PULSO[k] = true; try { bt.setPointerCapture(e.pointerId); } catch (er) { } activarTactil(); on(); });
    const up = e => { ids.delete(e.pointerId); on(); };
    bt.addEventListener('pointerup', up); bt.addEventListener('pointercancel', up); bt.addEventListener('lostpointercapture', up);

}

/* =====================================================================
   guardado protegido
   - 'save': los datos (texto 'js:' + JSON). 'save_meta': versión y fecha.
   - 'bak_index' y 'bak_*': copias de seguridad. 'danado_*': datos dañados apartados.
   - Si cambia la forma de DATOS: subir SAVE_VERSION y añadir MIGR[nueva].
   ===================================================================== */
const SAVE_VERSION = 1;
const AJUSTES_DEF = { cam: 'diag', estilo: 'dia', calidad: 'auto', dif: 1, dur: 5, tactil: 'auto', vibrar: true };
const ESTAD_CLAVES = ['jugados', 'ganados', 'empatados', 'perdidos', 'gf', 'gc'];
const MIGR = {
  // 1: datos sin número de versión (versión 0) → 1
  1: d => { d.v = 1; return d; },
};
function datosNuevos() { return { v: SAVE_VERSION, creado: Date.now(), guardado: 0, ajustes: { ...AJUSTES_DEF }, estad: { jugados: 0, ganados: 0, empatados: 0, perdidos: 0, gf: 0, gc: 0 }, historial: [] }; }
let DATOS = datosNuevos();
// completa lo que falte y corrige ajustes con valores que no existen
function arreglarDatos(d) {
  if (!d.ajustes || typeof d.ajustes !== 'object') d.ajustes = {};
  for (const k in AJUSTES_DEF) {
    const op = OPCIONES.find(o => o.k === k);
    if (!(k in d.ajustes) || (op && !op.o.some(([v]) => v === d.ajustes[k]))) d.ajustes[k] = AJUSTES_DEF[k];
  }
  if (!Array.isArray(d.historial)) d.historial = [];
  if (!d.creado) d.creado = Date.now();
  return d;
}
function validarDatos(d) {
  const grave = [], aviso = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { ok: false, grave: ['no son datos del juego'], aviso };
  if (!Number.isInteger(d.v) || d.v < 1) grave.push('versión no válida');
  if (!d.estad || typeof d.estad !== 'object') grave.push('faltan las estadísticas');
  else {
    for (const k of ESTAD_CLAVES) if (!Number.isInteger(d.estad[k]) || d.estad[k] < 0) grave.push('estadística dañada: ' + k);
    if (!grave.length && d.estad.jugados !== d.estad.ganados + d.estad.empatados + d.estad.perdidos) aviso.push('los totales no cuadran');
  }
  if (!d.ajustes || typeof d.ajustes !== 'object') grave.push('faltan los ajustes');
  if (!Array.isArray(d.historial)) grave.push('historial dañado');
  else if (d.historial.some(h => !h || !Number.isInteger(h.gf) || !Number.isInteger(h.gc))) grave.push('partido del historial dañado');
  return { ok: grave.length === 0, grave, aviso };
}
// almacenamiento: IndexedDB; si no se puede, localStorage; si tampoco, solo en memoria
const KV = (() => {
  let db = null, modo = 'memoria'; const mem = new Map(), P = 'pelotazo.';
  async function abrir() {
    try {
      db = await new Promise((res, rej) => {
        const r = indexedDB.open('pelotazo', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('bloqueado'));
        setTimeout(() => rej(new Error('tiempo')), 4000);
      });
      modo = 'idb'; return;
    } catch (e) { db = null; }
    try { localStorage.setItem(P + '_', '1'); localStorage.removeItem(P + '_'); modo = 'local'; } catch (e) { modo = 'memoria'; }
  }
  const tx = (m, f) => new Promise((res, rej) => { const t = db.transaction('kv', m), s = t.objectStore('kv'); const r = f(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  return {
    abrir, get modo() { return modo; },
    async get(k) { if (modo === 'idb') return tx('readonly', s => s.get(k)); if (modo === 'local') { const v = localStorage.getItem(P + k); return v == null ? undefined : JSON.parse(v); } return mem.get(k); },
    async set(k, v) { if (modo === 'idb') return tx('readwrite', s => { s.put(v, k); }); if (modo === 'local') return localStorage.setItem(P + k, JSON.stringify(v)); mem.set(k, v); },
    async del(k) { if (modo === 'idb') return tx('readwrite', s => { s.delete(k); }); if (modo === 'local') return localStorage.removeItem(P + k); mem.delete(k); },
    async keys() { if (modo === 'idb') return tx('readonly', s => s.getAllKeys()); if (modo === 'local') return Object.keys(localStorage).filter(k => k.startsWith(P)).map(k => k.slice(P.length)); return [...mem.keys()]; },
  };
})();
const SAVE = { estado: 'nuevo', dueno: true, soloLectura: false, ultimoOk: 0, id: Math.random().toString(36).slice(2) };
function leerTexto(raw) {
  if (typeof raw !== 'string') throw new Error('formato desconocido');
  return JSON.parse(raw.startsWith('js:') ? raw.slice(3) : raw);
}
// convierte datos guardados en datos válidos de esta versión (o lanza un error)
function prepararDatos(raw) {
  let d = leerTexto(raw);
  if (!d || typeof d !== 'object') throw new Error('no son datos del juego');
  const v = Number.isInteger(d.v) ? d.v : 0;
  if (v > SAVE_VERSION) { const e = new Error('versión futura'); e.futuro = true; e.datos = d; throw e; }
  for (let n = v + 1; n <= SAVE_VERSION; n++) d = MIGR[n](d);
  arreglarDatos(d);
  const r = validarDatos(d);
  if (!r.ok) throw new Error('datos dañados: ' + r.grave.join(', '));
  return d;
}
async function cargarGuardado() {
  await KV.abrir();
  let raw;
  try { raw = await KV.get('save'); } catch (e) { raw = undefined; }
  if (raw === undefined || raw === null) { DATOS = datosNuevos(); SAVE.estado = 'nuevo'; return; }
  try { DATOS = prepararDatos(raw); SAVE.estado = 'ok'; }
  catch (e) {
    if (e.futuro) { // de una versión más nueva: se usa sin tocarla
      DATOS = datosNuevos(); try { arreglarDatos(Object.assign(DATOS, { ajustes: { ...AJUSTES_DEF, ...(e.datos.ajustes || {}) } })); } catch (er) { }
      SAVE.estado = 'futuro'; SAVE.soloLectura = true; return;
    }
    await recuperar(raw, e.message);
  }
}
async function recuperar(raw, motivo) {
  const t = Date.now();
  try { await KV.set('danado_' + t, raw); } catch (e) { }
  const L = await bakList();
  for (const b of L) {
    try { const d = prepararDatos(await KV.get(b.k)); DATOS = d; SAVE.estado = 'recuperado'; await KV.set('save', 'js:' + JSON.stringify(DATOS)); return; } catch (e) { }
  }
  DATOS = datosNuevos(); SAVE.estado = 'reiniciado';
  try { await KV.set('save', 'js:' + JSON.stringify(DATOS)); } catch (e) { }
}
async function bakList() {
  let idx = [];
  try { idx = (await KV.get('bak_index')) || []; } catch (e) { }
  return idx.slice().sort((a, b) => b.t - a.t);
}
async function bakPut(tipo, texto) {
  const t = Date.now(), k = 'bak_' + t + '_' + Math.floor(Math.random() * 1e4);
  let jugados = 0; try { jugados = leerTexto(texto).estad.jugados; } catch (e) { }
  await KV.set(k, texto);
  let idx = (await KV.get('bak_index')) || [];
  idx.push({ k, t, tipo, jugados, v: SAVE_VERSION });
  // se conservan las 5 copias más recientes de cada tipo
  const borrar = [];
  for (const ti of new Set(idx.map(b => b.tipo))) { const de = idx.filter(b => b.tipo === ti).sort((a, b) => b.t - a.t); borrar.push(...de.slice(5)); }
  idx = idx.filter(b => !borrar.includes(b));
  await KV.set('bak_index', idx);
  for (const b of borrar) { try { await KV.del(b.k); } catch (e) { } }
}
// copia lo que hay guardado ahora antes de sustituirlo
async function bakCurrent(tipo) { const raw = await KV.get('save'); if (typeof raw === 'string') await bakPut(tipo, raw); }
// los guardados van en fila, uno detrás de otro, para que dos a la vez no se pisen la lista de copias
let colaGuardado = Promise.resolve();
function enCola(f) { const p = colaGuardado.then(f, f); colaGuardado = p.catch(() => { }); return p; }
const guardarAhora = tipoCopia => enCola(() => guardarYa(tipoCopia));
async function guardarYa(tipoCopia) {
  if (SAVE.soloLectura || !SAVE.dueno) return false;
  arreglarDatos(DATOS);
  const r = validarDatos(DATOS);
  if (!r.ok) { console.warn('No se guarda: datos con daños graves', r.grave); return false; }
  DATOS.guardado = Date.now();
  const texto = 'js:' + JSON.stringify(DATOS);
  try {
    await KV.set('save', texto);
    await KV.set('save_meta', { v: SAVE_VERSION, t: DATOS.guardado, juego: JUEGO_VERSION, bytes: texto.length });
    if (tipoCopia) await bakPut(tipoCopia, texto);
    else { const L = await bakList(); const ult = L.find(b => b.tipo === 'auto'); if (!ult || Date.now() - ult.t > 10 * 60 * 1000) await bakPut('auto', texto); }
    SAVE.ultimoOk = Date.now(); return true;
  } catch (e) { console.warn('Error al guardar', e); return false; }
}
let guardarT = null;
function guardarPronto() { clearTimeout(guardarT); guardarT = setTimeout(() => guardarAhora(), 400); }
function bakRestore(k) {
  return enCola(async () => {
    let d; try { d = prepararDatos(await KV.get(k)); } catch (e) { return false; }
    if (SAVE.soloLectura || !SAVE.dueno) return false;
    await bakCurrent('reemplazo');
    DATOS = d; const ok = await guardarYa();
    aplicarEstilo(); ajustarTamano(); aplicarTactil();
    return ok;
  });
}
async function registrarPartido(gf, gc) {
  const s = DATOS.estad;
  s.jugados++; s.gf += gf; s.gc += gc;
  if (gf > gc) s.ganados++; else if (gf < gc) s.perdidos++; else s.empatados++;
  DATOS.historial.push({ t: Date.now(), local: G.eqs[0].id, visita: G.eqs[1].id, gf, gc });
  if (DATOS.historial.length > 30) DATOS.historial.splice(0, DATOS.historial.length - 30);
  return guardarAhora('partido');
}
// una sola pestaña guarda a la vez: la última que se abre toma el control
function vigilarPestanas() {
  try {
    const bc = new BroadcastChannel('pelotazo');
    bc.onmessage = e => {
      if (e.data && e.data.tipo === 'hola' && e.data.id !== SAVE.id && SAVE.dueno) {
        SAVE.dueno = false; toast('Abriste el juego en otra pestaña. Esta ya no guarda tu progreso.', 6000);
      }
    };
    bc.postMessage({ tipo: 'hola', id: SAVE.id });
    SAVE.canal = bc;
  } catch (e) { }
}

/* =====================================================================
   arranque y bucle principal
   ===================================================================== */
let acumulado = 0, ultimoT = 0;
function bucle(ahora) {
  requestAnimationFrame(bucle);
  const dt = Math.min(.1, (ahora - (ultimoT || ahora)) / 1000); ultimoT = ahora;
  leerControles();
  if (!G.pausa) {
    acumulado += dt; let n = 0;
    while (acumulado >= DT && n < 6) { paso(DT); acumulado -= DT; n++; }
    if (n >= 6) acumulado = 0;
    G.pasosPorFrame = n;
  } else consumirBordes();
  if (R) { moverCamara(dt); dibujarJugadores(); R.renderer.render(R.scene, R.cam); medirFps(dt); }
  actualizarHud(dt);
  G.frames++;
}
// avanzar la simulación sin dibujar (para las pruebas)
G.avanzar = n => { for (let i = 0; i < n; i++) { leerControles(); paso(DT); if (G.fase === 'fin') break; } };
G.prueba = PRUEBA;
window.G = G;
async function arrancar() {
  await cargarGuardado();
  vigilarPestanas();
  if (SAVE.estado === 'recuperado') setTimeout(() => toast('Tus datos estaban dañados: se recuperaron de una copia de seguridad.', 6000), 300);
  if (SAVE.estado === 'reiniciado') setTimeout(() => toast('Tus datos estaban dañados y no había copias: se empezó de cero.', 6000), 300);
  if (SAVE.estado === 'futuro') setTimeout(() => toast('Tus datos son de una versión más nueva del juego: esta versión no los modificará.', 6000), 300);
  if (typeof THREE === 'undefined') { mostrarError('No se pudo cargar la biblioteca de gráficos. Revisa tu conexión y recarga la página.'); return; }
  if (!iniciarGraficos()) return;
  nuevoPartido();
  iniciarTactil(); iniciarTeclado(); aplicarTactil();
  addEventListener('resize', ajustarTamano);
  addEventListener('gamepadconnected', () => toast('Mando conectado'));
  document.addEventListener('visibilitychange', () => { if (document.hidden && !G.pausa && G.fase === 'juego') abrirPausa(); });
  $('bPausa').addEventListener('click', () => abrirPausa());
  if (SAVE.estado === 'nuevo') guardarAhora();
  G.listo = true;
  mostrarInicio();
  requestAnimationFrame(bucle);
}
arrancar();
</script>
