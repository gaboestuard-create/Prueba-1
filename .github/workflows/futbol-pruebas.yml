name: Pelotazo · pruebas
on:
  push:
    paths: ['futbol/**', '.github/workflows/futbol-pruebas.yml']
  pull_request:
    paths: ['futbol/**', '.github/workflows/futbol-pruebas.yml']
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futbol
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # las pruebas de compatibilidad leen versiones anteriores del juego desde git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
