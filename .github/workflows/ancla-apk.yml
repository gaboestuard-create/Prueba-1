name: Ancla APK
on:
  push:
    paths: ['ancla/**', '.github/workflows/ancla-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
# si hay dos compilaciones a la vez, gana la más nueva (evita que una vieja pise el Release)
concurrency:
  group: ancla-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Preparar proyecto Android
        working-directory: ancla/apk
        run: |
          mkdir -p www ~/.android
          { printf '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'; cat ../index.html; printf '</body></html>'; } > www/index.html
          sed -i "s/__BUILD__/$GITHUB_SHA/" www/index.html
          # llave fija: cada APK nueva se instala encima de la anterior sin borrar tus datos
          cp debug.keystore ~/.android/debug.keystore
          npm install
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar
        working-directory: ancla/apk/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar en Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp ancla/apk/android/app/build/outputs/apk/debug/app-debug.apk ancla.apk
          gh release delete ancla-apk --yes --cleanup-tag || true
          gh release create ancla-apk ancla.apk --target "$GITHUB_SHA" --title "Ancla (APK)" --notes "Descarga ancla.apk e instálala en tu Android."
