<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DT26 · Director Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ebe3;--panel:#f8f9f4;--panel2:#eef1e8;--line:#cdd5c8;--text:#17231e;--muted:#5a6a61;
  --acc:#b87a0a;--accText:#fff;--good:#1f8a4a;--bad:#c23c34;--info:#2d6fb3;--chalk:#17231e;
  --pitch1:#2f7d45;--pitch2:#2a7240;--shadow:0 10px 30px rgba(23,35,30,.12);
  --club:#1f7a3a;--club2:#e8b923;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15201b;--panel:#1c2a24;--panel2:#23352d;--line:#2f453b;--text:#ebe7da;--muted:#98a89e;
    --acc:#f2b23a;--accText:#1f1604;--good:#48c274;--bad:#ea5a51;--info:#6aaeea;--chalk:#ebe7da;
    --pitch1:#236b39;--pitch2:#1f6034;--shadow:0 14px 40px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15201b;--panel:#1c2a24;--panel2:#23352d;--line:#2f453b;--text:#ebe7da;--muted:#98a89e;
  --acc:#f2b23a;--accText:#1f1604;--good:#48c274;--bad:#ea5a51;--info:#6aaeea;--chalk:#ebe7da;
  --pitch1:#236b39;--pitch2:#1f6034;--shadow:0 14px 40px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:700;margin:0;line-height:1.1;letter-spacing:.01em}
h2{font-size:28px}h3{font-size:19px}h4{font-size:16px}
.num,.t td,.t th{font-variant-numeric:tabular-nums}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.accent{color:var(--acc)}
#app{height:100%;position:relative}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#15201b;color:#ebe7da;font:italic 900 64px 'Barlow Condensed',sans-serif;z-index:99;letter-spacing:-.02em}
#boot small{display:block;font:500 15px 'Barlow',sans-serif;opacity:.7;text-align:center;letter-spacing:0}

/* ---------- juego ---------- */
#game{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:58px;flex:none}
#top .club{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
#top .club b{font:700 20px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#top .club small{color:var(--muted);font-size:12.5px;display:block}
#top .sp{flex:1}
#top .money{font:600 17px 'Barlow Condensed',sans-serif;text-align:right;line-height:1.1}
#top .money small{display:block;color:var(--muted);font:500 12px 'Barlow',sans-serif}
.go{background:var(--acc);color:var(--accText);border:0;border-radius:12px;padding:10px 18px;font:800 18px 'Barlow Condensed',sans-serif;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#shell{flex:1;display:flex;min-height:0}
#nav{width:208px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font:600 16.5px 'Barlow Condensed',sans-serif;color:var(--muted);width:100%}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--panel2);color:var(--text)}
.nv.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--club)}
.nv .badge{margin-left:auto}
#nav .sep{height:1px;background:var(--line);margin:8px 6px}
#main{flex:1;overflow:auto;padding:18px 20px 44px;-webkit-overflow-scrolling:touch;outline:none}
#bnav{display:none;flex:none;background:var(--panel);border-top:1px solid var(--line)}
#bnav .nv{flex-direction:column;gap:2px;font-size:12.5px;padding:7px 2px;border-radius:0;align-items:center}
#bnav .nv.on{box-shadow:inset 0 3px 0 var(--club)}
@media (max-width:860px){
  #nav{display:none}#bnav{display:flex}#main{padding:14px 12px 28px}
  #top{gap:8px;padding:7px 10px}#top .money{display:none}#top .club b{font-size:17px}
  .go{padding:9px 13px;font-size:16px}h2{font-size:24px}
}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font:700 12px 'Barlow',sans-serif}

/* ---------- componentes ---------- */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head .sp{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:980px){.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card>h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card>h3 .sp{flex:1}
.btn{font:600 15.5px 'Barlow Condensed',sans-serif;letter-spacing:.02em;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);color:var(--accText);border-color:transparent}
.btn.dan{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:is(.btn,.nv,.go,.seg button,.tok,.row-click,.chipb):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font:600 14.5px 'Barlow Condensed',sans-serif;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.bar{height:7px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:9px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
input[type=range]{accent-color:var(--acc);width:100%}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.pos{display:inline-block;min-width:36px;text-align:center;padding:1px 5px;border-radius:6px;font:700 13px 'Barlow Condensed',sans-serif;color:#fff}
.pos.g{background:#c9a227}.pos.d{background:#2f6db3}.pos.m{background:#2e8b57}.pos.a{background:#c0453b}
.flag{width:21px;height:14px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15);vertical-align:-2px}
.av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:var(--panel2);display:block}
.av svg,.face-big svg{display:block;width:100%;height:100%}
.crest{flex:none;display:block}
.stars{position:relative;display:inline-block;font-size:14px;line-height:1;color:var(--line);letter-spacing:1px;white-space:nowrap}
.stars::before{content:'★★★★★'}
.stars>i{position:absolute;left:0;top:0;overflow:hidden;color:var(--acc);white-space:nowrap}
.stars>i::before{content:'★★★★★'}
.form{display:inline-flex;gap:3px}
.form i{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font:700 11px 'Barlow',sans-serif;font-style:normal;color:#fff}
.form .W{background:var(--good)}.form .D{background:#8b958f}.form .L{background:var(--bad)}
.rt{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 4px;font:700 13.5px 'Barlow Condensed',sans-serif;color:#fff;background:#8b958f}
.rt.hi{background:#1f8a4a}.rt.vh{background:#0f6e8c}.rt.lo{background:#c0453b}
.a1{color:#c9504a}.a2{color:#d99a26}.a3{color:#8bbd4c}.a4{color:#2fae63}.a5{color:#16a6a0}
:root[data-theme="dark"] .a1,:root:not([data-theme="light"]) .a1{}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- tablas ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:100%}
table.t{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-size:14.5px}
.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font:600 13.5px 'Barlow Condensed',sans-serif;color:var(--muted);padding:8px 9px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;z-index:1}
.t th.r,.t td.r{text-align:right}.t th.c,.t td.c{text-align:center}
.t td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--panel2)}
.t tr.me td{background:color-mix(in srgb,var(--club) 14%,transparent)}
.t td.stick,.t th.stick{position:sticky;left:0;background:var(--panel);z-index:2}
.t th.stick{background:var(--panel2);z-index:3}
.t tbody tr:hover td.stick{background:var(--panel2)}
.pn{display:flex;align-items:center;gap:9px;min-width:0}
.pn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.zone-cl td:first-child{box-shadow:inset 3px 0 0 var(--info)}
.zone-rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.zone-up td:first-child{box-shadow:inset 3px 0 0 var(--good)}

/* ---------- inicio ---------- */
.next{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.next .vs{font:italic 900 34px 'Barlow Condensed',sans-serif;color:var(--muted)}
.next b{display:block;font:700 18px 'Barlow Condensed',sans-serif;margin-top:6px}
.msg{display:flex;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.msg:hover{background:var(--panel2)}
.msg.unread b{color:var(--text)}
.msg .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none}
.msg.read .dot{background:transparent}
.msg b{display:block;font-weight:600;color:var(--muted)}
.msg small{color:var(--muted)}
.mailbody{white-space:pre-line}
.assist-out{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;min-height:60px;font-size:14.5px;max-height:340px;overflow:auto}

/* ---------- jugador ---------- */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.face-big{width:124px;height:124px;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--club) 55%,#223),#101a16);flex:none}
.phead h2{font-size:34px}
.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 22px}
@media (max-width:700px){.attrs{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}}
.attrs h4{grid-column:1/-1;margin-top:6px;color:var(--muted);font-size:14px;font-weight:600}
.at{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0;border-bottom:1px dashed var(--line)}
.at b{font:700 15.5px 'Barlow Condensed',sans-serif;min-width:20px;text-align:right}
.acol h4{margin:0 0 6px;font-size:15px}
.minipitch{position:relative;width:150px;aspect-ratio:68/105;border-radius:8px;background:repeating-linear-gradient(0deg,var(--pitch1) 0 12.5%,var(--pitch2) 12.5% 25%);border:2px solid rgba(255,255,255,.35)}
.minipitch i{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85)}

/* ---------- tácticas ---------- */
.tac{display:grid;grid-template-columns:minmax(260px,430px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.tac{grid-template-columns:1fr}}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.35);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:74px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;cursor:pointer;color:#fff;touch-action:none}
.tok .av{width:42px;height:42px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.tok span{font:700 12.5px 'Barlow Condensed',sans-serif;background:rgba(10,20,15,.72);padding:0 6px;border-radius:5px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok em{font:700 10.5px 'Barlow',sans-serif;font-style:normal;opacity:.9}
.tok.sel .av{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 45%,transparent)}
.tok.bad .av{border-color:#ff7a70}.tok.mid .av{border-color:#ffd166}
.tok .cb{width:34px;height:3px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}.tok .cb i{display:block;height:100%;background:#5fe08a}
.benchrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.benchrow:hover{background:var(--panel2)}
.benchrow.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.instr{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;align-items:center;font-size:14px}
.instr>span{color:var(--muted)}
.str3{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}

/* ---------- modal y avisos ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,14,11,.62);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);backdrop-filter:blur(3px)}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:680px;max-height:100%;overflow:auto;padding:18px 18px 16px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.mbox.wide{max-width:1000px}
.mbox>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mbox>header h3{flex:1;font-size:22px}
.x{border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;display:grid;place-items:center}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:#17231e;color:#f4efe2;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s ease-out;text-align:center}
.toast.good{background:#1f6b3d}.toast.bad{background:#8e2c26}

/* ---------- escenario 3D, menú y partido ---------- */
#stage{position:fixed;inset:0;z-index:20;background:#0b1410;overflow:hidden}
#glhost{position:absolute;inset:0}
#glhost canvas,.gl3 canvas{display:block;width:100%;height:100%;touch-action:none}
.gl3{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0b1410}
.gl3 .hint{position:absolute;left:10px;bottom:8px;color:#dfe8e2;font-size:12.5px;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;pointer-events:none}
#menu{position:fixed;inset:0;z-index:30;overflow:auto;color:#f3efe3;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(ellipse at 78% 30%,#2f7d45 0%,#16301f 42%,#0b1410 82%)}
@media (max-width:760px){#menu{background:radial-gradient(ellipse at 50% 20%,#2f7d45 0%,#16301f 45%,#0b1410 85%)}}
.mwrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:460px;gap:22px;padding-left:clamp(0px,4vw,60px)}
@media (max-width:760px){.mwrap{justify-content:flex-end;padding-bottom:12px}}
.logo{font:italic 900 clamp(84px,17vw,150px)/.78 'Barlow Condensed',sans-serif;letter-spacing:-.045em;color:#f3efe3;text-shadow:0 8px 40px rgba(0,0,0,.55)}
.logo span{display:inline-block;color:transparent;-webkit-text-stroke:2px #f2b23a}
.tag{font:600 19px 'Barlow Condensed',sans-serif;opacity:.86;max-width:360px}
.mbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(20,32,26,.62);color:#f3efe3;font:700 21px 'Barlow Condensed',sans-serif;cursor:pointer;backdrop-filter:blur(6px);text-align:left}
.mbtn small{font:500 13.5px 'Barlow',sans-serif;opacity:.7;display:block}
.mbtn.pri{background:#f2b23a;color:#1f1604;border-color:transparent}
.mbtn:hover{border-color:rgba(255,255,255,.5)}
.mfoot{font-size:12.5px;opacity:.6}
.pick{background:rgba(14,24,19,.9);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
.lgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.lgc{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.lgc.on,.lgc:hover{border-color:#f2b23a;background:rgba(242,178,58,.08)}
.lgc b{font:700 19px 'Barlow Condensed',sans-serif}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.clubbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);cursor:pointer;color:inherit;font:600 14px 'Barlow Condensed',sans-serif;text-align:center}
.clubbtn.on,.clubbtn:hover{border-color:#f2b23a}
.pick input[type=text]{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}

#hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:'Barlow',sans-serif}
#hud button{pointer-events:auto}
.sb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.45);font:700 20px 'Barlow Condensed',sans-serif;white-space:nowrap}
.sb>div{display:flex;align-items:center;gap:7px;padding:5px 11px}
.sb .tm{background:rgba(12,18,15,.88)}

const lc=v=>String(v||'').toLowerCase();
const sameCol=(a,b)=>!!a&&!!b&&a.length===b.length&&a.every((x,i)=>lc(x)===lc(b[i]));

// Aplica o retira los nombres reales. Solo toca lo que sigue como venía: lo editado a mano se respeta.
function realNames(w,on){
  const M=realMap(); let n=0;
  for(const c of w.clubs){
    if(on){
      if(c.fic) continue; const d=M[c.name]; if(!d) continue;
      c.fic={name:c.name,short:c.short,city:c.city,col:c.col.slice(),kit:c.kit,crest:Object.assign({},c.crest),stn:c.st.name,seat:c.st.seat,facade:c.st.facade};
      const oc=c.city;
      Object.assign(c,{name:d.name,short:d.short,city:d.city,col:d.col.slice(),kit:d.kit,crest:Object.assign({},d.crest)});
      if(oc!==d.city&&oc&&c.st.name.includes(oc)) c.st.name=c.st.name.split(oc).join(d.city);
      if(lc(c.st.seat)===lc(c.fic.col[0])) c.st.seat=d.col[0];
      if(lc(c.st.facade)===lc(c.fic.col[1])) c.st.facade=d.col[1];
      n++;
    } else if(c.fic){
      const f=c.fic, d=M[f.name];
      if(d){
        const stApplied=(f.city!==d.city&&f.city&&f.stn.includes(f.city))? f.stn.split(f.city).join(d.city) : f.stn;

    else if(i<14) v= isGK? lvl-6.5+rg(0,2) : lvl+r*4-2.3+rg(0,1.9);
    else if(i<39) v= lvl+r*3-1.4+rg(0,1.8)+(age-25)*.12;
    else { v= lvl+r*3-1.3+rg(0,1.9); if(i===A.pac||i===A.acc||i===A.agi) v-=Math.max(0,age-28)*.5; if((i===A.str||i===A.jum)&&age<20) v-=1.3; }

    foot: left? (rc(.7)?'I':'D') : wpick(['D','I','A'],[74,20,6]),
    h: Math.round(isGK? rg(189,4.5) : pos==='DC'? rg(186,5) : pos==='ST'? rg(182,7) : rg(177,6)),
    no:0,face:genFace(nat,age),val:0,wage:0,ce:0,mor:ri(55,80),cnd:100,form:[],inj:0,injT:'',sus:0,ycs:0,

  if(o.pa) p.pa=o.pa;

}

function stadiumName(nat,city){

// ligas añadidas después de las segundas divisiones (ids 14 en adelante). En partidas antiguas se incorporan al empezar una temporada.
function addExtraLeagues(w,fin){
  const used=new Set(w.clubs.map(c=>c.short)); for(const k in REAL) used.add(REAL[k].split('|')[1]); const fresh=[];
  for(let li=LG_BASE;li<LG.length;li++){ if(w.leagues.some(l=>l.base===li&&!l.tier)) continue;
    const L=LG[li], lg={id:w.leagues.length,code:L.code,name:L.name,cupName:L.cup,nat:L.nat,lf:L.lf,tv:L.tv,clubs:[],champs:[],cup:null,base:li};
    w.leagues.push(lg);
    const defs=L.clubs.split(';').map(s=>s.split('|')), n=defs.length;
    defs.forEach((d,ci)=>{ let k=0, s=d[1]; while(used.has(s)){ k++; s=d[1].slice(0,2)+String.fromCharCode(65+((d[1].charCodeAt(2)-65+k)%26)); } used.add(s); d[1]=s;
      const rep=clamp(Math.round(lerp(L.rep[0],L.rep[1],Math.pow(ci/(n-1),.85))+rg(0,2)),30,95);
      const c=genClub(w,lg,d,rep,L); lg.clubs.push(c.id); fresh.push(c); }); }
  if(fin) for(const c of fresh){ numberSquad(w,c); autoPick(w,c); c.fin.wb=Math.round(wageBill(w,c)*1.12); if(w.mgrs){ c.mg=genMgr(w,w.leagues[c.lg].nat,c.rep,c.id).id; } }
  const d2=addTier2(w,fin); return fresh.concat(d2); }
function genClub(w,lg,d,rep,L){
  const [name,short,city,c1,c2]=d; const id=w.clubs.length;
  const cap=clamp(Math.round((6000+Math.pow(Math.max(0,rep-40),2)*27+rg(0,3500))/100)*100,5000,99000);

function wageBill(w,c){ let s=0; for(const id of c.pids) s+=w.players[id].wage; return s; }
function numberSquad(w,c){
  const used=new Set(); const ps=c.pids.map(id=>w.players[id]).sort((a,b)=>b.ovr-a.ovr);
  const pref={GK:[1,13,25],DR:[2,22],DC:[4,5,3,15,24],DL:[3,12],WBR:[2],WBL:[3],DM:[6,16],MC:[8,6,14,18],MR:[7,17],ML:[11],AMC:[10,20],AMR:[7,19],AML:[11,21],ST:[9,19,23]};
  for(const p of ps){ if(p.no&&!used.has(p.no)){used.add(p.no);continue;} let n=(pref[p.pos]||[]).find(x=>!used.has(x)); if(!n){n=2;while(used.has(n))n++;} p.no=n; used.add(n); }
}
function autoPick(w,c){
  const form=FORMS[c.tac.f]||FORMS['4-4-2'];
  let avail=c.pids.map(id=>w.players[id]).filter(p=>p.inj<=0&&p.sus<=0);
  if(avail.length<11) avail=c.pids.map(id=>w.players[id]);
  const cand=[];
  form.forEach((s,i)=>{ for(const p of avail) cand.push([posRating(p,s[0])*(.72+.28*p.cnd/100),i,p.id]); });
  cand.sort((a,b)=>b[0]-a[0]);
  const xi=new Array(11).fill(-1), used=new Set(); let f=0;
  for(const [,i,id] of cand){ if(xi[i]!==-1||used.has(id)) continue; xi[i]=id; used.add(id); if(++f===11) break; }
  c.xi=xi;
  const rest=avail.filter(p=>!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr);
  const subs=[]; const gk=rest.find(p=>p.pos==='GK'); if(gk) subs.push(gk.id);
  for(const p of rest){ if(subs.length>=9) break; if(!subs.includes(p.id)) subs.push(p.id); }
  c.subs=subs;
}
// red de seguridad a largo plazo: ningún club puede quedarse sin plantilla (contratos vencidos, retiros, ventas)
function ensureSquad(w,c){
  if(!c||c.national||c.pids.length>=16) return;
  const grp=p=>p.pos==='GK'?'GK':DEFP.has(p.pos)?'DF':(p.pos==='ST'||p.pos==='AMR'||p.pos==='AML')?'FW':'MF';
  const fa=w.players.filter(p=>p.club<0&&!p.ret&&!isMe(w,p)&&p.age<=36).sort((a,b)=>b.ovr-a.ovr); let n=0;
  const cnt=g=>c.pids.filter(id=>{ const p=w.players[id]; return p&&grp(p)===g; }).length;
  for(const [g,k] of [['GK',2],['DF',6],['MF',6],['FW',4]]){ while(cnt(g)<k&&c.pids.length<22){
      let p=fa.find(q=>grp(q)===g&&q.ovr<=c.rep*.75+22);
      if(p) fa.splice(fa.indexOf(p),1);
      else { const L=w.leagues[c.lg]; p=newP(w,{club:-1,pos:g==='GK'?'GK':g==='DF'?'DC':g==='FW'?'ST':'MC',nat:wpick(Object.keys(LG[L.base].nats),Object.values(LG[L.base].nats)),level:clamp(3.4+c.rep*.08,3,12),age:ri(21,30)}); p.val=calcValue(p); }
      transfer(w,p,c,0,wageDemand(w,p,c),ri(1,3)); n++; } }
  if(n&&c.id===w.userClub) mail(w,'Director deportivo','Plantilla completada',`La plantilla se había quedado muy corta, así que el departamento deportivo firmó ${n} jugador(es) libres para poder competir. Revisa sus contratos.`,'');
  if(n) numberSquad(w,c);
}
function fixLineup(w,c){
  if(!c||c.national) return;

  // repara alineación tras traspasos, lesiones o sanciones sin tocar lo que el usuario eligió si sigue siendo válido
  const ok=id=>{ const p=w.players[id]; return p&&p.club===c.id&&!p.yth&&p.inj<=0&&p.sus<=0; };
  if(!c.xi||c.xi.length!==11){ autoPick(w,c); return; }
  const form=FORMS[c.tac.f];
  const used=new Set(c.xi.filter(ok));
  c.subs=(c.subs||[]).filter(id=>ok(id)&&!used.has(id));
  for(let i=0;i<11;i++){ if(ok(c.xi[i])) continue;
    const pool=c.pids.map(id=>w.players[id]).filter(p=>p.inj<=0&&p.sus<=0&&!used.has(p.id));
    if(!pool.length){ autoPick(w,c); return; }
    pool.sort((a,b)=>posRating(b,form[i][0])-posRating(a,form[i][0]));
    c.xi[i]=pool[0].id; used.add(pool[0].id); c.subs=c.subs.filter(id=>id!==pool[0].id);
  }
  const rest=c.pids.map(id=>w.players[id]).filter(p=>p.inj<=0&&p.sus<=0&&!used.has(p.id)&&!c.subs.includes(p.id)).sort((a,b)=>b.ovr-a.ovr);
  while(c.subs.length<9&&rest.length) c.subs.push(rest.shift().id);
}

/* ---------- utilidades de color ---------- */
function shade(hex,amt){ let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1); }
function mix(h1,h2,t){ const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16); const f=(s)=>Math.round(((a>>s)&255)*(1-t)+((b>>s)&255)*t); return '#'+((1<<24)|(f(16)<<16)|(f(8)<<8)|f(0)).toString(16).slice(1); }
function cdist(h1,h2){ const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16); return Math.hypot((a>>16)-(b>>16),(a>>8&255)-(b>>8&255),(a&255)-(b&255)); }

function applyResult(w,f,M,keepReport){

  f.r={hg,ag,w:win,pens:M.pens,g:M.goals.map(g=>[g[0],g[1],g[2],g[3]]),mom:M.mom?M.mom.id:-1};
  _rfV++; try{ matchHooks(w,f); }catch(e){ console.error("derbi",e); } try{ lkMatch(w,f,M); }catch(e){ console.error("vestuario",e); }
  for(let si=0;si<2;si++){ const S=M.s[si], O=M.s[1-si], res=Math.sign(S.g-O.g);
    for(const id of S.c.pids){ const q=w.players[id]; if(q&&q.sus>0) q.sus--; } // cada partido cumple una jornada de sanción
    for(const m of S.pl.concat(S.bench)){ const p=m.p;
      if(m.min0>=0){ p.st.ap++; if(m.slot>=0&&m.min0>0) p.st.sub++; p.st.g+=m.g; p.st.as+=m.as; p.st.rt+=m.rt; p.st.yc+=m.yc; p.cnd=Math.round(m.cnd);
        p.form.push(m.rt); if(p.form.length>6) p.form.shift(); p.mor=clamp(p.mor+res*5+(m.rt>7.3?3:m.rt<5.8?-3:0),5,100);
        if(m.rc){ p.st.rc++; p.sus+=m.yc>=2?1:ri(1,3); } else if(m.yc){ p.ycs+=m.yc; if(p.ycs>=5){ p.sus++; p.ycs=0; } }
        if(m.inj){ p.inj=p.club===w.userClub?Math.max(1,Math.round(m.inj*(1-staffR(w,'phy')*.018))):m.inj; p.injT=rp(INJ); if(p.club===w.userClub) mail(w,'Servicios médicos','Parte médico: '+pname(p),`${pname(p)} sufre ${p.injT.toLowerCase()}. Baja estimada: ${Math.ceil(p.inj/7)} semana(s).`,'bad'); }
      } else if(p.club===w.userClub&&p.ovr>=avgOvr(w,S.c)+2) p.mor=clamp(p.mor-2,5,100);
    }
    if(M.mom&&S.pl.includes(M.mom)) M.mom.p.st.mom++;
  }
  // taquilla y afición
  const hc=w.clubs[f.h], tx=TIX[fansOf(hc).tix]||TIX[2];
  const att=Math.min(hc.st.cap,Math.round(hc.st.cap*attRatio(w,f,true)));
  f.r.att=f.neu?Math.round(att*.9):att; if(!f.neu){ const gate=att*(6+hc.rep*.4)*(f.cup?.8:f.cc!=null?1.6:1)*tx.pr; hc.fin.bal+=gate; hc.fin.inc+=gate; }
  try{ fanUpdate(w,f); }catch(e){ console.error('afición',e); }
  if(f.cc!=null) ccPrize(w,f);
  if(keepReport) storeReport(w,f,M);
  // directiva del usuario
  if(f.h===w.userClub||f.a===w.userClub){ const us=f.h===w.userClub?0:1, o=w.clubs[us?f.h:f.a], me=w.clubs[w.userClub];
    const r=Math.sign(M.s[us].g-M.s[1-us].g)||(f.r.w===me.id?1:f.r.w>=0?-1:0), exp=clamp((me.rep-o.rep)/12,-1,1);
    w.board.conf=clamp(Math.round(w.board.conf+(r>0?3:r<0?-3:0)-exp*1.5+(f.cup&&r<0?-2:0)+(f.cc!=null&&r>0?1:0)),0,100);
    postMatchMail(w,f,M,us);
    try{ userMatchDone(w,f,M,us); }catch(e){ console.error(e); }
  }
  if(isJug(w)) try{ jugAfterMatch(w,f,M); }catch(e){ console.error('jugador',e); }
  return f.r;
}

function roundNews(w,list){

  for(const L of w.leagues){ if(L.tier&&L.id!==myLg) continue; const mine=list.filter(f=>f.lg===L.id&&!f.cup&&f.r);
    if(!mine.length) continue;

    let big=mine[0]; for(const f of mine) if(Math.abs(f.r.hg-f.r.ag)>Math.abs(big.r.hg-big.r.ag)) big=f;
    const t=table(w,L.id), ld=t[0], prev=L.lead;
    news(w,`${L.name}: jornada ${big.rd+1}`,`${w.clubs[big.h].name} ${big.r.hg}-${big.r.ag} ${w.clubs[big.a].name} destaca en la jornada. ${w.clubs[ld.id].name} es líder con ${ld.pts} puntos.`,'res',L.id);

    L.lead=ld.id; }
}
function playerMoods(w){ // los jugadores reaccionan: piden minutos y recuerdan tus promesas

  const avg=avgOvr(w,c), played=w.fx.some(f=>f.r&&(f.h===c.id||f.a===c.id)&&w.day-f.day>=0&&w.day-f.day<=7);

    if(p.st.ap===last&&(p.ovr>=avg+1||(p.role!=null&&p.role<=1))) p.mor=clamp(p.mor-(p.ovr>=avg+4||p.role===0?5:3),5,100); p.lastAp=p.st.ap; }

      else if(w.day-p.promise>35){ p.promise=null; p.mor=clamp(p.mor-16,5,100); mail(w,pname(p),'Me prometió minutos',`Profe, me dio su palabra y sigo sin jugar. Así es muy difícil.`,'bad'); return; } }

function weekly(w){

function develop(p){

  if(age<=24&&gap>0){ const ch=(gap/12)*(.55+p.a[A.det]/40)*(p.st.ap>2?1.25:.8)*(1+.1*fac)*ax*yx; let n=0; while(rf()<ch*.55&&n<3){ improve(p,1); n++; } }
  else if(age>=30){ const ch=(age-29)*.11; if(rf()<ch){ for(const k of ['pac','acc','sta','agi','jum','nat']) if(rf()<.35) p.a[A[k]]=Math.max(1,p.a[A[k]]-1); } if(rf()<.12) improve(p,0); }

function improve(p,phys){

/* ---------- mercado ---------- */
function askingPrice(w,p){
  const c=w.clubs[p.club]; if(!c) return 0;
  const sq=c.pids.map(id=>w.players[id]).sort((a,b)=>b.ovr-a.ovr); const rank=sq.indexOf(p);
  let f=1.15+(rank<3?.6:rank<8?.3:0); if(p.tr===1) f=.9; if(p.tr===2) f=9;
  const yl=p.ce-w.season; if(yl<=1) f*=.8;
  return roundMoney(Math.max(p.val*f,10000));
}
function wageDemand(w,p,club){ const L=w.leagues[club.lg]; let d=calcWage(p,L.lf)*(1+Math.max(0,(p.ovr-club.rep*.95)/40)); if(p.club===club.id) d=Math.max(d,p.wage*1.08); return roundMoney(d); }
function interest(w,p,club){ // ¿quiere el jugador venir?
  const diff=(p.ovr+ (p.club>=0?w.clubs[p.club].rep*.2:0)) - (club.rep*1.05+10);
  return clamp(.85-diff*.045,.05,.97);
}

  to.pids.push(p.id); to.fin.bal-=fee; to.fin.tb=Math.max(0,to.fin.tb-fee);
  if(from&&from.id===w.userClub&&p.sellOn&&fee>0) payoutSellOn(w,p,fee,from);
  p.club=to.id; p.wage=wage; p.ce=w.season+years; p.tr=0; p.mor=clamp(p.mor+8,5,100); p.no=0;
  p.role=null; p.clause=0; p.pre=null; p.unset=null; p.renAsk=null; p.noRen=null; p.sellOn=null; p.nb=null; p.promise=null;
  if(to.id!==w.userClub&&w.intr) delete w.intr[p.id];

  if(isJug(w)) try{ jugSeasonEnd(w); }catch(e){ console.error('jugador',e); }
  w.stop='season';
}
// mantenimiento a largo plazo: la bolsa de libres y los retirados no pueden crecer sin límite (décadas de juego)
function slimRetired(w){ for(const p of w.players){ if(!p.ret||p.slim) continue; if(!(p.aw&&p.aw.length)&&!(p.tro&&p.tro.length)){ p.car=[]; } p.form=[]; p.ih=null; p.st={ap:0,g:0,as:0,rt:0,yc:0,rc:0,mom:0,sub:0}; p.slim=1; } }
function prunePool(w,keep){ keep=keep||320;
  const fa=w.players.filter(p=>p.club<0&&!p.ret&&!isMe(w,p)).sort((a,b)=>(b.ovr+Math.max(0,(b.pa||b.ovr)-b.ovr)*.5-Math.max(0,b.age-28)*1.5)-(a.ovr+Math.max(0,(a.pa||a.ovr)-a.ovr)*.5-Math.max(0,a.age-28)*1.5));
  for(let i=keep;i<fa.length;i++){ fa[i].ret=1; fa[i].club=-1; }
  slimRetired(w); }
function retire(w,p){ if(jugBlocked(w,p,'retiro')) return; try{ sonsPlan(w,p); }catch(e){} if(p.club>=0){ const c=w.clubs[p.club]; c.pids=c.pids.filter(id=>id!==p.id); c.xi=c.xi.map(id=>id===p.id?-1:id); c.subs=c.subs.filter(id=>id!==p.id); } p.club=-1; p.ret=1; }
function release(w,p){ if(jugBlocked(w,p,'rescisión')) return; if(p.club>=0){ const c=w.clubs[p.club]; c.pids=c.pids.filter(id=>id!==p.id); c.xi=c.xi.map(id=>id===p.id?-1:id); c.subs=c.subs.filter(id=>id!==p.id); } p.club=-1; p.ce=0; p.val=calcValue(p); }
function setExpectation(w){
  const me=w.clubs[w.userClub]; const L=w.leagues[me.lg]; const byRep=L.clubs.slice().sort((a,b)=>w.clubs[b].rep-w.clubs[a].rep); const r=byRep.indexOf(me.id)+1, n=byRep.length;
  if(L.tier===2){ const p2= r<=3?2: r<=n/2?Math.ceil(n/2): n-2; w.board.expPos=p2; w.board.exp= p2===2?'Pelear por el ascenso':p2===Math.ceil(n/2)?'Terminar en la mitad superior':'Evitar el descenso'; return; }
  const pos= r<=1?1: r<=3?3: r<=6?6: r<=n/2?Math.ceil(n/2): n-3;
  w.board.expPos=pos;
  w.board.exp= pos===1?'Ganar la liga': pos===3?'Terminar entre los tres primeros': pos===6?'Clasificar entre los seis primeros': pos===Math.ceil(n/2)?'Terminar en la mitad superior':'Evitar los últimos puestos';
}

/* ---------- guardado: IndexedDB local + nube opcional ---------- */
const Store={
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('dt26',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{Store.db=r.result;res(true);}; r.onerror=()=>res(false); }catch(e){res(false);} }); },
  // idb: solo IndexedDB (las copias de seguridad no caben en localStorage). Si IndexedDB guarda bien, se borra la copia vieja de localStorage para que nunca se lea una versión anterior.
  async set(k,v,idb){ try{ if(!Store.db) await Store.open(); if(Store.db){ const ok=await new Promise(res=>{ try{ const tx=Store.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); tx.onabort=()=>res(false);}catch(e){res(false);} }); if(ok){ if(!idb) try{ if(localStorage.getItem('dt26_'+k)!=null) localStorage.removeItem('dt26_'+k); }catch(e){} return true; } } }catch(e){}
    if(idb) return false;
    try{ localStorage.setItem('dt26_'+k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  async get(k,idb){ try{ if(!Store.db) await Store.open(); if(Store.db){ const v=await new Promise(res=>{ try{ const r=Store.db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined);}catch(e){res(undefined);} }); if(v!==undefined) return v; } }catch(e){}
    if(idb) return undefined;
    try{ const s=localStorage.getItem('dt26_'+k); return s?JSON.parse(s):undefined; }catch(e){ return undefined; } },
  async del(k){ try{ if(!Store.db) await Store.open(); if(Store.db) await new Promise(res=>{ try{ const tx=Store.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=tx.onerror=tx.onabort=()=>res(); }catch(e){ res(); } }); }catch(e){} try{ localStorage.removeItem('dt26_'+k); }catch(e){} }
};
async function packWorld(w){
  const json=JSON.stringify(w);
  if(typeof CompressionStream!=='undefined'){ try{ const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return 'gz:'+btoa(s); }catch(e){} }
  return 'js:'+json;
}
async function unpackWorld(str){
  if(str.startsWith('js:')) return JSON.parse(str.slice(3));
  const bin=atob(str.slice(3)); const buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(ds).text());
}

/* ---------- protección de la partida: validación, copias de seguridad y recuperación ----------
   La partida vive en 'save' con el formato de siempre, para que cualquier versión del juego la pueda leer.
   Al lado se guardan 'save_meta' (cuándo y qué se guardó) y copias en IndexedDB, listadas en 'bak_index':
   auto (cada semana de juego), season (al empezar cada temporada), replace (antes de sustituir o borrar la partida),
   shrink (antes de un guardado que encoge de golpe), premig (antes de adaptar una partida antigua) y bad (una partida que no se pudo abrir). */
const BAK_KEEP={auto:3,season:3,replace:3,shrink:2,premig:2,bad:2};
const BAK_NAME={auto:'Automática',season:'Inicio de temporada',replace:'Antes de sustituirla',shrink:'Antes de un guardado sospechoso',premig:'Antes de actualizar el juego',bad:'No se pudo abrir'};
const SAVE={t:0,fail:0,err:'',warnT:0};
function strHash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
function worldMeta(w,s){ const c=w&&w.userClub>=0?w.clubs[w.userClub]:null; return {t:Date.now(),cr:(w&&w.created)||0,v:(w&&w.v)||VERSION,len:s.length,h:strHash(s),season:w?w.season:0,day:w?w.day:0,date:w?fDate(w,w.day,1):'',club:c?c.name:'',mgr:w&&w.mgr?w.mgr.name||'':''}; }
// revisa que la partida tenga sentido antes de escribirla encima de la anterior; fatal = no se guarda
function validateWorld(w){
  const fatal=[], warn=[], int=Number.isInteger, num=v=>typeof v==='number'&&isFinite(v);
  if(!w||typeof w!=='object') return {ok:false,fatal:['no es una partida'],warn};
  for(const k of ['leagues','clubs','players','fx','inbox','news']) if(!Array.isArray(w[k])) fatal.push('falta '+k);
  if(fatal.length) return {ok:false,fatal,warn};
  if(!w.clubs.length||!w.players.length||!w.leagues.length) fatal.push('mundo vacío');
  if(!int(w.season)||w.season<1900||w.season>3000) fatal.push('temporada imposible');
  if(!int(w.day)||w.day<0||w.day>400) fatal.push('día imposible');
  if(!int(w.userClub)||w.userClub<-1||w.userClub>=w.clubs.length) fatal.push('club del usuario imposible');
  if(w.userClub>=0&&(!w.mgr||typeof w.mgr!=='object')) fatal.push('falta el mánager');
  if(w.mode==='jug'&&(!w.pc||typeof w.pc!=='object'||!int(w.me)||!w.players[w.me])) fatal.push('falta tu jugador');
  let badP=0, badC=0, badRef=0, nan=0, mism=0;
  w.players.forEach((p,i)=>{ if(!p||p.id!==i||!Array.isArray(p.a)||p.a.length!==NA||!p.st) badP++; else if(!num(p.ovr)||!num(p.age)) nan++; });
  w.clubs.forEach((c,i)=>{ if(!c||c.id!==i||!Array.isArray(c.pids)||!c.fin||!w.leagues[c.lg]){ badC++; return; } if(!num(c.fin.bal)||!num(c.fin.tb)) nan++;
    for(const id of c.pids){ const p=w.players[id]; if(!p) badRef++; else if(p.club!==c.id) mism++; } });
  for(const L of w.leagues) if(!L||!Array.isArray(L.clubs)||L.clubs.some(id=>!w.clubs[id])) badC++;
  if(badP) fatal.push(badP+' jugadores dañados'); if(badC) fatal.push(badC+' clubes o ligas dañados'); if(badRef) fatal.push(badRef+' fichas de jugador perdidas');
  if(nan) warn.push(nan+' valores numéricos no válidos'); if(mism) warn.push(mism+' jugadores con club incoherente');
  return {ok:!fatal.length,fatal,warn}; }
// cambios de formato: si cambia la estructura de la partida, se sube VERSION y aquí se añade la conversión (MIGR[5]=w=>{…})
// 5: modo carrera de jugador (W.mode, W.me, W.pc). Las partidas de técnico no cambian; se sube la versión para que
//    las versiones anteriores del juego abran las partidas de jugador sin guardar encima (no saben manejarlas).
const MIGR={5:w=>{}};
function migrateWorld(w){ const v0=w.v||1; for(let v=v0+1;v<=VERSION;v++) if(MIGR[v]) MIGR[v](w); if(v0<VERSION) w.v=VERSION; return w; }
async function tryWorld(s){
  if(typeof s!=='string'||s.length<10) return {why:'vacía'};
  let w; try{ w=await unpackWorld(s); }catch(e){ return {why:'el archivo está dañado y no se puede leer'}; }
  const v=validateWorld(w); if(!v.ok) return {why:'datos dañados ('+v.fatal[0]+')'};
  if(!(w.userClub>=0)) return {why:'no hay partida en curso'};
  return {w}; }
// las copias se escriben de una en una para que el índice nunca se pise
let _bakQ=Promise.resolve();
function bakSerial(fn){ const p=_bakQ.then(fn,fn); _bakQ=p.catch(()=>{}); return p; }
async function bakList(){ const L=await Store.get('bak_index',true); return Array.isArray(L)?L:[]; }
function bakPut(kind,s,meta,label){ return bakSerial(async()=>{
  if(typeof s!=='string'||s.length<10) return false;
  const k='bak_'+kind+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(!await Store.set(k,s,true)) return false;
  const L=await bakList(); L.push(Object.assign({},meta||{},{k,kind,t:Date.now(),st:(meta&&meta.t)||0,label:label||''}));
  const drop=[]; for(const kd in BAK_KEEP) drop.push(...L.filter(b=>b.kind===kd).sort((a,b)=>b.t-a.t).slice(BAK_KEEP[kd]));
  if(!await Store.set('bak_index',L.filter(b=>!drop.includes(b)),true)) return false;
  for(const b of drop) await Store.del(b.k);
  return true; }); }
// copia lo que hay guardado ahora mismo, tal cual, antes de sustituirlo
async function bakCurrent(kind,label){ const s=await Store.get('save'); if(typeof s!=='string'||s.length<10) return false; return bakPut(kind,s,await Store.get('save_meta')||{},label); }
async function bakAuto(s,meta){
  const L=await bakList();
  if(!L.some(b=>b.kind==='season'&&b.season===meta.season&&b.cr===meta.cr)) await bakPut('season',s,meta);
  const last=L.filter(b=>b.kind==='auto').sort((a,b)=>b.t-a.t)[0];
  if(!last||last.season!==meta.season||meta.day-last.day>=7) await bakPut('auto',s,meta); }
function saveFail(msg){ SAVE.fail++; SAVE.err=msg||'No se pudo escribir en este dispositivo.';
  if(Date.now()-SAVE.warnT>180000){ SAVE.warnT=Date.now(); toast('No se pudo guardar la partida. Descarga una copia desde Ajustes','bad'); } }
// abre la partida del dispositivo; si está dañada, la aparta y recupera la copia más reciente que funcione
async function loadLocal(){
  let s=null, meta=null; try{ s=await Store.get('save'); meta=await Store.get('save_meta'); }catch(e){}
  // sin partida ni rastro de ella: primera vez o partida borrada a propósito
  if((typeof s!=='string'||s.length<10)&&!meta) return {w:null};
  const r=await tryWorld(s); if(r.w) return {w:r.w,s,meta};
  if(typeof s!=='string'||s.length<10){ s=typeof s==='string'?s+' ':'vacía'; r.why='el guardado está vacío'; }
  console.warn('partida guardada no válida:',r.why);
  if(await bakPut('bad',s,meta||{},r.why)){ await Store.del('save'); await Store.del('save_meta'); }
  // primero las copias de esta misma partida (cr = cuándo se creó), de la más reciente a la más antigua; después las demás
  const same=b=>meta&&meta.cr&&b.cr===meta.cr?1:0;
  for(const b of (await bakList()).filter(b=>b.kind!=='bad').sort((a,b)=>same(b)-same(a)||b.t-a.t)){
    const bs=await Store.get(b.k,true), r2=await tryWorld(bs); if(!r2.w) continue;
    const nm=Object.assign({},b,{t:Date.now()}); await Store.set('save',bs); await Store.set('save_meta',nm);
    return {w:r2.w,s:bs,meta:nm,rec:b,why:r.why}; }
  return {w:null,lost:r.why}; }
function bakWhen(b){ return new Date(b.t).toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
async function bakModal(){
  const L=(await bakList()).sort((a,b)=>b.t-a.t);
  modal(`<header><h3>Copias de seguridad</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header>
  <p class="muted" style="margin-top:0">El juego guarda copias solo en este dispositivo: cada semana de juego, al empezar cada temporada y antes de sustituir o borrar tu partida. Al restaurar una copia, tu partida actual también se guarda como copia.</p>
  <div class="col" style="gap:8px">${L.map(b=>`<div class="card" style="padding:10px 12px"><div class="row wrap" style="gap:10px"><div style="flex:1;min-width:190px"><b>${esc(b.club||'Partida')}</b> <span class="chip ${b.kind==='bad'?'bad':''}">${BAK_NAME[b.kind]||b.kind}</span><div class="muted" style="font-size:13px">${b.date?esc(b.date)+' · ':''}copia del ${bakWhen(b)}${b.label?' · '+esc(b.label):''}</div></div>${b.kind==='bad'?'':`<button class="btn sm pri" data-a="bakrestore" data-k="${b.k}">Restaurar</button>`}<button class="btn sm" data-a="bakdl" data-k="${b.k}">Descargar</button></div></div>`).join('')||'<p class="muted" style="margin:0">Todavía no hay copias. Se crearán solas mientras juegas.</p>'}</div>
  <p class="snote">Las copias viven en este navegador: si borras sus datos o cambias de dispositivo, desaparecen. Descarga una de vez en cuando y guárdala donde quieras; se recupera con Importar.</p>`,true); }
async function bakRestoreAsk(k){ const b=(await bakList()).find(x=>x.k===k); if(!b) return;
  modal(`<header><h3>Restaurar copia</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p style="margin-top:0">Vas a volver a <b>${esc(b.club||'la partida')}</b>${b.date?', '+esc(b.date):''} (copia del ${bakWhen(b)}).</p><p class="muted">Tu partida actual no se pierde: se guarda como copia antes de restaurar.</p><div class="row"><button class="btn pri" data-a="bakrestorego" data-k="${k}">Restaurar</button><button class="btn" data-a="bakopen">Volver</button></div>`); }
async function bakRestoreGo(k){ closeModal(); const s=await Store.get(k,true), r=await tryWorld(s);
  if(!r.w){ toast('Esa copia no se puede abrir: '+r.why,'bad'); return; }
  await adoptWorld(r.w,'Antes de restaurar una copia'); APP.notice=null; toast('Copia restaurada','good'); }
async function bakDownload(k){ const b=(await bakList()).find(x=>x.k===k), s=await Store.get(k,true); if(!b||typeof s!=='string'){ toast('No se encontró la copia','bad'); return; }
  const name=`dt26-copia-${(b.club||'partida').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')}-${new Date(b.t).toISOString().slice(0,10)}.txt`;
  if(CAP.downloads){ try{ await CAP.downloads.save({filename:name,data:new Blob([s],{type:'text/plain'})}); toast('Copia descargada','good'); return; }catch(e){ if(e&&e.code==='declined') return; } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Copia descargada','good'); }
  catch(e){ APP.exp=s; modal(`<header><h3>Copia de seguridad</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p style="margin-top:0">Copia este texto y guárdalo. Para recuperarlo usa Importar y después Pegar partida.</p><div class="row"><button class="btn pri" data-a="copyexp">Copiar todo (${Math.round(s.length/1024)} KB)</button></div>`); } }
function saveAgo(){ if(!SAVE.t) return 'todavía no hay ningún guardado'; const m=Math.round((Date.now()-SAVE.t)/60000); return m<1?'hace un momento':m===1?'hace 1 minuto':m<60?`hace ${m} minutos`:'hace más de una hora'; }

/* ---------- una sola pestaña guarda a la vez ----------
   Si el juego se abre en otra pestaña o ventana, la anterior guarda lo último, deja de guardar y avisa. Así nunca se pisan. */
const TAB={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),bc:null,peers:new Set(),wait:null};
try{ TAB.bc=new BroadcastChannel('dt26'); TAB.bc.onmessage=e=>{ tabMsg(e.data||{}).catch(err=>console.warn('pestañas',err)); }; TAB.bc.postMessage({t:'hello',id:TAB.id}); }catch(e){ TAB.bc=null; }
window.addEventListener('pagehide',()=>{ try{ TAB.bc&&TAB.bc.postMessage({t:'bye',id:TAB.id}); }catch(e){} });
async function tabMsg(m){
  if(!m.id||m.id===TAB.id) return;
  if(m.t==='hello'){ TAB.peers.add(m.id); try{ TAB.bc.postMessage({t:'here',id:TAB.id}); }catch(e){} return; }
  if(m.t==='here'){ TAB.peers.add(m.id); return; }
  if(m.t==='bye'){ TAB.peers.delete(m.id); return; }
  if(m.t==='released'){ if(m.to===TAB.id&&TAB.wait) TAB.wait(m.id); return; }
  if(m.t!=='claim') return;
  TAB.peers.add(m.id);
  if(!APP.ro){ if(APP.mode==='game'||APP.mode==='match') await saveNow(); APP.ro='tab'; tabLostUI(); }
  try{ TAB.bc.postMessage({t:'released',id:TAB.id,to:m.id}); }catch(e){} }
// antes de jugar, esta pestaña pide el turno: las demás guardan y se apartan
async function tabTakeover(){
  if(APP.ro==='tab') APP.ro=null;
  if(!TAB.bc) return;
  const left=new Set(TAB.peers);
  await new Promise(res=>{ const done=()=>{ TAB.wait=null; res(); };
    const t=setTimeout(()=>{ for(const id of left) TAB.peers.delete(id); done(); },1500);
    TAB.wait=id=>{ left.delete(id); if(!left.size){ clearTimeout(t); done(); } };
    try{ TAB.bc.postMessage({t:'claim',id:TAB.id}); }catch(e){ clearTimeout(t); done(); }
    if(!left.size){ clearTimeout(t); done(); } }); }
function tabLostUI(){
  APP.notice={title:'Partida abierta en otra pestaña',body:'Abriste DT26 en otra pestaña o ventana. Esta deja de guardar para no pisar tu progreso. Pulsa Continuar partida para traer aquí lo último que guardaste.'};
  if(APP.mode==='menu'){ renderMenu(); return; }
  if(APP.mode!=='game'&&APP.mode!=='match'&&APP.mode!=='full') return;
  if(MX.on&&MX.state==='play'&&!MX.paused){ MX.paused=true; hudBtns(); }
  modal(`<header><h3>Partida abierta en otra pestaña</h3></header><p style="margin-top:0">Abriste DT26 en otra pestaña o ventana. Para no pisar tu progreso, esta pestaña ya no guarda cambios.</p><div class="row wrap"><button class="btn pri" data-a="tabhere">Seguir jugando aquí</button></div><p class="snote">Seguir aquí vuelve a cargar tu último guardado en esta pestaña, y la otra dejará de guardar.</p>`); }
// si otra pestaña guardó después que esta, se trae su progreso antes de seguir
async function reloadIfNewer(){
  const meta=await Store.get('save_meta'); if(!meta||!meta.t||meta.t<=(APP.savedT||0)+500) return false;
  const r=await tryWorld(await Store.get('save')); if(!r.w) return false;

/* ---------- utilidades de vista ---------- */
const posChip=pos=>`<span class="pos ${PGRP[pos]}" title="${PNAME[pos]}">${PES[pos]}</span>`;
function rtChip(r){ if(!r) return '<span class="rt">—</span>'; const c=r>=8?'vh':r>=7?'hi':r<6?'lo':''; return `<span class="rt ${c}">${(+r).toFixed(1)}</span>`; }
const attrCls=v=>v>=17?'a5':v>=14?'a4':v>=11?'a3':v>=7?'a2':'a1';
const formAvg=p=>p.form.length? p.form.reduce((a,b)=>a+b,0)/p.form.length : 0;
function condBar(v){ v=Math.round(v); return `<div class="bar" style="width:52px" title="Estado físico ${v}%"><i style="width:${v}%;background:${v>85?'var(--good)':v>70?'#d9a526':'var(--bad)'}"></i></div>`; }
function morLabel(m){ return m>=80?['Excelente','good']:m>=62?['Buena','good']:m>=45?['Normal','']:m>=28?['Baja','bad']:['Muy baja','bad']; }
function crestLink(c,size=22,cls=''){ return `<span class="row ${cls}" data-a="cl" data-id="${c.id}" style="cursor:pointer;gap:8px">${crestSVG(c,size)}<b>${esc(c.name)}</b></span>`; }
function formStr(arr){ return `<span class="form">${arr.slice(-5).map(r=>`<i class="${r}">${r==='W'?'G':r==='D'?'E':'P'}</i>`).join('')}</span>`; }
function compName(f){
  if(f.cc!=null){ const C=CCD[f.cc]; if(C.sup) return W.leagues[f.sl]?supName(W.leagues[f.sl]):C.name; if(C.single) return `${C.name}, final`; return f.st===0? `${C.name}, grupo ${'ABCD'[f.g]} (jornada ${f.rd+1})` : `${C.name}, ${CCR[f.st].toLowerCase()}`; }
  const L=W.leagues[f.lg]; return f.cup? `${L.cupName}, ${CUPR[f.rd].toLowerCase()}` : `${L.name}, jornada ${f.rd+1}`; }
function compShort(f){ if(f.cc!=null) return CCD[f.cc].short; const L=W.leagues[f.lg]; return f.cup? L.cupName : L.name; }
function compCol(f){ return f.cc!=null? CCD[f.cc].col : f.cup? '#9aa3ad' : 'var(--club)'; }
const isKO=f=>!!(f&&(f.cup||f.ko));
function toast(msg,tone){ const d=document.createElement('div'); d.className='toast '+(tone||''); d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(),3200); }
function modal(html,wide){ const m=$('#modal'); m.innerHTML=`<div class="mbox ${wide?'wide':''}">${html}</div>`; m.classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; }
// actualiza el contenido de un modal ya abierto sin repetir la animación de entrada ni perder el scroll
function modalSet(html,wide){ const m=$('#modal'), box=m.querySelector('.mbox'); if(box&&!m.classList.contains('hidden')){ box.classList.toggle('wide',!!wide); box.style.animation='none'; box.innerHTML=html; } else modal(html,wide); }
function setTheme(t){ const r=document.documentElement; if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme'); try{localStorage.setItem('dt26_theme',t);}catch(e){} }

function go(v,o){ if(v==='fixtures') v='cal'; if(isJug(W)){ if(v==='club'||v==='squad'||v==='tactics') v='jclub'; else if(!JUGV.has(v)) v='home'; } if(v==='world') W.nseen=W.newsId||0; if(o) Object.assign(UI,o); UI.view=v; render(); const mn=$('#main'); if(mn) mn.scrollTop=0; }
function render(){
  if(!W||APP.mode!=='game') return;
  imgSync();
  const fs=focusState(); GFX.release&&GFX.release('view');
  $('#game').classList.toggle('edonly',!!UI.editorOnly);
  if(UI.editorOnly){
    $('#top').innerHTML=`<div class="club" style="cursor:default"><span><b>Editor de base de datos</b><small>DT26, antes de empezar partida</small></span></div><div class="sp"></div>`;
    $('#nav').innerHTML=''; $('#bnav').innerHTML=''; UI.view='editor'; $('#main').innerHTML=VIEWS.editor(); AFTER.editor&&AFTER.editor(); restoreFocus(fs); return; }
  clubVar(); renderTop(); renderNav();
  if(isJug(W)&&!JUGV.has(UI.view)) UI.view='home';
  tutMark(); const V=VIEWS[UI.view]||VIEWS.home; $('#main').innerHTML=V();
  AFTER[UI.view]&&AFTER[UI.view]();
  restoreFocus(fs);
}
function renderTop(){ if(isJug(W)){ jugTop(); return; }
  const c=W.clubs[W.userClub], uf=userFixture(W), wx=wxAt(W,W.leagues[c.lg].nat,W.day);
  const main=UI.busy?`<button class="go" data-a="simstop">Detener ${icon('step')}</button>`
    : `<button class="go" data-a="cont" title="Avanza hasta el próximo partido o decisión">${uf?'Jugar partido':'Continuar'} ${icon('play')}</button>`;
  $('#top').innerHTML=`<button class="club" data-a="go" data-v="cal" aria-label="Abrir calendario">${crestSVG(c,30)}<span><b>${esc(c.name)}</b><small>${fDate(W,W.day,1)} · <span class="wx-${wx.k}">${wxSVG(wx.k,15)}</span> ${wx.t}°</small></span></button><div class="sp"></div>
  <button class="tbb mundo-b" data-a="go" data-v="world" title="Noticias del mundo (N)">${icon('world')}<span class="tl">Mundo</span>${navBadge('world')}</button>
  <button class="tbb" data-a="pal" title="Buscar (Ctrl+K)" aria-label="Buscar">${icon('search')}<span class="tl">Buscar</span><kbd>Ctrl K</kbd></button>
  <div class="money">${money(c.fin.bal)}<small>Fichajes: ${money(c.fin.tb)}</small></div>
  ${uf||UI.busy?'':`<button class="tbb" data-a="adv" data-v="day" title="Simular un solo día">${icon('step')}<span class="tl">+1 día</span></button>`}
  ${main}`;
}
function navBadge(v){
  if(v==='inbox'){ const n=W.inbox.filter(m=>!m.read).length; return n?`<span class="badge">${n>99?'99+':n}</span>`:''; }
  if(v==='world'){ if(UI.view==='world') W.nseen=W.newsId||0; const n=W.news.filter(x=>x.id>(W.nseen||0)).length; return n?`<span class="badge" style="background:#2f7dd1;color:#fff">${n>99?'99+':n}</span>`:''; }
  if(v==='home'){ const n=pendingActs().length; return n?`<span class="badge" style="background:var(--acc);color:var(--accText)">${n}</span>`:''; }
  return '';
}
function navOn(v){ return UI.view===v||(isJug(W)&&((v==='jme'&&UI.view==='player'&&UI.pid===W.me)||(v==='jclub'&&UI.view==='team'&&UI.cid===jugClub(W))))||(UI.view==='story'&&(UI.stBack===v||(!UI.stBack&&v==='world')))||(v==='squad'&&UI.view==='player'&&W.players[UI.pid]?.club===W.userClub)||(v==='comp'&&UI.view==='team')||(v==='cal'&&UI.view==='fixtures'); }
function renderNav(){
  const ok=v=>v!=='ai'||CAP.sample;
  $('#nav').innerHTML=navGroups().map(([g,items])=>`<div class="ng">${g}</div>`+items.filter(([v])=>ok(v)).map(([v,l,ic])=>`<button class="nv ${navOn(v)?'on':''}" data-a="go" data-v="${v}" title="${NAVDESC[v]||''}">${icon(ic)}<span>${l}</span>${navBadge(v)}</button>`).join('')).join('')+
   `<div class="sep"></div><button class="nv" data-a="exit">${icon('exit')}<span>Menú principal</span></button>`;
  const B=isJug(W)?[['home','Inicio','home'],['world','Mundo','world'],['cal','Calendario','cal'],['jme','Jugador','mgr'],['jtrain','Entreno','tactics']]:[['home','Inicio','home'],['world','Mundo','world'],['cal','Calendario','cal'],['squad','Plantilla','squad'],['tactics','Tácticas','tactics']];
  const unread=W.inbox.filter(m=>!m.read).length, nwn=UI.view==='world'?0:W.news.filter(x=>x.id>(W.nseen||0)).length;
  $('#bnav').innerHTML=B.map(([v,l,ic])=>`<button class="nv ${navOn(v)?'on':''}" data-a="go" data-v="${v}">${icon(ic)}<span>${l}</span>${v==='home'&&unread?`<span class="badge" style="position:absolute;margin:-4px 0 0 22px">${unread}</span>`:''}${v==='world'&&nwn?`<span class="badge" style="position:absolute;margin:-4px 0 0 22px;background:#2f7dd1;color:#fff">${nwn>99?'99+':nwn}</span>`:''}</button>`).join('')+`<button class="nv ${B.some(b=>navOn(b[0]))?'':'on'}" data-a="more">${icon('more')}<span>Más</span></button>`;
}

VIEWS.home=()=>{ if(isJug(W)) return jugHome();
  const me=W.clubs[W.userClub], L=W.leagues[me.lg], nf=nextUserFixture(W);

function offerAct(id,r){
  const m=W.inbox.find(x=>x.id===id); if(!m||!m.act||m.act.done) return; const a=m.act;
  const p=W.players[a.p], b=W.clubs[a.c], me=W.clubs[W.userClub];

  if(r==='neg'){ negSellOpen(m); return; }
  a.done=true;
  if(r==='acc') sellPlayer(p,b,a.fee);
  else { toast('Oferta rechazada'); if(p.tr===1) p.mor=clamp(p.mor-6,5,100); if(b.rep>me.rep+5&&p.ovr>=avgOvr(W,me)) { p.mor=clamp(p.mor-8,5,100); p.unset=W.day; } }

function sellPlayer(p,b,fee){
  const me=W.clubs[W.userClub];
  if(p.ovr>=avgOvr(W,me)+3) fanMood(W,me,-7); else if(fee>=p.val*1.3) fanMood(W,me,1); // vender a un ídolo duele
  transfer(W,p,b,fee,wageDemand(W,p,b),ri(3,5)); fixLineup(W,me);
  toast(`${pname(p)} vendido a ${b.name} por ${money(fee)}`,'good');
  news(W,`${me.name} vende a ${pname(p)}`,`${pname(p)} se marcha a ${b.name} por ${money(fee)}.`,'fich',me.lg);
  soc(W,fee>=p.val*1.2?`Vender a ${sname(p)} por ${money(fee)} es un negocio redondo. Bien jugado.`:`¿En serio dejamos ir a ${sname(p)}? Nadie lo entiende.`,fee>=p.val*1.2?'good':'bad');
  if(fee>=40e6) unlock(W,'sell');
}

function radarSVG(p){
  const g=p.pos==='GK';
  const ax=g? [['Reflejos',['ref','agi']],['Blocaje',['han','psn']],['Mando',['cmd','com','aer']],['Uno contra uno',['one','rus']],['Distribución',['kic','thr','pas']],['Mentalidad',['cmp','cnt','dec']],['Físico',['str','jum','bal']],['Velocidad',['acc','pac']]]
   : [['Defensa',['mar','tck','psn']],['Físico',['str','sta','bal']],['Velocidad',['pac','acc']],['Creatividad',['vis','pas','fla']],['Ataque',['fin','otb','cmp']],['Técnica',['tec','dri','fir']],['Juego aéreo',['hea','jum']],['Mentalidad',['dec','det','tea','wor']]];
  const n=ax.length, cx=150, cy=118, R=80, pt=(i,r)=>[cx+Math.sin(i/n*2*Math.PI)*r, cy-Math.cos(i/n*2*Math.PI)*r];
  let s=`<svg viewBox="0 0 300 240" width="100%" style="max-width:340px" role="img" aria-label="Radar de atributos">`;
  for(const f of [.25,.5,.75,1]) s+=`<polygon points="${ax.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  const vals=ax.map(([,ks])=>ks.reduce((a,k)=>a+p.a[A[k]],0)/ks.length/20);
  const col=W.clubs[p.club]?.col[0]||'#3a7';
  s+=`<polygon points="${vals.map((v,i)=>pt(i,R*v).join(',')).join(' ')}" fill="${col}" fill-opacity=".35" stroke="var(--acc)" stroke-width="2"/>`;
  ax.forEach(([l],i)=>{ const [x,y]=pt(i,R+22); s+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-family="Barlow">${l}</text>`; });
  return s+'</svg>';
}
function miniPitch(p){
  let s=`<div class="minipitch" aria-label="Posiciones">`;
  for(const pos of POS){ const f=fam(p,pos); if(f<11) continue; const [x,y]=PMAP[pos]; s+=`<i style="left:${x}%;top:${y}%;background:${f>=18?'#2fd06a':f>=15?'#b9e04a':'#f2b23a'}" title="${PNAME[pos]}"></i>`; }
  return s+'</div>';
}

VIEWS.market=()=>{
  const f=UI.mk, open=inWindow(W);
  let ps=W.players.filter(p=>!p.ret&&p.club!==W.userClub);
  if(f.lg===-1) ps=ps.filter(p=>p.club<0); else if(f.lg>=0) ps=ps.filter(p=>p.club>=0&&W.clubs[p.club].lg===f.lg);
  if(f.lg===-3) ps=W.short.map(id=>W.players[id]).filter(p=>p&&!p.ret);
  if(f.pos) ps=ps.filter(p=>p.pos===f.pos||(p.sec[f.pos]||0)>=15);
  if(f.age<40) ps=ps.filter(p=>p.age<=f.age);
  if(f.val>0) ps=ps.filter(p=>p.val<=f.val);
  if(f.st>0) ps=ps.filter(p=>stars(p.ovr)>=f.st);
  if(f.q){ const q=f.q.toLowerCase(); ps=ps.filter(p=>pname(p).toLowerCase().includes(q)||(p.fn+' '+p.ln).toLowerCase().includes(q)); }
  const K={ovr:p=>p.ovr,pa:p=>p.pa,age:p=>p.age,val:p=>p.val,wage:p=>p.wage,name:p=>p.ln};
  const k=K[f.sort]||K.ovr; ps.sort((a,b)=>(k(a)<k(b)?-1:k(a)>k(b)?1:0)*f.dir);
  const total=ps.length; ps=ps.slice(0,80);
  const th=(key,l,cls='')=>`<th class="${cls}" data-a="mksort" data-k="${key}">${l}${f.sort===key?(f.dir>0?' ▲':' ▼'):''}</th>`;
  const lgOpts=`<option value="-2">Todas las ligas</option><option value="-1" ${f.lg===-1?'selected':''}>Agentes libres</option><option value="-3" ${f.lg===-3?'selected':''}>Mi lista de seguimiento</option>`+W.leagues.map(l=>`<option value="${l.id}" ${f.lg===l.id?'selected':''}>${esc(l.name)}</option>`).join('');
  const vals=[0,250e3,1e6,3e6,8e6,20e6,50e6];
  return `<div class="head"><div><h2>Mercado de fichajes</h2><div class="${open?'good':'muted'}">${open?'Ventana abierta. Puedes negociar traspasos.':'Ventana cerrada (abre en julio y enero). Los agentes libres pueden firmar en cualquier momento.'}</div></div><div class="sp"></div><div class="kv"><dt>Presupuesto</dt><dd>${money(W.clubs[W.userClub].fin.tb)}</dd></div></div>
  <div class="card" style="margin-bottom:12px"><div class="row wrap">
   <input type="search" placeholder="Buscar por nombre" value="${esc(f.q)}" data-in="mk" data-k="q" style="flex:1;min-width:160px">
   <select data-in="mk" data-k="lg" aria-label="Liga">${lgOpts}</select>
   <select data-in="mk" data-k="pos" aria-label="Posición"><option value="">Todas las posiciones</option>${POS.map(p=>`<option value="${p}" ${f.pos===p?'selected':''}>${PNAME[p]}</option>`).join('')}</select>
   <select data-in="mk" data-k="age" aria-label="Edad máxima">${[40,21,23,25,28,31].map(a=>`<option value="${a}" ${f.age===a?'selected':''}>${a===40?'Cualquier edad':'Hasta '+a+' años'}</option>`).join('')}</select>
   <select data-in="mk" data-k="val" aria-label="Valor máximo">${vals.map(v=>`<option value="${v}" ${f.val===v?'selected':''}>${v?'Hasta '+money(v):'Cualquier valor'}</option>`).join('')}</select>
   <select data-in="mk" data-k="st" aria-label="Nivel mínimo">${[0,2,3,3.5,4,4.5].map(v=>`<option value="${v}" ${f.st===v?'selected':''}>${v?v+' estrellas o más':'Cualquier nivel'}</option>`).join('')}</select>
  </div></div>
  <div class="muted" style="margin-bottom:6px">${total} jugadores${total>80?' (mostrando 80)':''}</div>
  <div class="tw"><table class="t"><thead><tr>${th('name','Jugador','stick')}<th>Club</th><th>Pos</th>${th('age','Edad','c')}<th class="c">Nac</th>${th('ovr','Media')}${th('pa','Potencial')}${th('val','Valor','r')}${th('wage','Salario','r')}<th class="c">Contrato</th><th></th></tr></thead><tbody>
  ${ps.map(p=>`<tr data-a="pl" data-id="${p.id}"><td class="stick"><span class="pn">${avatar(p)}<b>${esc(pname(p))}</b>${W.short.includes(p.id)?' <span class="accent">★</span>':''}</span></td><td>${p.club>=0?`<span class="row" style="gap:6px">${crestSVG(W.clubs[p.club],16)}${esc(W.clubs[p.club].short)}</span>`:'<span class="chip">Libre</span>'}</td><td>${posChip(p.pos)}</td><td class="c">${p.age}</td><td class="c">${flagSVG(p.nat)}</td><td>${starsHTML(p.ovr)}</td><td>${starsHTML(p.pa)}</td><td class="r">${money(p.val)}</td><td class="r">${money(p.wage)}</td><td class="c">${p.ce||'—'}</td><td><button class="btn sm" data-a="bid" data-id="${p.id}">${p.club<0?'Fichar':'Ofertar'}</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">Ningún jugador cumple los filtros</td></tr>'}
  </tbody></table></div>`;
};
function openBid(pid){
  const p=W.players[pid], me=W.clubs[W.userClub];
  if(p.club===me.id) return;
  if(p.club>=0&&!inWindow(W)){ modal(`<header><h3>Mercado cerrado</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p>Solo se pueden negociar traspasos en julio, agosto y enero. Añade a ${esc(pname(p))} a tu lista de seguimiento y vuelve cuando abra la ventana.</p><button class="btn" data-a="shortl" data-id="${p.id}">Seguir jugador</button>`); return; }
  if(p.club<0){ negPlayerOpen(pid,null,'free'); return; }
  if(p.nb&&p.nb>W.day){ modal(`<header><h3>Negociación rota</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p style="margin-top:0">${esc(W.clubs[p.club].name)} no quiere volver a sentarse contigo por ${esc(pname(p))} hasta el ${fDate(W,p.nb,1)}.</p>`); return; }
  negBuyOpen(pid); return;
  const c=W.clubs[p.club]; const sug=roundMoney(p.val);
  modal(`<header><h3>Oferta por ${esc(pname(p))}</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header>
   <div class="row" style="gap:12px;margin-bottom:12px">${avatar(p)}<div><b>${esc(pname(p))}</b><div class="muted">${PNAME[p.pos]}, ${p.age} años, ${esc(c.name)}</div></div></div>
   <div class="kv" style="margin-bottom:12px"><dt>Valor de mercado</dt><dd>${money(p.val)}</dd><dt>Tu presupuesto</dt><dd>${money(me.fin.tb)}</dd><dt>Situación</dt><dd>${p.tr===1?'Transferible':p.tr===2?'Intransferible':'No está en venta'}</dd></div>
   <label class="f">Cantidad ofrecida<input type="range" min="${roundMoney(p.val*.4)}" max="${roundMoney(Math.max(p.val*3,1e5))}" step="${p.val>2e6?50000:5000}" value="${sug}" data-in="bidr"></label>
   <div class="row" style="margin:10px 0 14px"><b class="cond" style="font-size:26px" id="bidv">${money(sug)}</b><span class="sp"></span></div>
   <input type="hidden" id="bidfee" value="${sug}"><div class="row"><button class="btn pri" data-a="bidgo" data-id="${p.id}">Enviar oferta</button><button class="btn" data-a="close">Cancelar</button></div>`);
}
function bidGo(pid){
  const p=W.players[pid], me=W.clubs[W.userClub], fee=+$('#bidfee').value, c=W.clubs[p.club];
  if(fee>me.fin.tb){ toast('No tienes presupuesto suficiente','bad'); return; }
  const ask=askingPrice(W,p);
  if(p.tr===2&&fee<ask){ modal(`<header><h3>${esc(c.name)} responde</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p>${esc(pname(p))} es intransferible para ${esc(c.name)}. No lo venderán por esa cantidad.</p>`); return; }
  if(fee>=ask){ contractModal(pid,fee); return; }
  if(fee>=ask*.78&&rc(.6)){ const ct=roundMoney(ask*(1+rf()*.08));
    modal(`<header><h3>${esc(c.name)} hace una contraoferta</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p>No aceptan ${money(fee)}, pero venderían a ${esc(pname(p))} por <b>${money(ct)}</b>.</p><div class="row"><button class="btn pri" data-a="bidct" data-id="${pid}" data-v="${ct}">Aceptar ${money(ct)}</button><button class="btn" data-a="bid" data-id="${pid}">Cambiar oferta</button></div>`); return; }
  modal(`<header><h3>Oferta rechazada</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p>${esc(c.name)} rechaza ${money(fee)} por ${esc(pname(p))}. Tendrás que mejorarla considerablemente.</p><button class="btn" data-a="bid" data-id="${pid}">Nueva oferta</button>`);
}
function contractModal(pid,fee){
  { const p=W.players[pid]; negPlayerOpen(pid,fee?{fee,base:fee}:null,p.club===W.userClub?'renew':fee?'sign':'free'); return; }
  const p=W.players[pid], me=W.clubs[W.userClub], own=p.club===me.id, want=wageDemand(W,p,me);
  modal(`<header><h3>${own?'Renovación':'Contrato'}: ${esc(pname(p))}</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header>
  ${fee?`<p class="good" style="margin-top:0">Traspaso acordado por ${money(fee)}. Falta convencer al jugador.</p>`:''}
  <div class="kv" style="margin-bottom:12px"><dt>Pretensión salarial</dt><dd>${money(want)}/sem</dd><dt>Salario actual</dt><dd>${money(p.wage)}/sem</dd><dt>Masa salarial</dt><dd>${money(wageBill(W,me))} de ${money(me.fin.wb)}</dd></div>
  <div class="row wrap"><label class="f" style="flex:1">Salario semanal<input type="number" id="cw" value="${want}" step="500" min="0"></label><label class="f">Años<select id="cy">${[1,2,3,4,5].map(y=>`<option ${y===3?'selected':''}>${y}</option>`).join('')}</select></label></div>
  <div class="row" style="margin-top:14px"><button class="btn pri" data-a="sign" data-id="${pid}" data-v="${fee}">${own?'Ofrecer renovación':'Ofrecer contrato'}</button><button class="btn" data-a="close">Cancelar</button></div>`);
}
function signGo(pid,fee){
  const p=W.players[pid], me=W.clubs[W.userClub], own=p.club===me.id;
  const wage=Math.max(0,+$('#cw').value||0), yrs=+$('#cy').value||3, want=wageDemand(W,p,me);
  const it=own? .9 : interest(W,p,me);
  if(!own&&rf()>it+ (wage>want*1.25?.25:0)){ modal(`<header><h3>Sin acuerdo</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header><p>${esc(pname(p))} no está interesado en fichar por ${esc(me.name)} ahora mismo. Busca un club con más prestigio o prueba más adelante.</p>`); if(fee) W.short=W.short.filter(x=>x!==p.id); return; }
  if(wage<want*.93){ toast(`${sname(p)} pide al menos ${money(roundMoney(want*.95))}`,'bad'); return; }
  if(own){ p.wage=wage; p.ce=W.season+yrs; p.mor=clamp(p.mor+8,5,100); p.val=calcValue(p); toast(`${sname(p)} renueva hasta ${p.ce}`,'good'); }
  else { const from=p.club>=0?W.clubs[p.club]:null; transfer(W,p,me,fee,wage,yrs); fixLineup(W,me);
    if(wageBill(W,me)>me.fin.wb) W.board.conf=clamp(W.board.conf-3,0,100);
    news(W,`${me.name} ficha a ${pname(p)}`,`${pname(p)} llega${from?' desde '+from.name:' como agente libre'}${fee?' por '+money(fee):''}.`);
    mail(W,'Director deportivo',`Fichaje cerrado: ${pname(p)}`,`${pname(p)} firma por ${yrs} temporada(s) con un salario de ${money(wage)} por semana.${fee?' Traspaso: '+money(fee)+'.':''}`,'good');
    toast(`¡${pname(p)} ficha por ${me.name}!`,'good'); }
  closeModal(); autosave(); render();
}

function balanceChart(c){
  const h=c.fin.hist.slice(-24); if(h.length<2) return '<p class="muted">El histórico aparecerá tras el primer mes.</p>';
  const mn=Math.min(0,...h), mx=Math.max(...h), W_=320, H_=110, sx=i=>i/(h.length-1)*W_, sy=v=>H_-(v-mn)/(mx-mn||1)*H_;
  return `<svg viewBox="-4 -6 ${W_+8} ${H_+12}" width="100%" role="img" aria-label="Evolución del saldo"><line x1="0" x2="${W_}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/><path d="M${h.map((v,i)=>sx(i)+','+sy(v)).join(' L')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/><path d="M0,${sy(mn)} L${h.map((v,i)=>sx(i)+','+sy(v)).join(' L')} L${W_},${sy(mn)} Z" fill="var(--acc)" opacity=".12"/></svg>`;
}

   <div class="row wrap" style="gap:8px">${mine?`<button class="btn" data-a="resign">Dimitir</button>`:`<button class="btn" data-a="teamsq" data-id="${c.id}">Ver plantilla</button>`}<button class="btn" data-a="edcl" data-id="${c.id}">Cambiar escudo</button></div></div></div>
  <div class="g2"><div class="col"><div class="card"><h3>${esc(c.st.name)}<span class="sp"></span><button class="btn sm" data-a="stadfull" data-id="${c.id}">Pantalla completa</button></h3>

function sndTest(k){
  if(!SND.on){ toast('El sonido está en silencio'); return; }
  const c=auCtx(); if(!c){ toast('Este navegador no permite sonido','bad'); return; }
  clearTimeout(AU.idleT);
  const run=()=>{ const t=c.currentTime+.02;
    if(k==='voz'){ if(!narOK()){ toast('Este navegador no trae voz sintética','bad'); return; } if(!SND.voice){ toast('Activa el narrador para probarlo'); return; } narVoice(); say([{t:'¡Gooool!',rate:.62,pitch:1.25},{t:NAR.la?'Así suena el narrador de DT26. ¡Qué atajada!':'Así suena el narrador de DT26. ¡Qué parada!'}],5); }
    else if(k==='gol'){ auNoise(t,4.6,'bandpass',700,.6,.95,.35,1500); auNoise(t+.1,3.8,'lowpass',900,.5,.5,.5); setTimeout(()=>horn(),220); }
    else if(k==='afi'){ if(!SND.crowd){ toast('Activa los cánticos y palmas para probarlos'); return; } claps('tres',.55,false); setTimeout(()=>chant(Math.floor(Math.random()*CHANTS.length),.7,false),400); }
    auIdleSoon(12000); };
  if(c.state!=='running'){ try{ const p=c.resume(); if(p&&p.then) p.then(run,run); else run(); }catch(e){ run(); } } else run();
}

function tacTap(t,i){
  const c=W.clubs[W.userClub], s=UI.tacSel;
  if(!s){ if(t!=='se') UI.tacSel={t,i}; render(); return; }
  if(s.t===t&&s.i===i){ UI.tacSel=null; render(); return; }
  if(t==='se'){ if(s.t==='r'&&c.subs.length<9) c.subs.push(s.i); else if(s.t==='x'){ /* no se puede dejar un hueco en el once */ } UI.tacSel=null; render(); return; }
  if(s.t==='x'&&t==='x'){ [c.xi[s.i],c.xi[i]]=[c.xi[i],c.xi[s.i]]; }
  else if(s.t==='x'||t==='x'){ const X=s.t==='x'?s:{t,i}, O=s.t==='x'?{t,i}:s; const old=c.xi[X.i]; c.xi[X.i]=O.i; if(O.t==='s'){ const k=c.subs.indexOf(O.i); if(k>=0) c.subs[k]=old; } }
  else if(s.t==='s'&&t==='r'){ const k=c.subs.indexOf(s.i); c.subs[k]=i; }
  else if(s.t==='r'&&t==='s'){ const k=c.subs.indexOf(i); c.subs[k]=s.i; }
  else if(s.t==='s'&&t==='s'){ const a=c.subs.indexOf(s.i), b=c.subs.indexOf(i); [c.subs[a],c.subs[b]]=[c.subs[b],c.subs[a]]; }
  else { UI.tacSel={t,i}; render(); return; }
  UI.tacSel=null; render();
}
function reassign(c){
  const ids=c.xi.slice(), form=FORMS[c.tac.f], cand=[];
  form.forEach((s,i)=>ids.forEach(id=>cand.push([posRating(W.players[id],s[0]),i,id])));
  cand.sort((a,b)=>b[0]-a[0]); const xi=new Array(11).fill(-1), used=new Set();
  for(const [,i,id] of cand){ if(xi[i]!==-1||used.has(id)) continue; xi[i]=id; used.add(id); }
  c.xi=xi;
}

   ${wxNote(wx)?`<p class="muted" style="margin:0 0 10px">${wxNote(wx)}</p>`:''}
   <div class="card" style="margin-bottom:12px"><h3>Previa</h3><ul class="pre">${P.ev.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="odds" style="margin-top:10px"><i style="width:${ph}%;background:${hc}"></i><i style="width:${pd}%;background:#8b958f"></i><i style="width:${pa}%;background:${ac}"></i></div><div class="row muted" style="justify-content:space-between;font-size:12.5px"><span>${esc(H.name)} ${ph}%</span><span>Empate ${pd}%</span><span>${esc(Aw.name)} ${pa}%</span></div></div>

const PITCH_LINES='<g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".5"><rect x=".3" y=".3" width="104.4" height="67.4"/><path d="M52.5 0V68"/><circle cx="52.5" cy="34" r="8.5"/><rect x=".3" y="13.8" width="16.5" height="40.4"/><rect x="88.2" y="13.8" width="16.5" height="40.4"/><rect x=".3" y="24.8" width="5.5" height="18.4"/><rect x="99.2" y="24.8" width="5.5" height="18.4"/></g>';
function heatSVG(h,col){ const mx=Math.max(1,...h); let s='';
  for(let gx=0;gx<7;gx++) for(let gy=0;gy<5;gy++){ const v=h[gx*5+gy]/mx; s+=`<rect x="${gx*15}" y="${(gy*13.6).toFixed(1)}" width="15" height="13.6" fill="${col}" fill-opacity="${(.06+v*.85).toFixed(2)}"/>`; }
  return `<svg viewBox="0 0 105 68" class="pitchmap" role="img" aria-label="Mapa de posesión"><rect width="105" height="68" fill="#245f35"/>${s}${PITCH_LINES}<path d="M8 63h20m-4-3l4 3-4 3" stroke="#fff" stroke-opacity=".7" fill="none" stroke-width="1"/></svg>`; }
function shotSVG(shots,si,col){ const dots=(shots||[]).filter(s=>s[0]===si).map(([,x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r===2?2.6:1.7}" fill="${r===2?'#f2b23a':r===3?'#e8e8e8':r===1?col:'none'}" stroke="${r===2?'#fff':col}" stroke-width=".7" fill-opacity="${r===1?.85:1}"/>`).join('');
  return `<svg viewBox="45 0 60 68" class="pitchmap" role="img" aria-label="Mapa de remates"><rect x="45" width="60" height="68" fill="#245f35"/>${PITCH_LINES}${dots}</svg>`; }
function heatBlock(heat,shots,teams,cols){ // teams: [club, club]
  const one=i=>`<div><div class="muted" style="font-size:12.5px;margin-bottom:4px">${esc(teams[i].short||teams[i].name)} · posesión (ataca →)</div>${heatSVG(heat[i],cols[i])}</div>`;
  const two=i=>`<div><div class="muted" style="font-size:12.5px;margin-bottom:4px">${esc(teams[i].short||teams[i].name)} · remates</div>${shotSVG(shots,i,cols[i])}</div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${one(0)}${one(1)}${two(0)}${two(1)}</div><p class="snote" style="margin:6px 0 0">Círculo dorado: gol · lleno: a puerta · hueco: fuera o bloqueado.</p>`; }
function statLine(l,a,b,fmt){ fmt=fmt||(v=>v); const t=(+a)+(+b)||1; return `<div class="statline"><b>${fmt(a)}</b><div><div class="muted" style="text-align:center;font-size:12.5px">${l}</div><div class="bb"><i style="width:${a/t*100}%;background:var(--hc)"></i><i style="width:${b/t*100}%;background:var(--ac)"></i></div></div><b style="text-align:right">${fmt(b)}</b></div>`; }
function kitCols(h,a){ let hc=h.col[0], ac=a.col[0]; if(cdist(hc,ac)<120) ac=a.col[1]; if(cdist(hc,ac)<120) ac='#8a8f99'; return [hc,ac]; }
// para barras sobre fondo claro u oscuro: evita blancos y negros puros que se pierden
function oddsCols(h,a){ const pick=c=>{ let x=c.col[0]; if(lum(x)>.82||lum(x)<.08) x=c.col[1]; if(lum(x)>.82||lum(x)<.08) x=c.col[2]; if(lum(x)>.82||lum(x)<.08) x='#6b7f75'; return x; };
  let hc=pick(h), ac=pick(a); if(cdist(hc,ac)<110) ac='#8a8f99'; return [hc,ac]; }
function reportHTML(fid){
  const f=fxFromRep(fid), R=getRep(fid); if(!R||!f) return '<p>Sin informe.</p>'; const h=W.clubs[f.h], a=W.clubs[f.a];

  const rt=S=>`<div class="tw"><table class="t"><tbody>${S.pl.slice().sort((x,y)=>(x[5]>0)-(y[5]>0)||POS.indexOf(x[1])-POS.indexOf(y[1])).map(r=>{ const p=W.players[r[0]]; return `<tr data-a="pl" data-id="${p.id}" data-close="1"><td>${posChip(r[1])}</td><td>${esc(sname(p))}${r[3]?' ⚽'.repeat(Math.min(r[3],3)):''}${r[7]?' 🟨':''}${r[8]?' 🟥':''}${r[0]===R.mom?' <span class="accent">★</span>':''}</td><td class="c muted">${r[5]>0?r[5]+"'":''}</td><td class="c">${rtChip(r[2])}</td></tr>`; }).join('')}</tbody></table></div>`;
  const s0=R.s[0].st,s1=R.s[1].st;

const PRESS_REP=['Laura Méndez, Radio Deportiva','Iván Robles, Diario Gol','Carla Ibarra, Canal 11','Marcos Tena, El Silbato','Paula Rangel, Cadena Fútbol','Gustavo Ortega, La Tribuna','Inés Salvatierra, Radio Estadio','Beto Cárdenas, Podcast Área Chica','Marina Duarte, Diario Marca Blanca'];
