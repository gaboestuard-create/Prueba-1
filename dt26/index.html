function pressFallback(me,op,gf,ga){
  const win=gf>ga, lose=gf<ga, P=posOf(W,me), r=lastRes(W,me,5), hot=r.length>=3&&r.slice(0,3).every(x=>x==='W'), cold=r.length>=3&&r.slice(0,3).every(x=>x==='L');
  const inj=me.pids.map(id=>W.players[id]).filter(p=>p&&p.inj>0).length, fm=fansOf(me).mood, conf=W.board.conf;
  const O=(a,b,c)=>[[a[0],a[1]],[b[0],b[1]],[c[0],c[1]]];
  const first={q:win?`Gran resultado ante ${op.name}. ¿Es este el equipo que imaginaba al llegar?`:lose?`Duro golpe ante ${op.name}. ¿Qué falló hoy?`:`Reparto de puntos con ${op.name}. ¿Sabe a poco?`,
    o:win?O(['Todavía no hemos hecho nada; toca seguir trabajando.','calma'],['Este equipo puede pelear con cualquiera.','confianza'],['No me conformo: se pudo ganar con más claridad.','exigencia']):
      lose?O(['Fue un mal día; lo analizaremos con calma.','calma'],['Nos vamos a levantar, tengo plena fe en este grupo.','confianza'],['Hoy hubo cosas que no me gustaron y lo hablaremos.','exigencia']):
      O(['Es un punto que suma; seguimos creciendo.','calma'],['Merecimos más, ya llegará.','confianza'],['No se puede regalar tanto en casa o fuera.','polemica'])};
  const pool=[];
  pool.push({q:`¿Cómo valora el momento de la afición de ${me.city}?`,o:O(['La afición merece todo nuestro esfuerzo.','calma'],['Que vengan todos al próximo partido: los necesitamos.','confianza'],['Que nos juzguen al final de la temporada, no ahora.','polemica'])});
  pool.push({q:'¿Qué le dice a los jugadores que tienen menos minutos?',o:O(['Todos van a tener su oportunidad.','calma'],['Quien entrene mejor, jugará. Así de simple.','exigencia'],['Tengo la mejor plantilla de la liga, el que no lo vea que no mire.','polemica'])});
  if(hot) pool.push({q:'Llevan una racha estupenda. ¿Se les está subiendo a la cabeza?',o:O(['La cabeza se queda en el vestuario, con los pies en la tierra.','calma'],['Vamos a por todo mientras el equipo esté así de enchufado.','confianza'],['Si alguien se relaja, se sienta. Aquí nadie tiene el puesto asegurado.','exigencia'])});
  if(cold) pool.push({q:'Tres derrotas seguidas. ¿Está en peligro su puesto?',o:O(['Mi trabajo es levantar al equipo, no mirar mi futuro.','calma'],['Tengo la confianza del club y del vestuario.','confianza'],['Que decida la directiva; yo seguiré dando la cara.','polemica'])});
  if(P.p>=6&&P.i<=3) pool.push({q:`Están ${P.i}º en la tabla. ¿Hablamos ya de título?`,o:O(['No hablamos de títulos, hablamos del próximo partido.','calma'],['Sí: este equipo tiene nivel para pelear arriba hasta el final.','confianza'],['Los que miran la tabla se distraen. Aquí se trabaja.','exigencia'])});
  if(P.p>=6&&P.i>=P.n-3) pool.push({q:'La zona baja asoma. ¿Le preocupa el descenso?',o:O(['Estamos centrados en sumar, no en la clasificación.','calma'],['Con este grupo nos vamos a salvar, no tengo dudas.','confianza'],['Si hace falta, cambiaré cosas. Aquí hay que reaccionar ya.','exigencia'])});
  if(inj>=3) pool.push({q:`Tiene ${inj} jugadores lesionados. ¿Le falta plantilla?`,o:O(['Es parte del fútbol; confío en quienes están disponibles.','calma'],['La plantilla es corta, sí, pero el que entra responde.','confianza'],['Hay lesiones que se podrían evitar con otro calendario y otros árbitros.','polemica'])});
  if(conf<45) pool.push({q:'Se habla de tensión con la directiva. ¿Es cierto?',o:O(['Hablamos a diario y el diálogo es bueno.','calma'],['Tengo todo el respaldo que necesito para trabajar.','confianza'],['No voy a comentar rumores de despacho.','polemica'])});
  if(fm<40) pool.push({q:'La grada está dividida. ¿Entiende los pitos?',o:O(['La afición tiene derecho a opinar; nos obliga a mejorar.','calma'],['Estoy seguro de que volveremos a ilusionarlos.','confianza'],['Nos apoyan en las buenas y en las malas, eso es ser hincha.','exigencia'])});
  if(fm>75) pool.push({q:'El estadio vibra. ¿Cuánto pesa la grada?',o:O(['Muchísimo: el estadio es un jugador más.','calma'],['Con esta afición somos capaces de cualquier cosa.','confianza'],['Que no se acomoden: la grada también tiene que seguir apretando.','polemica'])});
  if(inWindow(W)) pool.push({q:'¿Habrá refuerzos antes de que cierre el mercado?',o:O(['El club trabaja en silencio; hablaremos cuando haya algo cerrado.','calma'],['Vendrán caras nuevas, y de nivel.','confianza'],['No me sirve cualquier fichaje: pido nivel o nada.','exigencia'])});
  pool.push({q:`Su próximo rival pregunta por usted. ¿Qué opina de ${op.name}?`,o:O(['Mucho respeto: es un rival muy trabajado.','calma'],['Los respetamos, pero vamos a ganarles.','confianza'],['Con el rival que sea; nosotros somos los que tenemos que mejorar.','exigencia'])});
  if((me.yth||[]).length) pool.push({q:'¿Veremos a algún chico de la cantera pronto en el primer equipo?',o:O(['Los mejores entrenarán con nosotros, paso a paso.','calma'],['Hay talento y no me da miedo darles minutos.','confianza'],['El que no esté a nivel, no sube; sea de casa o de fuera.','exigencia'])});
  const sel=[first].concat(shuffle(pool).slice(0,2));
  return {preguntas:sel.map(x=>({periodista:rp(PRESS_REP),pregunta:x.q,opciones:x.o.map(([texto,tono])=>({texto,tono}))}))};
}

GFX.init=function(){
  if(GFX.R||GFX.failed) return GFX.ok;

  try{
    const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});

/* ---------- controles orbitales (ratón, táctil y rueda) ---------- */

    else if(O.pts.size===2){ const [a,b]=[...O.pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(O.pd>0) O.r=clamp(O.r*O.pd/d,O.min,O.max); O.pd=d; }
    O.idle=0; });

  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ if(!O.on) return; e.preventDefault(); O.r=clamp(O.r*(1+Math.sign(e.deltaY)*.08),O.min,O.max); O.idle=0; O.auto=false; },{passive:false});
}

  const c=GFX.cam; c.position.set(O.tgt.x+O.r*Math.sin(O.ph)*Math.cos(O.th),O.tgt.y+O.r*Math.cos(O.ph),O.tgt.z+O.r*Math.sin(O.ph)*Math.sin(O.th)); c.lookAt(O.tgt); }

/* ---------- césped ---------- */
function pitchTexture(pattern){
  const hi=GFX.q==='hi', W_=hi?2048:1024, H_=Math.round(W_*78/115);
  return canvasTex(W_,H_,(g)=>{
    const s=W_/115, X=x=>(x+57.5)*s, Y=z=>(z+39)*s;
    g.fillStyle='#2f7a3b'; g.fillRect(0,0,W_,H_);
    const n=pattern===1?22:18;
    for(let i=0;i<n;i++){ g.fillStyle=i%2?'#2c7236':'#378a45'; g.fillRect(X(-52.5)+i*105*s/n,0,105*s/n+1,H_); }
    if(pattern===2){ for(let i=0;i<14;i++){ g.fillStyle='rgba(0,0,0,.05)'; g.fillRect(0,Y(-34)+i*68*s/14,W_,i%2?68*s/14:0); } }
    g.fillStyle='#2e7539'; g.fillRect(0,0,W_,Y(-34)-.5*s); g.fillRect(0,Y(34)+.5*s,W_,H_); g.fillRect(0,0,X(-52.5)-.5*s,H_); g.fillRect(X(52.5)+.5*s,0,W_,H_);
    for(let i=0;i<W_*H_/90;i++){ g.fillStyle=Math.random()<.5?'rgba(0,0,0,.045)':'rgba(255,255,255,.035)'; g.fillRect(Math.random()*W_,Math.random()*H_,2,1+Math.random()*3); }
    g.strokeStyle='rgba(250,250,245,.93)'; g.fillStyle='rgba(250,250,245,.93)'; g.lineWidth=Math.max(2,.12*s);

    const R=(x0,z0,x1,z1)=>g.strokeRect(X(Math.min(x0,x1)),Y(Math.min(z0,z1)),Math.abs(x1-x0)*s,Math.abs(z1-z0)*s);
    const arc=(x,z,r,a0,a1)=>{ g.beginPath(); g.arc(X(x),Y(z),r*s,a0,a1); g.stroke(); };
    const dot=(x,z,r)=>{ g.beginPath(); g.arc(X(x),Y(z),r*s,0,Math.PI*2); g.fill(); };
    R(-52.5,-34,52.5,34); L(0,-34,0,34); arc(0,0,9.15,0,Math.PI*2); dot(0,0,.25);

  });
}

function ringPath(a,b,r,step){

/* ---------- estadio completo ---------- */
function buildStadium(club,o){
  o=o||{}; const st=club.st, hi=GFX.q==='hi', night=o.night!==false;

      if(fl>0){ fl-=dt; hemi.intensity=base+(fl>.2||(fl>.05&&fl<.12)?2.4:0); } else hemi.intensity=base; }); }
  if(hi){ key.castShadow=true; key.shadow.mapSize.set(2048,2048); const sc=key.shadow.camera; sc.left=-62; sc.right=62; sc.top=45; sc.bottom=-45; sc.near=10; sc.far=400; key.shadow.bias=-.0008; }
  const fill=new THREE.DirectionalLight(night?0xdfe8ff:0xbfd4ff,night?.42:.25); fill.position.set(70,90,-50); S.add(fill);

  const ptex=pitchTexture(o.pattern??(club.id%3));

  const m=st.track?13:7.5, a=52.5+m, b=34+m;

    const tr=new THREE.Mesh(strip(ringPath(56,37.5,30,3),1,.02,m-1.2,.02,4,1),lmat(0xffffff,{map:tt})); S.add(tr); }

  const tiers=[]; let d0=0, h0=1;
  for(let i=0;i<t;i++){ const depth=(i===0?(t===1?13:16):i===1?13:11)*f; const slope=[.5,.62,.74][i]; const dIn=i?d0-1.6:0, hIn=i?h0+3.3:1; tiers.push({dIn,dOut:dIn+depth,hIn,hOut:hIn+depth*slope}); d0=dIn+depth; h0=hIn+depth*slope; }

/* ---------- bucle por fotograma ---------- */
function mxFrame(dt,now){
  if(!MX.on) return;
  let k=0;
  if(MX.state==='play'){ if(!MX.paused&&MX.panel!=='tac'){ k=dt*MX.speed*MX.slow; tickClip(k); } }
  else if(MX.state==='replay'){ k=dt*.5; replayTick(k); }
  else { k=dt; MX.introT+=dt; tickActs(k,true); }
  // ambiente
  const b=MX.ball, base=.14+.4*clamp((Math.abs(b.x)-22)/30,0,1)+(fansOf(MX.H).mood-55)/450;
  MX.exT=Math.max(base,MX.exT-dt*.22); MX.ex+=(MX.exT-MX.ex)*Math.min(1,dt*2.2);
  MX.auT-=dt; if(MX.auT<=0){ MX.auT=.25; auCrowd(MX.ex); }
  crowdTick(dt);
  if(R3.on&&MX.cam!=='2d'){ r3Sync(k,dt,now); camUpdate(dt); } else if(R2.on) r2Draw();
  hudTick(dt);
}
function tickClip(k){
  MX.ct+=k;
  for(let g=0;g<60;g++){ let fired=false; for(let i=0;i<MX.sch.length;i++){ const s=MX.sch[i]; if(s.at<=MX.ct){ MX.sch.splice(i,1); i--; try{ s.fn(); }catch(err){ console.error(err); } fired=true; } } if(!fired) break; }
  tickBall(k); tickActs(k,false); recFrame();
  // juego continuo: en pases y regates buenos la siguiente acción arranca sin esperar el final del clip
  if(MX.state==='play'&&MX.ovl>0&&!MX.sch.length&&MX.ct>=MX.cEnd-MX.ovl&&!MX.afterGoal&&!MX.pend){ MX.ovl=0; mxNext(); return; }
  if(MX.ct>=MX.cEnd&&!MX.sch.length&&MX.state==='play'){
    if(MX.afterGoal){ const e=MX.afterGoal; MX.afterGoal=null; MX.slow=1; startReplay(e); }
    else if(MX.pend){ const p=MX.pend; MX.pend=null; if(p==='ht') toHT(); else toFT(); }
    else mxNext();
  }
}
function tickBall(k){
  const b=MX.ball, px=b.x, pz=b.z;
  if(b.fly){ const f=b.fly, du=Math.max(.001,f.t1-f.t0), u=clamp((MX.ct-f.t0)/du,0,1), e=f.g?1-Math.pow(1-u,1.7):u;
    b.x=lerp(f.x0,f.x1,e); b.z=lerp(f.z0,f.z1,e); b.y=lerp(f.y0,f.y1,u)+f.h*4*u*(1-u);
    if(f.c){ const dx=f.x1-f.x0, dz=f.z1-f.z0, L=Math.hypot(dx,dz)||1, off=f.c*Math.sin(Math.PI*e); b.x+=-dz/L*off; b.z+=dx/L*off; } // efecto: la trayectoria se curva
    if(u>=1){ b.fly=null; const dx=(f.x1-f.x0)/du, dz=(f.z1-f.z0)/du; b.free=true; b.vx=dx*(f.h>1.5?.22:.26); b.vz=dz*(f.h>1.5?.22:.26); b.vy=f.y1<=BY+.01&&f.h>1.5?Math.min(3.6,f.h*.85):0; } }
  else if(b.hold&&b.hold.vis){ const a=b.hold; b.x=a.x+Math.sin(a.yaw)*.32; b.z=a.z+Math.cos(a.yaw)*.32; b.y=1.08; }
  else if(b.own&&b.own.vis){ const a=b.own, tx=a.x+Math.sin(a.yaw)*.6, tz=a.z+Math.cos(a.yaw)*.6, q=Math.min(1,k*14); b.x+=(tx-b.x)*q; b.z+=(tz-b.z)*q; b.y=BY+Math.abs(Math.sin(MX.ct*8.5))*.05*Math.min(1,a.spd/4); }

}
function tickActs(k,idle){

function recFrame(){

  R.push({t:MX.ct,b:[MX.ball.x,MX.ball.y,MX.ball.z,MX.ball.spin],a:MX.list.map(a=>[a,a.x,a.z,a.yaw,a.spd,a.anim,a.at,a.vis]),r:[MX.ref.x,MX.ref.z,MX.ref.yaw,MX.ref.spd]});

function startReplay(e){

  const t1=Math.min(R[R.length-1].t,MX.goalAt+1.1), t0=Math.max(R[0].t,MX.lastKickAt-3.2);
  MX.replay={t:t0,t0,t1,e,s:MX.list.map(a=>[a,a.x,a.z,a.yaw,a.spd,a.anim,a.at,a.vis]),T:e.T};

  const R=MX.rec; let i=0; while(i<R.length-2&&R[i+1].t<P.t) i++;
  const f0=R[i], f1=R[i+1]||f0, u=clamp((P.t-f0.t)/Math.max(1e-3,f1.t-f0.t),0,1);
  const m1=new Map(f1.a.map(x=>[x[0],x]));
  for(const x of f0.a){ const a=x[0], y=m1.get(a)||x; a.x=lerp(x[1],y[1],u); a.z=lerp(x[2],y[2],u); a.yaw=angLerp(x[3],y[3],u); a.spd=lerp(x[4],y[4],u); a.anim=x[5]; a.at=lerp(x[6],y[5]===x[5]?y[6]:x[6],u); a.vis=x[7]; }

function r2Draw(){
  const host=$('#glhost'); if(!host||!R2.g) return; const w=host.clientWidth||1, h=host.clientHeight||1, dpr=Math.min(2,window.devicePixelRatio||1);
  if(w!==R2.w||h!==R2.h){ R2.w=w; R2.h=h; R2.dpr=dpr; R2.cv.width=Math.round(w*dpr); R2.cv.height=Math.round(h*dpr); R2.cv.style.width=w+'px'; R2.cv.style.height=h+'px'; }
  const g=R2.g; g.setTransform(dpr,0,0,dpr,0,0);
  const port=h>w*1.05, short=!port&&h<520, L=port?h:w, Sd=port?w:h, s=Math.min((L-24)/114,(Sd-(port?24:short?58:130))/76);
  const P=(x,z)=>port?[w/2-z*s,h/2-x*s+10]:[w/2+x*s,h/2-z*s+(short?4:22)];
  g.fillStyle='#0d1f15'; g.fillRect(0,0,w,h);
  // césped a franjas
  for(let i=0;i<14;i++){ const x0=-52.5+i*7.5; const a=P(x0,34), b=P(x0+7.5,-34); g.fillStyle=i%2?'#2c7a3f':'#338a47'; g.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); }
  g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=Math.max(1.2,s*.12);
  const rect=(x0,z0,x1,z1)=>{ const a=P(x0,z0), b=P(x1,z1); g.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); };
  rect(-52.5,-34,52.5,34); rect(-52.5,-20.16,-36,20.16); rect(52.5,-20.16,36,20.16); rect(-52.5,-9.16,-47,9.16); rect(52.5,-9.16,47,9.16);
  const m0=P(0,-34), m1=P(0,34); g.beginPath(); g.moveTo(m0[0],m0[1]); g.lineTo(m1[0],m1[1]); g.stroke();
  const c0=P(0,0); g.beginPath(); g.arc(c0[0],c0[1],9.15*s,0,Math.PI*2); g.stroke();
  g.fillStyle='rgba(255,255,255,.9)'; for(const gx of [-52.5,52.5]){ const a=P(gx,-3.66), b=P(gx+Math.sign(gx)*1.8,3.66); g.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0])||2,Math.abs(b[1]-a[1])||2); }
  // jugadores
  const r=Math.max(7.5,s*1.2);
  g.font=`700 ${Math.max(8,r*1.05)}px Barlow Condensed, sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  const b=MX.ball, carrier=b.own||b.hold;
  for(const a of MX.list){ if(!a.vis) continue; const [x,y]=P(a.x,a.z); const col=a.gk?(a.side?'#e84d9a':'#c6f33a'):MX.kc[a.side];
    g.beginPath(); g.arc(x+1.5,y+2,r,0,Math.PI*2); g.fillStyle='rgba(0,0,0,.3)'; g.fill();
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=col; g.fill(); g.lineWidth=a===carrier?3:1.5; g.strokeStyle=a===carrier?'#f2b23a':'rgba(0,0,0,.45)'; g.stroke();
    if(a.anim&&(a.anim.k==='fall'||a.anim.k==='slide')){ g.strokeStyle='#fff'; g.lineWidth=1.2; g.beginPath(); g.moveTo(x-r,y+r); g.lineTo(x+r,y-r); g.stroke(); }
    g.fillStyle=lum(col)>.55?'#111':'#fff'; g.fillText(String(a.p.no||''),x,y+.5);
    if(a===carrier&&r>6){ g.fillStyle='rgba(8,14,11,.8)'; const nm=sname(a.p), tw_=g.measureText(nm).width+10; g.fillRect(x-tw_/2,y-r-19,tw_,15); g.fillStyle='#fff'; g.fillText(nm,x,y-r-11); } }
  const rf_=P(MX.ref.x,MX.ref.z); g.beginPath(); g.arc(rf_[0],rf_[1],r*.7,0,Math.PI*2); g.fillStyle='#16181b'; g.fill();
  const [bx,by]=P(b.x,b.z), hh=(b.y-BY)*s*.35; g.beginPath(); g.arc(bx+hh*.6,by+hh*.6,Math.max(2.5,s*.3),0,Math.PI*2); g.fillStyle='rgba(0,0,0,.35)'; g.fill();
  g.beginPath(); g.arc(bx,by-hh,Math.max(3,s*.34)*(1+hh*.02),0,Math.PI*2); g.fillStyle='#fff'; g.fill(); g.strokeStyle='#222'; g.lineWidth=1; g.stroke();
}

function mmVis(){ const m=$('#mxmm'); if(m) m.style.display=(R3.on&&MX.cam!=='2d'&&(MX.state==='play'||MX.state==='replay'))?'':'none'; const b=$('#mxbtns'); if(b) b.style.visibility=MX.state==='intro'?'hidden':''; }

function hudTick(dt){
  MX.rt+=dt; if(MX.state!==MX.stSeen){ MX.stSeen=MX.state; mmVis(); }
  let ck;

  else if(MX.cur&&MX.cur.e.k==='ht') ck=fmtClock(MX.clk[0],1);
  else { const u=MX.cEnd>MX.c0?clamp((MX.ct-MX.c0)/(MX.cEnd-MX.c0),0,1):1; ck=fmtClock(lerp(MX.clk[0],MX.clk[1],u),MX.half); }
  MX.shown=ck;

  const sc=MX.sc[0]+' - '+MX.sc[1]; if(sc!==MX.scTxt){ MX.scTxt=sc; const e=$('#mxsc'); if(e) e.textContent=sc; }

function feedPush(e){
  const nm=id=>id!=null&&W.players[id]?sname(W.players[id]):'';

    const pre=e.pen?`${nm(e.a)} frente a ${nm(e.k2)||'el portero'} desde los once metros`:e.fk?`${nm(e.a)} se perfila para el tiro libre`:e.head?`Balón aéreo para ${nm(e.a)}`:`${nm(e.a)} arma el disparo`;

function mxCmd(v){
  if(!MX.on||!v) return;
  const M=MX.M, S=M.s[MX.us];
  if(isJug(W)&&(/^(tac_|talk_|plan_|shout_|so_|si_)/.test(v)||v==='dosub'||v==='tac')) return;
  if(v.startsWith('sp')){ MX.speed=+v.slice(2)||1; W.settings.speed=MX.speed; hudBtns(); return; }
  if(v.startsWith('talk_')){ doTalk(v.slice(5)); return; }
  if(v.startsWith('tac_')){ const [,k,n]=v.split('_'); S.tac[k]=+n; try{ teamQ(S); }catch(e){} mxRefresh(); return; }
  if(v.startsWith('plan_')){ const pl=(S.c.plans||[])[+v.slice(5)]; if(pl){ matchPlan(M,MX.us,pl); notice(`Plan ${'ABC'[+v.slice(5)]}: ${esc(pl.f)}`,2); } mxRefresh(); return; }
  if(v.startsWith('shout_')){ doShout(v.slice(6)); mxRefresh(); return; }
  if(v.startsWith('so_')||v.startsWith('si_')){ const id=+v.slice(3), key=v[1]==='o'?'o':'i'; MX.subSel[key]=MX.subSel[key]===id?null:id; mxRefresh(); return; }
  switch(v){
    case 'pause': MX.paused=!MX.paused; hudBtns(); break;
    case 'cam': {
      const list=CAMS.map(c=>c[0]).filter(k=>R3.on||k==='2d'); let i=(list.indexOf(MX.cam)+1)%list.length; const nx=list[i], was=MX.cam;
      MX.cam=nx; if(isJug(W)) W.settings.jcam=nx; else W.settings.cam=nx; MX.camCut=true;
      if(nx==='2d'&&was!=='2d'){ GFX.scene=null; r2Show(); }
      else if(nx!=='2d'&&was==='2d'){ r2Hide(); GFX.scene=R3.S; }
      mmVis(); hudBtns(); notice('Cámara: '+(CAMS.find(c=>c[0]===nx)||[0,''])[1],1.2); break; }
    case 'mode': MX.mode=MX.mode==='hl'?'full':'hl'; W.settings.mode=MX.mode; hudBtns(); notice(MX.mode==='hl'?'Solo jugadas clave':'Partido completo',1.4); break;
    case 'snd': SND.on=SND.on?0:1; W.settings.audio=SND.on; sndSave(); sndApply(); hudBtns(); break;
    case 'voz': SND.voice=SND.voice?0:1; sndSave(); if(!SND.voice) narStop(); hudBtns(); break;
    case 'more': MX.more=!MX.more; hudBtns(); break;
    case 'stats': MX.panel=MX.panel==='stats'?null:'stats'; MX.pT=MX.rt; renderPanel(); hudBtns(); break;
    case 'tac': MX.panel=MX.panel==='tac'?null:'tac'; MX.subSel={o:null,i:null}; renderPanel(); hudBtns(); break;
    case 'close': MX.panel=null; renderPanel(); hudBtns(); break;
    case 'dosub': {
      const outM=S.pl.find(m=>m.id===MX.subSel.o&&m.on), inM=S.bench.find(m=>m.id===MX.subSel.i);
      if(!outM||!inM||S.subsLeft<=0) return;
      const r=doSub(M,MX.us,outM,inM); MX.subSel={o:null,i:null};
      if(r){ visSub(r,MX.state==='play'); if(MX.state!=='play') toast(`Entra ${sname(inM.p)} por ${sname(outM.p)}`,'good'); }
      mxRefresh(); break; }
    case 'skip': mxSkip(); break;
    case 'reps': if(MX.replay) endReplay(); break;
    case 'lineups': if(MX.state==='intro') showIntro(); break;
    case 'kick': if(MX.state!=='intro') return; $('#mxover').innerHTML=''; MX.state='play'; MX.camCut=true; mxNext(); crowdKO();
      if(!W.tips) W.tips={}; if(!W.tips.m1){ W.tips.m1=1; setTimeout(()=>{ if(MX.on&&MX.state==='play') notice('<span style="white-space:normal"><b>Táctica</b> pausa el juego para hacer cambios. <b>Cámara</b> cambia la vista.</span>',6); },2400); }
      break;
    case 'h2': if(MX.state!=='ht') return; $('#mxover').innerHTML=''; MX.state='play'; MX.camCut=true; mxNext(); break;
    case 'fin': mxFinish(); break;
    case 'back': { if(MX.state!=='intro') return; const f=MX.f; mxAbandon(); if(isJug(W)) jugPreMatch(f); else preMatch(f); break; }
  }
}

/* ambiente del partido */
function auInit(){
  const c=auCtx(); if(!c) return; clearTimeout(AU.idleT);
  try{
    if(c.state!=='running'){ const p=c.resume(); if(p&&p.catch) p.catch(()=>{}); }
    auStopCrowd();
    const s=c.createBufferSource(); s.buffer=AU.noise; s.loop=true;
    const f1=c.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=520; const g1=c.createGain(); g1.gain.value=0;
    const f2=c.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=900; f2.Q.value=.7; const g2=c.createGain(); g2.gain.value=0;
    s.connect(f1); f1.connect(g1); g1.connect(AU.crowd); s.connect(f2); f2.connect(g2); g2.connect(AU.crowd); s.start();
    Object.assign(AU,{src:s,f1,g1,f2,g2,on:true});
    AU.master.gain.setTargetAtTime(auLevel(),c.currentTime,.05);

function auStopCrowd(){ try{ if(AU.src) AU.src.stop(); }catch(e){} AU.src=null; }

function mNoise(t,o,type,f,q,peak,dec){ const c=AU.ctx, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain(); s.buffer=AU.white; fl.type=type; fl.frequency.value=f; fl.Q.value=q; g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(.001,t+dec); s.connect(fl); fl.connect(g); g.connect(o); s.start(t,Math.random()*1.5); s.stop(t+dec+.02); }
function mBass(t,o,m,d){ const c=AU.ctx, x=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); x.type='sawtooth'; x.frequency.value=mtf(m); f.type='lowpass'; f.Q.value=3; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(260,t+d*.9);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.26,t+.01); g.gain.setTargetAtTime(0,t+d*.8,.03); x.connect(f); f.connect(g); g.connect(o); x.start(t); x.stop(t+d+.2); }
function mStab(t,o,notes,d,lvl){ const c=AU.ctx, f=c.createBiquadFilter(), g=c.createGain(); f.type='lowpass'; f.Q.value=2; f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(2600,t+.06); f.frequency.exponentialRampToValueAtTime(900,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+.02); g.gain.setTargetAtTime(0,t+d,.06); f.connect(g); g.connect(o);
  for(const m of notes) for(const dt of [-8,8]){ const x=c.createOscillator(); x.type='sawtooth'; x.frequency.value=mtf(m); x.detune.value=dt; x.connect(f); x.start(t); x.stop(t+d+.4); } }
function mLead(t,o,m,d){ const c=AU.ctx, x=c.createOscillator(), x2=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain(), hz=mtf(m);
  x.type='square'; x2.type='sawtooth'; x.frequency.value=hz; x2.frequency.value=hz; x2.detune.value=7; l.frequency.value=5.5;
  lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(hz*.012,t+Math.min(d,.35)); l.connect(lg); lg.connect(x.frequency); lg.connect(x2.frequency);
  f.type='lowpass'; f.frequency.value=2400; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.085,t+.02); g.gain.setTargetAtTime(.06,t+.05,.1); g.gain.setTargetAtTime(0,t+Math.max(.03,d-.02),.04);
  x.connect(f); x2.connect(f); f.connect(g); g.connect(o); for(const n of [x,x2,l]){ n.start(t); n.stop(t+d+.25); } }
function mPluck(t,o,m){ const c=AU.ctx, x=c.createOscillator(), g=c.createGain(); x.type='triangle'; x.frequency.value=mtf(m); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.001,t+.22); x.connect(g); g.connect(o); x.start(t); x.stop(t+.25); }
function musStep(s,t){
  const o=MUS.bus; if(!o) return;
  const bar=(s>>4)&15, st=s&15, [root,ch]=MB[bar], sec=bar<8?0:bar<12?1:2, d=MUS_SPB;
  if(st===0||st===8||(st===10&&bar%2)||(bar===15&&(st===12||st===14))) mKick(t,o);
  if(st===4||st===12){ mNoise(t,o,'bandpass',1900,.8,sec?.22:.16,.16); if(sec&&AU.clap) clapAt(t,.3,o); }
  if(st%2===0) mNoise(t,o,'highpass',7500,.7,st%4===2?.07:.04,(st===14&&bar%4===3)?.2:.045);
  if(st%2===0) mBass(t,o,root+[0,0,12,0,7,0,12,7][st>>1],d*1.7);
  if(st===0) mStab(t,o,ch,d*(sec?12:5),sec?.045:.07);
  if(!sec&&(st===7||st===10)) mStab(t,o,ch,d*(st===7?2:4),.055);
  if(!sec&&bar>=4&&st%2===1) mPluck(t,o,ch[[0,1,2,1][(st>>1)&3]]+12);
  const ml=MEL[bar]; if(ml) for(const [s0,m,l] of ml) if(s0===st) mLead(t,o,m,l*d);
}

function contGame(){ return advance('next'); }
// avanza el calendario: un día, hasta el próximo evento o hasta una fecha. Muestra el mundo en marcha.
async function advance(mode,target){
  if(UI.busy||APP.mode!=='game'||UI.editorOnly) return;
  if(W.stop){ seasonModal(); return; }
  const jug=isJug(W); if(jug&&W.pc.done) return;
  const f=jug?jugFixture(W):userFixture(W); if(f){ if(jug) jugPreMatch(f); else preMatch(f); return; }
  if(mode==='to'&&(target==null||target<=W.day)) return;
  UI.busy=true; UI.stopSim=false; closeModal(); SIM.start(); renderTop();
  if(UI.view==='story'){ UI.view=UI.stBack&&UI.stBack!=='story'?UI.stBack:'home'; UI.st=null; UI.stS=[]; }
  const startId=W.msgId, startNews=W.newsId||0, key=(W.settings.stopOn||'all')==='key', seen=new Set(pendingActs().map(m=>m.id));
  const sp=W.settings.sim||'normal', delay=sp==='fast'?0:sp==='slow'?380:120;
  let n=0, stop='', why=null;
  try{
    while(n<420){
      dayW(W); n++; SIM.day();
      if(W.stop){ stop='season'; break; }
      if(jug?jugFixture(W):userFixture(W)){ stop='match'; break; }
      if(!jug){ const al=alertHit(startId); if(al){ stop='alert'; why=al; break; } }
      const nw=pendingActs().filter(m=>!seen.has(m.id)&&(!key||['offer','job','renew','poff','pren'].includes(m.act.t)));
      if(nw.length){ stop='act'; why=nw[0]; break; }
      if(!key){ const ns=newsStop(W,startNews); if(ns){ stop='news'; why=ns; break; } }
      if(mode==='day') break;
      if(mode==='to'&&W.day>=target){ stop='date'; break; }
      if(UI.stopSim){ stop='user'; break; }
      if(APP.mode!=='game') break;
      if(delay){ renderTop(); if(['home','cal','world','inbox'].includes(UI.view)) renderMain(); await new Promise(r=>setTimeout(r,delay)); }
      else if(n%4===0){ renderTop(); await new Promise(r=>setTimeout(r,0)); }
    }
  }catch(e){ console.error(e); toast('Error al avanzar: '+(e&&e.message||e),'bad'); }
  UI.busy=false; SIM.stop(); autosave(); if(APP.mode!=='game') return; render();
  if(stop==='season') seasonModal();
  else if(stop==='alert'&&why){ toast('Alerta: '+why.subj,'bad'); if(why.id!=null) openMsg(why.id); }
  else if(stop==='act'&&why){ toast(actLabel(why.act)+': '+why.subj,'good'); openMsg(why.id); }
  else if(stop==='news'&&why){ toast('Noticia: '+why.title,''); openStory('n',why.id); }
  else if(stop==='match'){ const g=jug?jugFixture(W):userFixture(W); if(g){ if(jug) jugPreMatch(g); else preMatch(g); } }
  else if(mode==='day') toast(fDate(W,W.day,1));
  boardCheck();
}

const CLOUD_N=200000;
// la nube alterna dos ranuras (a y b): la copia anterior sigue intacta hasta que la nueva está completa y comprobada
const cloudChunk=(m,i)=>m.slot?'dt26'+m.slot+i:'dt26c'+i;
async function cloudMeta(name){ try{ const sn=await CAP.db.doc('data/users/'+CAP.uid+'/'+name).get(); return sn.exists?sn.data():null; }catch(e){ return null; } }
async function cloudFetch(m){ const base='data/users/'+CAP.uid+'/'; let s='';
  for(let i=0;i<m.n;i++){ const sn=await CAP.db.doc(base+cloudChunk(m,i)).get(); if(!sn.exists) throw new Error('falta un fragmento'); s+=sn.data().s; }
  if(s.length!==m.len) throw new Error('partida incompleta'); if(m.h&&strHash(s)!==m.h) throw new Error('la copia no coincide con lo que se subió'); return s; }
async function cloudSave(){
  if(!CAP.db||!CAP.uid){ toast('La nube no está disponible aquí','bad'); return; }
  const chk=validateWorld(W); if(!chk.ok){ toast('La partida tiene datos dañados; no se sube para no estropear la copia de la nube','bad'); return; }
  toast('Subiendo tu partida…');
  try{
    const s=await packWorld(W), n=Math.ceil(s.length/CLOUD_N), base='data/users/'+CAP.uid+'/', old=await cloudMeta('dt26save'), slot=old&&old.slot==='a'?'b':'a';
    for(let i=0;i<n;i++) await CAP.db.doc(base+'dt26'+slot+i).set({s:s.slice(i*CLOUD_N,(i+1)*CLOUD_N)});
    const c=W.clubs[W.userClub], meta={n,len:s.length,h:strHash(s),slot,t:Date.now(),club:c.name,season:seasonLabel(W),date:fDate(W,W.day,1),v:VERSION};
    if(await cloudFetch(meta)!==s) throw new Error('la copia subida no coincide');
    if(old) await CAP.db.doc(base+'dt26prev').set(old);
    await CAP.db.doc(base+'dt26save').set(meta);
    toast('Partida guardada en la nube','good');
  }catch(e){ console.warn(e); toast('No se pudo guardar en la nube. La copia anterior sigue intacta','bad'); }
}
async function cloudLoad(){
  if(!CAP.db||!CAP.uid){ toast('La nube no está disponible aquí','bad'); return; }
  try{
    const snap=await CAP.db.doc('data/users/'+CAP.uid+'/dt26save').get();
    if(!snap.exists){ toast('No tienes partidas en la nube todavía'); return; }
    const m=snap.data(); APP.cloudMeta=m; APP.cloudPrev=await cloudMeta('dt26prev');
    modal(`<header><h3>Cargar de la nube</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></header>
    <p style="margin-top:0">Partida con <b>${esc(m.club)}</b>, temporada ${esc(m.season)}, ${esc(m.date)}. Guardada el ${new Date(m.t).toLocaleString('es-MX')}.</p>
    ${APP.game?'<p class="muted">Sustituirá la partida de este dispositivo.</p>':''}<div class="row"><button class="btn pri" data-a="cloudgo">Cargar</button><button class="btn" data-a="close">Cancelar</button></div>`);
  }catch(e){ console.warn(e); toast('No se pudo leer la nube','bad'); }
}
async function cloudLoadGo(){
  const m=APP.cloudMeta; if(!m||!CAP.db) return; closeModal(); toast('Descargando partida…');
  let w=null, err=null;
  for(const [mm,prev] of [[m,0],[APP.cloudPrev,1]]){ if(!mm) continue;
    try{ const r=await tryWorld(await cloudFetch(mm)); if(!r.w) throw new Error(r.why); w=r.w; if(prev) toast('La última copia de la nube estaba incompleta: se cargó la anterior','bad'); break; }catch(e){ console.warn(e); err=err||e; } }
  if(!w){ toast('No se pudo cargar: '+(err&&err.message||err),'bad'); return; }
  try{ await adoptWorld(w,'Antes de cargar desde la nube'); toast('Partida cargada desde la nube','good'); }catch(e){ toast('No se pudo cargar: '+(e&&e.message||e),'bad'); }
}
async function adoptWorld(w,why){
  if(!w||!Array.isArray(w.clubs)||!Array.isArray(w.players)||!Array.isArray(w.leagues)) throw new Error('el archivo no es una partida de DT26');
  const chk=validateWorld(w); if(!chk.ok) throw new Error('la partida está dañada ('+chk.fatal[0]+')');
  if((w.v||0)>VERSION) throw new Error('la guardó una versión más nueva del juego');
  if(w.userClub>=0){ await tabTakeover(); await bakCurrent('replace',why||'Antes de importar otra partida'); }
  migrateWorld(w); fixWorld(w); W=w; rnd=RNG(newSeed());
  if(w.userClub>=0){ APP.game=w; enterGame(); await saveNow(); if(W.stop) seasonModal(); }
  else { APP.base=w; menuEditor(); }
}

function wxAt(w,nat,day){
  const C=CLIM[nat]||CLIM.ESP, d=dOf(w,day), mo=d.getUTCMonth(), sd=(w.seed|0)+w.season*31, ni=Object.keys(CLIM).indexOf(nat)+1;
  const u1=hf(sd,day,ni,1), u2=hf(sd,day,ni,2), u3=hf(sd,day,ni,3);
  const t=Math.round(C.t[mo]+(hf(sd,day,ni,4)-.5)*7+(hf(sd,day-1,ni,4)-.5)*3);
  let k='sol';
  if(u1<C.r[mo]){ k=u2<.15?'tor':'llu'; if(t<=1&&(C.snow||u3<.3)) k='nie'; }
  else if(u2<.3) k='nub';
  else if(u3<.07&&(mo>=9||mo<=2)&&nat!=='BRA') k='nbl';
  else if(u3>.9&&C.wind) k='vie';
  return {k,t};
}

function awardTrophy(w,cid,name,k){
  const c=w.clubs[cid]; if(!c) return;
  c.troph.push({s:w.season,n:name,k}); fanMood(w,c,k==='lg'||k==='cc'||k==='ic'?12:8);
  for(const id of c.pids){ const p=w.players[id]; if(!p) continue; (p.tro||(p.tro=[])).push({s:w.season,n:name,k,c:cid}); if(p.tro.length>30) p.tro.shift(); }
  if(cid===w.userClub){ w.mgr.troph.push({s:w.season,n:name,k,c:cid}); const st=curStint(w); if(st) st.t.push(name);
    w.mgr.rep=clamp((w.mgr.rep||45)+(k==='lg'||k==='cc'?5:k==='ic'?4:3),1,99);
    unlock(w,'t1'); if(k==='sup') unlock(w,'sup'); if(k==='lg') unlock(w,'lg'); if(k==='cup') unlock(w,'cup'); if(k==='cc') unlock(w,'cc'); if(k==='ic') unlock(w,'ic');
    soc(w,`¡CAMPEONES! ${name} ${seasonLabel(w)}. ¡Qué noche para ${c.city}!`,'good'); }
  else if(c.mg>=0&&w.mgrs&&w.mgrs[c.mg]){ const m=w.mgrs[c.mg]; m.troph.push({s:w.season,n:name,c:cid}); m.rep=clamp(m.rep+3,1,99); }
}

function vitrina(list){
  const g={}; for(const t of list){ const k=t.n; (g[k]||(g[k]={n:t.n,k:t.k||'lg',s:[]})).s.push(t.s); }
  const arr=Object.values(g).sort((a,b)=>(KORD[a.k]??5)-(KORD[b.k]??5)||b.s.length-a.s.length);
  if(!arr.length) return '<p class="muted">Sin títulos todavía.</p>';
  return `<div class="vit">${arr.map(x=>`<div class="tro" title="${x.s.map(seasonOf).join(', ')}">${trophySVG(x.k,x.n)}<b>${esc(x.n)}</b>${x.s.length>1?`<span class="x2">×${x.s.length}</span>`:''}<small>${x.s.slice(-3).reverse().map(seasonOf).join(', ')}${x.s.length>3?'…':''}</small></div>`).join('')}</div>`;
}

const CCR=['Fase de grupos','Cuartos de final','Semifinales','Final'];
const supName=L=>'Supercopa '+L.name.replace(/^(Liga|Lega|Ligue|Série) /,'');
function ccOrder(w,L){ return (L.last&&L.last.length)?L.last.filter(id=>L.clubs.includes(id)):L.clubs.slice().sort((a,b)=>w.clubs[b].rep-w.clubs[a].rep); }
function ccTeams(w,D,used){
  const ords=D.q.map(([nat,sk,tk])=>{ const L=w.leagues.find(l=>l.nat===nat&&!l.tier); return L?{o:ccOrder(w,L),sk,tk}:null; }).filter(Boolean), t=[];
  for(const x of ords) for(const id of x.o.slice(x.sk,x.sk+x.tk)) if(!used.has(id)&&!t.includes(id)) t.push(id);
  for(let k=0;t.length<16&&k<14;k++) for(const x of ords){ if(t.length>=16) break; const id=x.o.slice(x.sk+x.tk).find(id=>!used.has(id)&&!t.includes(id)); if(id!=null) t.push(id); }
  return t.length>=16?t.slice(0,16):null; }
function ccSetup(w){
  w.cc=[]; const used=new Set(), me=w.userClub;
  CCD.forEach((D,i)=>{
    if(D.single||D.sup) return; const wd=D.wd||2;
    const gd=[dayOn(w,8,16,wd),dayOn(w,8,30,wd),dayOn(w,9,21,wd),dayOn(w,10,4,wd),dayOn(w,10,25,wd),dayOn(w,11,9,wd)];
    const ko=[dayOn(w,1,24,wd),dayOn(w,3,7,wd),D.fin?dayOn(w,D.fin[0],D.fin[1],D.fin[2]):dayOn(w,4,26,3)];
    const teams=ccTeams(w,D,used); if(!teams) return; teams.forEach(id=>used.add(id));
    const pots=teams.slice().sort((a,b)=>w.clubs[b].rep-w.clubs[a].rep);
    let best=null,bc=1e9;
    for(let tr=0;tr<80;tr++){ const gs=[[],[],[],[]]; for(let p=0;p<4;p++){ const pot=shuffle(pots.slice(p*4,p*4+4)); pot.forEach((id,g)=>gs[g].push(id)); }
      const conf=gs.reduce((s,g)=>s+g.length-new Set(g.map(id=>w.clubs[id].lg)).size,0); if(conf<bc){ bc=conf; best=gs; } if(!conf) break; }
    w.cc[i]={i,name:D.name,teams,groups:best,stage:0,days:[gd,ko[0],ko[1],ko[2]],champ:-1};
    best.forEach((g,gi)=>{ const rr=roundRobin(g); const all=rr.concat(rr.map(r=>r.map(([h,a])=>[a,h])));
      all.forEach((rd,k)=>rd.forEach(([h,a])=>w.fx.push({id:w.fx.length,lg:-1,cc:i,st:0,g:gi,rd:k,day:gd[k],h,a,r:null,hr:i===0?21:rp([19,21])}))); });
  });
  CCD.forEach((D,i)=>{ if(D.single) w.cc[i]={i,name:D.name,teams:[],stage:0,days:[dayOn(w,D.day[0],D.day[1],D.day[2])],champ:-1}; else if(D.sup) w.cc[i]={i,name:D.name,teams:[],stage:0,days:[],champ:-1,sup:1}; });
  supSetup(w);
  if(me>=0) w.cc.forEach((C,i)=>{ if(C&&C.groups&&C.teams.includes(me)){ const g=C.groups.findIndex(x=>x.includes(me));
    mail(w,'Prensa',`Sorteo de la ${C.name}`,`${w.clubs[me].name} jugará en el grupo ${'ABCD'[g]} de la ${C.name} junto a ${C.groups[g].filter(x=>x!==me).map(x=>w.clubs[x].name).join(', ')}.\n\nPrimera jornada: ${fDate(w,C.days[0][0],1)}. Los dos primeros de cada grupo pasan a cuartos, a partido único.`,'good'); } });
}
// supercopas nacionales: campeón de liga contra campeón de copa de la temporada anterior
function supSetup(w){
  const C=w.cc[8]; if(!C) return; const day=dayOn(w,7,5,3), me=w.userClub;
  w.leagues.forEach(L=>{ if(L.tier||!L.sup) return; const [a,b]=L.sup; if(a==null||b==null||a===b||!w.clubs[a]||!w.clubs[b]) return;
    w.fx.push({id:w.fx.length,lg:-1,cc:8,sl:L.id,st:0,rd:0,day,h:a,a:b,r:null,hr:21,ko:1,neu:0}); C.teams.push(a,b);
    if(me===a||me===b) mail(w,'Prensa',`${supName(L)}`,`${w.clubs[me].name} abrirá la temporada en la ${supName(L)} contra ${w.clubs[me===a?b:a].name} el ${fDate(w,day,1)}. Es un título oficial y un buen termómetro para la liga.`,'good'); });
}
function supCheck(w){
  if(!w.cc||!w.cc[8]) return;
  for(const f of w.fx){ if(f.cc!==8||!f.r||f.sdone) continue; f.sdone=1; const L=w.leagues[f.sl], c=w.clubs[f.r.w]; if(!L||!c) continue;
    awardTrophy(w,c.id,supName(L),'sup'); w.ccHist.push({s:w.season,i:8,c:c.id,l:f.sl}); c.rep=clamp(c.rep+1,1,99); c.fin.bal+=roundMoney(1.2e6*L.lf); c.fin.inc+=roundMoney(1.2e6*L.lf);
    news(w,`${c.name} gana la ${supName(L)}`,`${c.name} se impone ${f.r.hg}-${f.r.ag}${f.r.pens?` (pen. ${f.r.pens[0]}-${f.r.pens[1]})`:''} y levanta el primer título de la temporada.`,'tit',L.id,{c:c.id}); }
}
function ccTable(w,i,g){
  const C=w.cc[i], T={}; C.groups[g].forEach(id=>T[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  for(const f of w.fx){ if(f.cc!==i||f.st!==0||f.g!==g||!f.r) continue; const h=T[f.h],a=T[f.a]; if(!h||!a) continue; const hg=f.r.hg,ag=f.r.ag;
    h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg; if(hg>ag){h.w++;a.l++;h.pts+=3;} else if(hg<ag){a.w++;h.l++;a.pts+=3;} else {h.d++;a.d++;h.pts++;a.pts++;} }
  return Object.values(T).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||w.clubs[y.id].rep-w.clubs[x.id].rep);
}
function ccAdvance(w){
  if(!w.cc) return;
  supCheck(w);
  for(let i=0;i<w.cc.length;i++){ const C=w.cc[i]; if(!C||C.champ>=0||CCD[i].sup) continue;
    const fx=w.fx.filter(f=>f.cc===i&&f.st===C.stage);
    if(!fx.length||fx.some(f=>!f.r)) continue;
    if(CCD[i].single||C.stage===3){ C.champ=fx[0].r.w; ccChampion(w,i,C.champ); continue; }
    let pairs=[];
    if(C.stage===0){ const T=C.groups.map((g,k)=>ccTable(w,i,k)); C.gt=T.map(t=>t.map(r=>r.id));
      pairs=[[T[0][0].id,T[1][1].id],[T[1][0].id,T[0][1].id],[T[2][0].id,T[3][1].id],[T[3][0].id,T[2][1].id]];
      for(const t of T) for(const r of t.slice(2)) if(r.id===w.userClub) mail(w,'Prensa',`Adiós a la ${C.name}`,`${w.clubs[r.id].name} queda eliminado en la fase de grupos de la ${C.name}.`,'bad');
    } else { const ws=fx.map(f=>f.r.w); for(let k=0;k+1<ws.length;k+=2){ const a=ws[k],b=ws[k+1]; pairs.push(w.clubs[a].rep>=w.clubs[b].rep?[a,b]:[b,a]); } }
    C.stage++;
    const day=Math.max(C.days[C.stage],w.day+1);
    pairs.forEach(([h,a])=>w.fx.push({id:w.fx.length,lg:-1,cc:i,st:C.stage,rd:0,day,h,a,r:null,hr:21,ko:1,neu:C.stage===3?1:0}));
    news(w,`${C.name}: ${CCR[C.stage].toLowerCase()}`,pairs.map(([h,a])=>`${w.clubs[h].name} - ${w.clubs[a].name}`).join(' · ')+`. ${fDate(w,day,1)}.`,'res',-1);
    const mine=pairs.find(p=>p.includes(w.userClub));
    if(mine){ const o=w.clubs[mine[0]===w.userClub?mine[1]:mine[0]]; mail(w,'Prensa',`${C.name}: ${CCR[C.stage].toLowerCase()}`,`${w.clubs[w.userClub].name} se medirá a ${o.name} el ${fDate(w,day,1)}${C.stage===3?' en campo neutral':''}. Partido único: si hay empate, penaltis.`,'good'); }
  }
}
function ccChampion(w,i,cid){
  const C=w.cc[i], c=w.clubs[cid], D=CCD[i]; if(!c) return;
  awardTrophy(w,cid,C.name,D.single?'ic':'cc'); w.ccHist.push({s:w.season,i,c:cid});
  if(cid===w.userClub){ if(i===5) unlock(w,'nor'); const has=n=>c.troph.some(t=>t.n===n); if(has(CCD[0].name)&&has(CCD[3].name)) unlock(w,'eu2'); }
  const prize=roundMoney(15e6*D.pf); c.rep=clamp(c.rep+(D.single?2:3),1,99); c.fin.bal+=prize; c.fin.inc+=prize;
  news(w,`¡${c.name} conquista la ${C.name}!`,`${c.name} se proclama campeón de la ${C.name} ${seasonLabel(w)}.`,'tit',-1);
  CCD.forEach((X,j)=>{ if(X.single&&X.single.includes(i)) interSetup(w,j); });
}
// final a partido único entre los campeones de dos copas
function interSetup(w,j){
  const D=CCD[j], C=w.cc[j]; if(!C||C.champ>=0||w.fx.some(f=>f.cc===j)) return;
  const a=D.single.map(s=>w.cc[s]?w.cc[s].champ:-1); if(a.some(x=>x==null||x<0)||a[0]===a[1]) return;
  let day=C.days[0]; if(day<=w.day) day=w.day+2; if(day>=w.endDay) return;
  const [h,x]=w.clubs[a[0]].rep>=w.clubs[a[1]].rep?[a[0],a[1]]:[a[1],a[0]];
  C.teams=[h,x]; w.fx.push({id:w.fx.length,lg:-1,cc:j,st:0,rd:0,day,h,a:x,r:null,hr:20,ko:1,neu:1});
  news(w,`${D.name}: ${w.clubs[h].name} contra ${w.clubs[x].name}`,`Los campeones de la ${CCD[D.single[0]].name} y de la ${CCD[D.single[1]].name} se verán las caras el ${fDate(w,day,1)}.`,'res',-1);
  if(h===w.userClub||x===w.userClub) mail(w,'Directiva',`Final de la ${D.name}`,`Hemos ganado el derecho a jugar la ${D.name} el ${fDate(w,day,1)}. El club entero está ilusionado.`,'good');
}
function ccPrize(w,f){ const pf=CCD[f.cc].pf, pay=(cid,v)=>{ const c=w.clubs[cid]; if(!c) return; v=roundMoney(v*pf); c.fin.bal+=v; c.fin.inc+=v; };
  pay(f.h,6e5); pay(f.a,6e5);
  if(f.r.w>=0) pay(f.r.w,f.st>0?2.5e6*f.st:1.4e6); else { pay(f.h,4.5e5); pay(f.a,4.5e5); } }

function mactDo(id,r){
  const m=W.inbox.find(x=>x.id===id); if(!m||!m.act||m.act.done) return; const a=m.act, me=W.clubs[W.userClub];
  if(a.t==='poff'||a.t==='pren'){ jugMact(m,r); return; }
  if(a.t==='evt'){ const i=+r, E=EVT[a.e]; if(a.exp!=null&&W.day>a.exp){ closeModal(); return; } const out=evtResolve(m,i,false); closeModal();
    if(E&&E.open===i&&a.p!=null){ negPlayerOpen(a.p,null,'free'); return; }
    toast(out[0],out[1]); autosave(); render(); return; }
  if(a.t==='renew'){ if(r==='neg'){ closeModal(); negPlayerOpen(a.p,null,'renew',m.id); return; } a.done=true; const p=W.players[a.p]; if(p) p.mor=clamp(p.mor-4,5,100); toast('Lo hablaréis más adelante'); }
  else if(a.t==='njob'){ a.done=true; if(r==='acc'){ W.mgr.nj={nat:a.nat,s:W.season,f:'4-3-3',m:0}; closeModal(); njModal(); autosave(); render(); return; } toast('Rechazas la propuesta de la federación'); }
  else if(a.t==='job'){ a.done=true; if(r==='acc'){ newJob(a.c); return; } toast('Rechazas la propuesta'); const c=W.clubs[a.c]; if(c) c.vacT=W.day+1; W.mgr.rep=clamp((W.mgr.rep||45)+1,1,99); }
  else if(a.t==='spon'){ a.done=true; if(r==='a'){ me.fin.bal+=a.a; me.fin.inc+=a.a; toast(`${money(a.a)} ingresados`,'good'); news(W,`${a.n} patrocina a ${me.name}`,`El acuerdo deja ${money(a.a)} en las arcas del club.`,'eco',me.lg); }
    else if(r==='b'){ W.sponWin={amt:a.b,s:W.season,n:a.n}; toast(`${money(a.b)} por cada victoria`,'good'); news(W,`${a.n} patrocina a ${me.name}`,`El club cobrará ${money(a.b)} por cada victoria esta temporada.`,'eco',me.lg); }
    else toast('Propuesta rechazada'); }
  else if(a.t==='talk2'){ a.done=true; const p=W.players[a.p]; if(p&&p.club===me.id){
    if(r==='keep'){ if(p.a[A.det]>=12||rc(.5)){ p.mor=clamp(p.mor+7,5,100); p.unset=null; toast(`${sname(p)} se queda convencido`,'good'); } else { p.mor=clamp(p.mor-6,5,100); toast(`${sname(p)} no se lo cree del todo`,'bad'); } }
    else if(r==='open'){ p.mor=clamp(p.mor+4,5,100); p.unset=null; toast(`${sname(p)} agradece la sinceridad`); }
    else { p.tr=2; if(p.a[A.det]>=15){ p.mor=clamp(p.mor+2,5,100); toast(`${sname(p)} acepta: se centra en el equipo`); } else { p.mor=clamp(p.mor-10,5,100); toast(`${sname(p)} se enfada`,'bad'); } } } }
  closeModal(); autosave(); render();
}

  const a=Math.round(ph/t*100), b=Math.round(pd/t*100); return [a,b,100-a-b]; }

function monthOf(day){ const d=dOf(W,day); return (d.getUTCFullYear()-W.season)*12+d.getUTCMonth()-6; }
function dayFx(f){ const me=W.userClub, H=W.clubs[f.h], A_=W.clubs[f.a], mine=f.h===me||f.a===me, rep=f.r&&repOf(f);
  return `<div class="dayfx" ${rep?`data-a="report" data-f="${repKey(W,f)}"`:''} style="${rep?'cursor:pointer;':''}${mine?'font-weight:700;':''}" title="${esc(H.name)} - ${esc(A_.name)}"><span class="t r">${esc(H.short)} ${crestSVG(H,16)}</span><b>${f.r?`${f.r.hg}-${f.r.ag}${f.r.pens?'*':''}`:fxHour(f)}</b><span class="t">${crestSVG(A_,16)} ${esc(A_.short)}</span></div>`; }
function calDay(d){
  const me=W.userClub, c=W.clubs[me], nat=W.leagues[c.lg].nat, list=W.fx.filter(f=>f.day===d);
  const mine=list.find(f=>f.h===me||f.a===me), fut=d>W.day, today=d===W.day, wx=mine?fxWx(W,mine):wxAt(W,nat,d);
  let h=`<div class="card"><h3 style="text-transform:capitalize">${fDate(W,d,1)}<span class="sp"></span>${Math.abs(d-W.day)<=10||!fut?wxChip(mine&&mine.wx?mine.wx:wx):''}</h3>`;
  if(fut) h+=`<div class="row wrap" style="gap:8px;margin-bottom:10px"><button class="btn pri" data-a="calgo" data-d="${d}">Simular hasta este día</button><span class="muted" style="font-size:13px">Faltan ${d-W.day} día${d-W.day===1?'':'s'}. Se detiene antes si hay partido o una decisión.</span></div>`;
  if(mine){ const o=W.clubs[mine.h===me?mine.a:mine.h]; let res='';
    if(mine.r){ const gf=mine.h===me?mine.r.hg:mine.r.ag, ga=mine.h===me?mine.r.ag:mine.r.hg, k=mine.r.w===me?'W':mine.r.w<0?'D':'L'; res=`<span class="form"><i class="${k}">${k==='W'?'G':k==='D'?'E':'P'}</i></span> <b class="cond" style="font-size:22px">${gf}-${ga}</b>${repOf(mine)?` <button class="btn sm" data-a="report" data-f="${repKey(W,mine)}">Ver informe</button>`:''}`; }
    else if(today) res=`<button class="btn pri" data-a="cont">Ir al partido</button>`;
    h+=`<div class="card" style="background:var(--panel2);margin-bottom:10px;border-left:4px solid ${compCol(mine)}"><div class="muted" style="font-size:13px">${esc(compName(mine))} · ${fxHour(mine)} · ${mine.h===me?'En casa':'Fuera'}</div><div class="row" style="gap:10px;margin-top:6px">${crestSVG(o,34)}<b class="cond" style="font-size:20px;flex:1">${esc(o.name)}</b>${res}</div>${!mine.r&&wxNote(wx)?`<p class="muted" style="margin:8px 0 0;font-size:13px">${wxNote(wx)}</p>`:''}</div>`; }
  const groups={}; for(const f of list){ const k=f.cc!=null?'c'+f.cc:(f.cup?'u':'l')+f.lg; (groups[k]||(groups[k]=[])).push(f); }
  const keys=Object.keys(groups).sort((a,b)=>(b==='l'+c.lg)-(a==='l'+c.lg));
  if(!list.length) h+=`<p class="muted" style="margin:0">${(()=>{ const m=dOf(W,d).getUTCMonth(); return m===6||m===7||m===0?'Día de mercado: los clubes negocian fichajes. Sin partidos oficiales.':'Día de entrenamiento. Sin partidos oficiales.'; })()}</p>`;
  for(const k of keys){ const fx=groups[k], f0=fx[0], name=f0.cc!=null?CCD[f0.cc].name:f0.cup?W.leagues[f0.lg].cupName:W.leagues[f0.lg].name;
    const open=k==='l'+c.lg||k[0]==='c'||fx.some(f=>f.h===me||f.a===me);
    h+=`<details ${open?'open':''} style="margin-top:8px"><summary style="cursor:pointer;font-weight:600"><span style="display:inline-block;width:4px;height:13px;border-radius:2px;background:${compCol(f0)};margin-right:6px;vertical-align:-1px"></span>${esc(name)} <span class="muted" style="font-weight:500">(${fx.length})</span></summary>${fx.map(dayFx).join('')}</details>`; }
  for(const T of (W.tours||[])){ const tf=T.fx.filter(f=>f.d===d); if(tf.length) h+=`<details open style="margin-top:8px"><summary style="cursor:pointer;font-weight:600"><span style="display:inline-block;width:4px;height:13px;border-radius:2px;background:#7c3aed;margin-right:6px;vertical-align:-1px"></span>${esc(T.name)} <span class="muted" style="font-weight:500">(${tf.length})</span></summary>${tf.map(f=>tourFxRow(T,f)).join('')}</details>`; }
  const nw=W.news.filter(n=>n.season===W.season&&n.day===d).slice(0,8);
  if(nw.length) h+=`<h4 style="margin:14px 0 4px">Lo que pasó ese día</h4>${nw.map(newsRow).join('')}`;
  return h+'</div>';
}
function calList(){
  const me=W.userClub, list=W.fx.filter(f=>f.h===me||f.a===me).sort((a,b)=>a.day-b.day);
  const rows=list.map(f=>{ const home=f.h===me, o=W.clubs[home?f.a:f.h]; let res='<span class="muted">—</span>';
    if(f.r){ const gf=home?f.r.hg:f.r.ag, ga=home?f.r.ag:f.r.hg, k=f.r.w===me?'W':f.r.w===-1?'D':'L'; res=`<span class="form"><i class="${k}">${k==='W'?'G':k==='D'?'E':'P'}</i></span> <b>${gf}-${ga}</b>${f.r.pens?` <span class="muted">(pen. ${home?f.r.pens[0]:f.r.pens[1]}-${home?f.r.pens[1]:f.r.pens[0]})</span>`:''}`; }
    const wx=f.wx||(Math.abs(f.day-W.day)<=10?fxWx(W,f):null);
    return `<tr ${f.r&&repOf(f)?`data-a="report" data-f="${repKey(W,f)}"`:`data-a="calsel" data-d="${f.day}" data-m="1"`} class="${f.day===W.day?'me':''}"><td>${fDate(W,f.day,1)}</td><td>${fxHour(f)}</td><td><span style="display:inline-block;width:4px;height:12px;border-radius:2px;background:${compCol(f)};margin-right:6px"></span>${esc(compName(f))}</td><td class="c">${home?'Local':f.neu?'Neutral':'Visitante'}</td><td><span class="row" style="gap:7px">${crestSVG(o,18)}${esc(o.name)}</span></td><td>${wx?`<span class="wx-${wx.k}">${wxSVG(wx.k,16)}</span> ${wx.t}°`:''}</td><td>${res}</td></tr>`; }).join('');
  return `<div class="head"><div><h2>Calendario</h2><div class="muted">Todos tus partidos de la temporada ${seasonLabel(W)}.</div></div><div class="sp"></div><div class="seg"><button data-a="calmode" data-v="mes">Mes</button><button class="on" data-a="calmode" data-v="list">Mis partidos</button></div></div>
  <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Hora</th><th>Competición</th><th class="c">Campo</th><th>Rival</th><th>Clima</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
VIEWS.cal=()=>{
  if(UI.calMode==='list') return calList();
  const me=W.userClub, c=W.clubs[me], nat=W.leagues[c.lg].nat;
  const cm=clamp(UI.calM??monthOf(W.day),0,11); UI.calM=cm;
  const y=W.season+Math.floor((6+cm)/12), mo=(6+cm)%12, first=Date.UTC(y,mo,1), base=Date.UTC(W.season,6,1);
  const d0=Math.round((first-base)/864e5), nd=new Date(Date.UTC(y,mo+1,0)).getUTCDate(), lead=(new Date(first).getUTCDay()+6)%7;
  const sel=UI.calSel??W.day, byDay={};
  for(const f of W.fx){ if(f.day>=d0&&f.day<d0+nd) (byDay[f.day]||(byDay[f.day]=[])).push(f); }
  let cells=['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="dh">${x}</div>`).join('');
  for(let i=0;i<lead;i++) cells+='<div class="cd pad" aria-hidden="true"></div>';
  for(let k=0;k<nd;k++){ const d=d0+k, list=byDay[d]||[], mine=list.find(f=>f.h===me||f.a===me);
    const win=mo===6||mo===7||mo===0, wx=Math.abs(d-W.day)<=10?(mine&&mine.wx?mine.wx:wxAt(W,nat,d)):null;
    let mt='';
    if(mine){ const o=W.clubs[mine.h===me?mine.a:mine.h]; let cls='', txt=`${mine.h===me?'':'@'}${esc(o.short)}`;
      if(mine.r){ const gf=mine.h===me?mine.r.hg:mine.r.ag, ga=mine.h===me?mine.r.ag:mine.r.hg; cls=mine.r.w===me?'W':mine.r.w<0?'D':'L'; txt+=` ${gf}-${ga}`; } else txt+=` ${fxHour(mine).slice(0,2)}h`;
      mt=`<div class="mt ${cls}" style="--cc:${compCol(mine)}">${crestSVG(o,14)}<span>${txt}</span></div>`; }
    const dots=[]; if(list.some(f=>f.lg>=0&&!f.cup)) dots.push('lg'); if(list.some(f=>f.cup)) dots.push('cup'); CCD.forEach((_,i)=>{ if(list.some(f=>f.cc===i)) dots.push('cc'+i); }); if((W.tours||[]).some(T=>T.fx.some(f=>f.d===d))) dots.push('nt');
    cells+=`<button class="cd ${d<W.day?'past':''} ${d===W.day?'today':''} ${d===sel?'sel':''} ${win?'win':''}" data-a="calsel" data-d="${d}" aria-label="${fDate(W,d,1)}${mine?', partido contra '+esc(W.clubs[mine.h===me?mine.a:mine.h].name):''}"><span class="dn">${k+1}${wx?`<span class="wx-${wx.k}">${wxSVG(wx.k,14)}</span>`:''}</span>${mt}<span class="dots">${dots.map(x=>`<i class="${x}"></i>`).join('')}</span></button>`; }
  const dot=(bg,l)=>`<span class="row" style="gap:5px"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${bg}"></i>${l}</span>`;
  return `<div class="head"><div><h2>Calendario</h2><div class="muted">Temporada ${seasonLabel(W)}. Hoy es ${fDate(W,W.day,1)}.</div></div><div class="sp"></div>
   <div class="seg"><button class="on" data-a="calmode" data-v="mes">Mes</button><button data-a="calmode" data-v="list">Mis partidos</button></div></div>
   <div class="calw"><div class="card"><div class="row" style="margin-bottom:10px"><button class="btn sm" data-a="calm" data-v="${cm-1}" ${cm<=0?'disabled':''} aria-label="Mes anterior">‹</button><h3 style="flex:1;text-align:center;text-transform:capitalize">${MESL[mo]} ${y}</h3><button class="btn sm" data-a="calm" data-v="${cm+1}" ${cm>=11?'disabled':''} aria-label="Mes siguiente">›</button><button class="btn sm" data-a="caltoday">Hoy</button></div>
   <div class="calg">${cells}</div>
   <div class="row wrap muted" style="gap:12px;margin-top:10px;font-size:12.5px">${dot('var(--club)','Liga')}${dot('#9aa3ad','Copa')}${CCD.map(D=>dot(D.col,D.short)).join('')}${dot('#7c3aed','Selecciones')}<span class="row" style="gap:5px"><i style="display:inline-block;width:14px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--info) 18%,var(--panel));border:1px solid var(--line)"></i>Mercado abierto</span></div></div>
   <div>${calDay(sel)}</div></div>`;
};

function hotSeats(){ const out=[];
  for(const L of W.leagues){ const t=table(W,L.id); if(!t.length||!t[0].p) continue; for(const r of t.slice(-3)){ const c=W.clubs[r.id]; if(c.id===W.userClub||c.mg<0) continue; out.push([c,W.mgrs[c.mg],recentForm(W,c.id,5)]); } }
  out.sort((a,b)=>b[2].filter(x=>x==='L').length-a[2].filter(x=>x==='L').length);
  return out.slice(0,6).map(([c,m,f])=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer" data-a="cl" data-id="${c.id}">${crestSVG(c,20)}<div style="flex:1;min-width:0"><b style="font-weight:600">${esc(mgrName(m))}</b><div class="muted" style="font-size:12.5px">${esc(c.name)}</div></div>${formStr(f)}</div>`).join('')||'<p class="muted" style="margin:0">Todavía es pronto para las prisas.</p>'; }
const SAGA_ST=['Sondeo','Primera oferta','Oferta mejorada'];
function sagasCard(){ const l=(W.sagas||[]).filter(s=>W.players[s.p]&&W.clubs[s.b]).slice(0,8);
  return l.length?l.map(s=>{ const p=W.players[s.p], b=W.clubs[s.b]; return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer" data-a="pl" data-id="${p.id}">${crestSVG(b,20)}<div style="flex:1;min-width:0"><b style="font-weight:600">${esc(b.short)} quiere a ${esc(sname(p))}</b><div class="muted" style="font-size:12.5px">${esc(s.motive||'')}</div></div><span class="chip">${SAGA_ST[s.stage]||'En curso'}</span></div>`; }).join(''):'<p class="muted" style="margin:0">No hay negociaciones abiertas. Los clubes las abrirán solos según sus necesidades.</p>'; }
function brainCard(){ const cs=W.clubs.filter(c=>c.id!==W.userClub&&c.need).sort((a,b)=>b.need.d-a.need.d).slice(0,7);
  return cs.length?cs.map(c=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer" data-a="cl" data-id="${c.id}">${crestSVG(c,20)}<div style="flex:1;min-width:0"><b style="font-weight:600">${esc(c.name)}</b><div class="muted" style="font-size:12.5px">Necesita ${GNAME[c.need.g]}: ${esc(c.need.why)}</div></div></div>`).join(''):'<p class="muted" style="margin:0">Los clubes analizarán su plantilla cada semana.</p>'; }
function leaders(){ return W.leagues.filter(L=>!L.tier).map(L=>{ const t=table(W,L.id)[0]; if(!t) return ''; const c=W.clubs[t.id]; return `<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer" data-a="cl" data-id="${c.id}">${flagSVG(L.nat)}<span class="muted" style="width:92px;font-size:13px;flex:none">${esc(L.name)}</span>${crestSVG(c,18)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span><b>${t.pts}</b></div>`; }).join(''); }
function chronFallback(){ const n=W.news.slice(0,12); if(!n.length) return 'Todavía no hay suficiente actualidad. Avanza unos días.';
  const pick=k=>n.find(x=>x.k===k); const r=pick('res'), f=pick('fich')||pick('rumor'), b=pick('bank'), d=pick('decl');

const WTABS=[['hoy','Portada'],['news','Noticias'],['ligas','Ligas'],['mercado','Fichajes'],['hist','Historia']];
function dayResults(){ for(let i=0;i<8;i++){ const d=W.day-i, l=W.fx.filter(f=>f.day===d&&f.r); if(l.length) return {day:d,list:l}; } return {day:W.day,list:[]}; }

function worldLeagues(){
  if(UI.wl==null||!W.leagues[UI.wl]) UI.wl=W.clubs[W.userClub].lg; const L=W.leagues[UI.wl], t=table(W,L.id);

/* ---------- premios mensuales y de temporada ---------- */
function monthAwards(w){
  if(w.userClub<0&&!isJug(w)) return; const now=dOf(w), pm=(now.getUTCMonth()+11)%12;
  if(pm===6) return;
  w.leagues.forEach(L=>{ const pts={}, gl={};
    for(const f of w.fx){ if(f.lg!==L.id||f.cup||!f.r||f.day>=w.day||dOf(w,f.day).getUTCMonth()!==pm) continue;
      const a=f.r.hg>f.r.ag?[3,0]:f.r.hg<f.r.ag?[0,3]:[1,1]; pts[f.h]=(pts[f.h]||0)+a[0]; pts[f.a]=(pts[f.a]||0)+a[1];
      for(const g of f.r.g||[]) gl[g[1]]=(gl[g[1]]||0)+1; }
    const best=Object.entries(pts).sort((a,b)=>b[1]-a[1])[0]; if(!best||best[1]<7) return;
    const c=w.clubs[+best[0]], mes=MESL[pm];
    if(c.id===w.userClub){ w.mgr.aw.push({s:w.season,n:`Mánager del mes (${mes})`}); w.awards.push({s:w.season,lg:L.id,n:`Mánager del mes de ${mes}, ${L.name}`,u:1,c:c.id}); unlock(w,'mom'); mail(w,L.name,'Mánager del mes',`Has sido elegido mánager del mes de ${mes} en la ${L.name}: ${best[1]} puntos.`,'good'); soc(w,`¡${w.mgr.name}, mánager del mes! Merecidísimo.`,'good'); }
    else if(c.mg>=0){ const m=w.mgrs[c.mg]; w.awards.push({s:w.season,lg:L.id,n:`Mánager del mes de ${mes}, ${L.name}`,m:m.id,c:c.id}); }
    news(w,`${c.mg>=0?mgrName(w.mgrs[c.mg]):w.mgr.name}, mánager del mes`,`${c.name} sumó ${best[1]} puntos en ${mes} en la ${L.name}.`,'gen',L.id);

function toolClubFix(c){ if(c&&c.xi) fixLineup(W,c); }
function toolDo(k){
  const E=UI.edit, c=W.clubs[E.cid]; if(!c) return; const wk=E.wk||4; let n=0, msg='', ps=sqOf(W,c);
  const sick=p=>{ p.inj=wk*7; p.injT=rp(INJ); n++; };
  switch(k){
    case 'heal': ps.forEach(p=>{ if(p.inj>0||p.sus>0||p.cnd<100) n++; p.inj=0; p.injT=''; p.sus=0; p.cnd=100; }); msg=n?`${n} jugador${n===1?'':'es'} recuperado${n===1?'':'s'} en ${c.short}`:`${c.short} ya estaba al cien`; break;
    case 'injall': ps.forEach(sick); msg=`${n} jugadores lesionados en ${c.short}`; break;
    case 'injxi': c.xi.forEach(id=>{ const p=W.players[id]; if(p) sick(p); }); msg=`${n} titulares lesionados en ${c.short}`; break;
    case 'injone': { const p=rp(ps.filter(x=>x.inj<=0)); if(p){ sick(p); msg=`${pname(p)} se lesiona`; } else msg='No queda nadie sano'; break; }
    case 'unsus': ps.forEach(p=>{ if(p.sus>0) n++; p.sus=0; }); msg=`${n} sanciones levantadas`; break;
    case 'rest': ps.forEach(p=>{ p.cnd=100; }); msg='Plantel descansado'; break;
    case 'tire': ps.forEach(p=>{ p.cnd=Math.min(p.cnd,35); }); msg='Plantel exhausto'; break;
    case 'mup': ps.forEach(p=>mor(p,15)); msg='Moral por las nubes'; break;
    case 'mdn': ps.forEach(p=>mor(p,-15)); msg='Moral por los suelos'; break;
    case 'fan+': fanMood(W,c,20); msg='La grada está en llamas'; break;
    case 'fan-': fanMood(W,c,-20); msg='La grada da la espalda al equipo'; break;
    case 'inversor': { const amt=roundMoney(Math.max(2e7*lfC(c),c.fin.tb*2)); c.fin.bal+=amt; c.fin.tb+=roundMoney(amt*.6); news(W,`Nuevo inversor en ${c.name}`,`Un grupo inversor inyecta ${money(amt)} en ${c.name}.`,'eco',c.lg,{c:c.id}); msg=`${money(amt)} de inversión en ${c.short}`; break; }
    case 'deuda': { const d=roundMoney(Math.max(1.5e7*lfC(c),c.fin.tb*2)); c.fin.bal=-d; c.fin.tb=0; news(W,`${c.name} en números rojos`,`El club acumula ${money(d)} de deuda y cierra el grifo de los fichajes.`,'eco',c.lg,{c:c.id}); msg=`${c.short} debe ahora ${money(d)}`; break; }
    case 'saneado': if(c.fin.bal<0) c.fin.bal=0; msg='Cuentas saneadas'; break;
    case 'rep+': c.rep=clamp(c.rep+5,1,99); msg=`Reputación de ${c.short}: ${c.rep}`; break;
    case 'rep-': c.rep=clamp(c.rep-5,1,99); msg=`Reputación de ${c.short}: ${c.rep}`; break;
    case 'w-heal': for(const p of W.players){ if(p.ret) continue; p.inj=0; p.injT=''; p.sus=0; p.cnd=100; } W.clubs.forEach(toolClubFix); msg='Todo el mundo está sano'; break;
    case 'w-inj': for(const cl of W.clubs){ const p=rp(sqOf(W,cl).filter(x=>x.inj<=0)); if(p){ p.inj=ri(1,8)*7; p.injT=rp(INJ); toolClubFix(cl); n++; } } msg=`${n} clubes pierden a un jugador`; break;
    case 'w-ev': { const e=rp(WEV); const before=W.news.length; try{ e[1](W); }catch(err){ console.error(err); } msg=W.news.length>before?'Ha ocurrido algo en el mundo. Mira la sección Mundo.':'No hubo contexto para el evento. Prueba otra vez.'; break; }
    case 'w-debt': { const cl=rp(W.clubs.filter(x=>x.id!==W.userClub)); const d=roundMoney(cl.fin.tb*2+8e6*W.leagues[cl.lg].lf); cl.fin.bal=-d; cl.fin.tb=0; news(W,`Crisis económica en ${cl.name}`,`El club arrastra una deuda de ${money(d)} y recorta gastos.`,'eco',cl.lg,{c:cl.id}); msg=`${cl.name} entra en crisis`; break; }
  }
  toolClubFix(c); render(); autosave(); toast(msg,'good');
}

INP.epx=(t)=>{ const p=W.players[UI.edit.pid], k=t.dataset.k, v=Math.round(+t.value||0); if(!p) return;

 medical:{n:'Recuperación',w:3,gen:(w,c)=>{ const n=sqOf(w,c).filter(p=>p.inj>0).length; if(n<1) return null; const cost=roundMoney(150000*lfC(c));

   res:(w,c,a,i)=>{ const l=sqOf(w,c).filter(p=>p.inj>0); if(!l.length) return 'No hay nadie a quien tratar.'; if(i===0){ if(c.fin.bal<a.cost) return ['No hay saldo para el plan intensivo.','bad']; c.fin.bal-=a.cost; c.fin.exp+=a.cost; l.forEach(p=>{ p.inj=Math.max(1,Math.ceil(p.inj*.65)); }); fixLineup(w,c); return [`Los plazos se acortan para ${l.length} jugador${l.length===1?'':'es'}.`,'good']; }
     if(i===1){ l.forEach(p=>{ p.inj=Math.max(1,p.inj-3); }); fixLineup(w,c); return 'Se ahorran unos días.'; } return 'Todo sigue como estaba.'; }},
 rest:{n:'Día libre',w:2,gen:(w,c)=>{ const p=rp(evStars(w,c)); if(!p) return null; return {p:p.id,title:`${sname(p)} pide un día libre para el grupo`,body:`El grupo lleva semanas sin descanso y ${pname(p)}, en nombre del vestuario, te pide una jornada libre para recargar.`,opts:[['Dar el día libre','Recuperan energías y moral.'],['Mantener el entrenamiento','Disciplina firme. Mala cara en el grupo.'],['Doble sesión','Exigencia máxima. Puede mejorar a los jóvenes, pero desgasta.']],def:0}; },
   res:(w,c,a,i)=>{ const l=sqOf(w,c); if(i===0){ l.forEach(p=>{ p.cnd=Math.min(100,p.cnd+12); mor(p,3); }); return ['El grupo vuelve descansado y agradecido.','good']; } if(i===1){ allMor(w,c,-2); return 'El grupo obedece, pero no sonríe.'; }

 board:{n:'Presupuesto',w:2,gen:(w,c)=>({from:'Directiva',title:'La directiva quiere hablar de presupuesto',body:`Las cuentas no están del todo claras y el consejo te plantea ajustar el presupuesto de fichajes (ahora ${money(c.fin.tb)}).`,opts:[['Aceptar un recorte del 15%','Buena imagen ante el consejo.'],['Pedir más presupuesto','Arriesgado: puede salir bien o mal.'],['Dejarlo como está','Evitas conflictos, pero la directiva lo apunta.']],def:2}),

     if(i===1){ if(rc(.5)){ const v=roundMoney(c.fin.tb*.25); c.fin.tb+=v; W.board.conf=clamp(W.board.conf+1,0,100); return [`El consejo aprueba ${money(v)} más para fichajes.`,'good']; } W.board.conf=clamp(W.board.conf-4,0,100); return ['El consejo se molesta por la petición.','bad']; }
     W.board.conf=clamp(W.board.conf-1,0,100); return 'La directiva toma nota.'; }},
 retire:{n:'Veterano',w:1,gen:(w,c)=>{ const p=evPick(w,c,x=>x.age>=33&&x.club===c.id); if(!p) return null; return {p:p.id,title:`${sname(p)} habla de su futuro`,body:`${pname(p)} (${p.age} años) te confiesa que se plantea colgar las botas cuando termine su contrato. Le gustaría seguir vinculado al club de algún modo.`,opts:[['Renovarlo un año más (-20% sueldo)','Sigue como jugador.'],['Ofrecerle ser ayudante','Se retira ya y se une al cuerpo técnico.'],['Que decida él','Sin presión ni compromiso.']],def:2}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'El tema queda aparcado.';
     if(i===0){ p.wage=roundMoney(p.wage*.8); p.ce=Math.max(p.ce,w.season+1); mor(p,5); return [`${sname(p)} renueva un año más y mantiene la ilusión.`,'good']; }

 request:{n:'Petición de traspaso',w:2,gen:(w,c)=>{ const a=avgOvr(w,c); const p=evPick(w,c,x=>x.mor<58&&x.ovr>=a-3&&x.tr!==2&&x.age<=32); if(!p) return null;
   return {p:p.id,from:'Agente de '+sname(p),title:`${sname(p)} pide salir del club`,body:`Su representante te comunica que ${pname(p)} no se siente valorado y quiere una salida en cuanto haya una oferta razonable.`,opts:[['Aceptar y ponerlo transferible','Escucharás ofertas. Su moral mejora.'],['Rechazar la petición','Se queda, pero no te lo perdonará pronto.'],['Mejorarle el sueldo un 15%','Le convences con dinero.']],def:1}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'La petición queda sin efecto.'; if(i===0){ p.tr=1; mor(p,3); return `${sname(p)} queda transferible. Empezarán a llegar ofertas.`; }

 scare:{n:'Susto físico',w:3,gen:(w,c)=>{ const p=rp(c.xi.map(id=>w.players[id]).filter(x=>x&&x.inj<=0&&x.pos!=='GK')); if(!p) return null; return {p:p.id,from:'Servicios médicos',title:`${sname(p)} se duele de un golpe`,body:`${pname(p)} sufre una molestia en el entrenamiento. Los médicos dicen que puede jugar con dolor, pero no es lo aconsejable.`,opts:[['Descansarlo unos días','Tres días fuera. Sin riesgo.'],['Que juegue con molestias','40% de sufrir una lesión larga.'],['Pedir más pruebas','Un 20% de riesgo y una semana de dudas.']],def:0}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'No pasó nada.'; if(i===0){ p.inj=3; p.injT='Molestias musculares'; fixLineup(w,c); return 'Descansa unos días y vuelve como nuevo.'; }

 facility:{n:'Instalaciones',w:2,gen:(w,c)=>{ const f=c.fac||0; if(f>=5) return null; const cost=roundMoney(2.5e6*lfC(c)*(1+f)); if(c.fin.bal<cost*1.6) return null;

 bonus:{n:'Prima de victoria',w:2,gen:(w,c)=>{ const cost=roundMoney(250000*lfC(c)); return {from:'Capitán',title:'El vestuario pide una prima por objetivos',body:`El capitán te transmite que el grupo quiere una prima colectiva si se cumple el objetivo de la temporada. Costaría ${money(cost)} en total.`,opts:[[`Pagar ${money(cost)}`,'Vestuario encantado.'],[`Negociar a la mitad (${money(roundMoney(cost/2))})`,'Un punto medio.'],['Negarse','Sin coste, pero se nota en el ánimo.']],def:1,data:{cost}}; },
   res:(w,c,a,i)=>{ if(i===0){ if(c.fin.bal<a.cost) return ['No hay saldo.','bad']; c.fin.bal-=a.cost; c.fin.exp+=a.cost; allMor(w,c,4); return ['El vestuario se pone las pilas.','good']; } if(i===1){ const h=roundMoney(a.cost/2); c.fin.bal-=h; c.fin.exp+=h; allMor(w,c,1); return 'Acuerdo intermedio. Todos conformes.'; } allMor(w,c,-4); return ['El grupo se queda con mala cara.','bad']; }},
 press:{n:'Pregunta incómoda',w:2,gen:(w,c)=>{ const p=rp(evStars(w,c)); if(!p) return null; return {p:p.id,from:'Prensa',title:`Preguntan por el futuro de ${sname(p)}`,body:`Un periodista pregunta si ${pname(p)} seguirá la próxima temporada y lo relaciona con otros clubes. ¿Cómo respondes?`,opts:[['Elogiarlo públicamente','"Es una pieza clave". Sube su moral.'],['Decir que es intransferible','Cierra el tema, pero te condiciona.'],['No comentar','Sin titulares.']],def:2}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'Nada que añadir.'; if(i===0){ mor(p,4); news(w,`${W.mgr.name} defiende a ${pname(p)}`,`"${sname(p)} es una pieza clave de este proyecto".`,'decl',c.lg,{p:p.id}); return [`${sname(p)} lee tus palabras y sonríe.`,'good']; }
     if(i===1){ p.tr=2; mor(p,2); news(w,`${c.name}: ${pname(p)} es intransferible`,`El técnico cierra la puerta a cualquier oferta.`,'decl',c.lg,{p:p.id}); return `${sname(p)} queda blindado.`; } return 'Sin comentarios.'; }},
 kit:{n:'Merchandising',w:2,gen:(w,c)=>({from:'Comercial',title:'Propuesta de camiseta conmemorativa',body:'El departamento comercial propone lanzar una camiseta especial. Puede ser un éxito de ventas o pasar sin pena ni gloria.',opts:[['Lanzarla','Riesgo comercial, buen potencial.'],['Mantener la tradición','Sin ingresos extra, pero la grada lo agradece.']],def:1}),
   res:(w,c,a,i)=>{ if(i===1){ soc(w,`Gracias, ${c.short}, por no tocar la camiseta.`,'good'); return 'La grada agradece que se respete la tradición.'; } const inc=roundMoney(c.rep*c.rep*250*lfC(c));

};

const bc=(d)=>{ W.board.conf=clamp(W.board.conf+d,0,100); };
const posOf=(w,c)=>{ const t=table(w,c.lg); const i=t.findIndex(r=>r.id===c.id); return {i:i+1,n:t.length,p:t[i]?t[i].p:0}; };
const lastRes=(w,c,n)=>w.fx.filter(f=>f.r&&(f.h===c.id||f.a===c.id)).sort((a,b)=>b.day-a.day).slice(0,n).map(f=>{ const g=f.h===c.id?f.r.hg-f.r.ag:f.r.ag-f.r.hg; return g>0||f.r.w===c.id?'W':g<0||(f.r.w>=0&&f.r.w!==c.id)?'L':'D'; });
const RIVALMG=['Ricardo Salas','Tomás Aguirre','Emilio Vargas','Joaquín Beltrán','Sergio Montoya','Rafael Cuevas'];
Object.assign(EVT,{
 rival:{n:'Provocación del rival',w:3,gen:(w,c)=>{ const o=w.clubs[rp(w.leagues[c.lg].clubs.filter(x=>x!==c.id))]; if(!o) return null; const nm=rp(RIVALMG);
   return {from:'Prensa',title:`${nm} (${o.short}) te lanza un dardo`,body:`El técnico de ${o.name}, ${nm}, ha dicho en rueda de prensa que "algunos equipos viven de la suerte y de un buen presupuesto". Los micrófonos esperan tu respuesta.`,opts:[['Responder con ironía','Divierte a la grada y calienta el ambiente.'],['Responder con elegancia','"Prefiero hablar en el campo." Mejor imagen.'],['Contraatacar con dureza','Titulares a toda página… y riesgo de multa.'],['No contestar','Ignorar. La prensa se aburre.']],def:3,data:{o:o.id,nm}}; },
   res:(w,c,a,i)=>{ const o=w.clubs[a.o]; if(i===0){ fanMood(w,c,3); soc(w,`El míster del ${c.short} le ha contestado al de ${o.short} con una ironía de campeonato.`,'good'); return ['Tu ironía se hace viral. La grada te adora.','good']; }
     if(i===1){ bc(2); return ['Tu respuesta serena gusta en el palco y en la prensa seria.','good']; }
     if(i===2){ if(rc(.4)){ const f=roundMoney(c.fin.bal*.002+20000*lfC(c)); c.fin.bal-=f; c.fin.exp+=f; bc(-2); return [`La federación te multa con ${money(f)} por tus declaraciones.`,'bad']; } fanMood(w,c,4); allMor(w,c,2); return ['El vestuario se contagia de tu fuego. Mucha tensión para el próximo partido.','good']; }
     return 'El asunto se enfría solo.'; }},
 protest:{n:'Protesta de la afición',w:2,gen:(w,c)=>{ const m=fansOf(c).mood, r=lastRes(w,c,4); if(m>62&&r.filter(x=>x==='L').length<2) return null;
   return {from:'Peñas',title:'Los aficionados se concentran a las puertas del club',body:'Un grupo de peñas convoca una protesta tras los últimos resultados. Piden explicaciones al técnico y a la directiva antes del próximo partido.',opts:[['Salir a hablar con ellos','Dar la cara. Puede calmarlos o encenderlos más.'],['Enviar al capitán','Un gesto de unidad desde el vestuario.'],['Hacer un comunicado','Frío, pero seguro.'],['Ignorar la protesta','Esperar que se diluya.']],def:2}; },
   res:(w,c,a,i)=>{ if(i===0){ if(rc(.62)){ fanMood(w,c,9); return ['Los hinchas valoran que des la cara y bajan el tono.','good']; } fanMood(w,c,-4); bc(-2); return ['Te silban y el vídeo da la vuelta a las redes.','bad']; }

 ultim:{n:'Aviso de la directiva',w:2,gen:(w,c)=>{ if(W.board.conf>46) return null; return {from:'Directiva',title:'La directiva te cita en su despacho',body:`El consejo no está contento con la marcha del equipo (confianza ${W.board.conf}%). El presidente quiere saber qué plan tienes.`,opts:[['Prometer un cambio de rumbo','Te dan margen, pero con exigencia.'],['Pedir tiempo y paciencia','Argumentas que el proyecto necesita calma.'],['Culpar a la plantilla','Se ahorra la crítica, pero rompe el grupo.'],['Ofrecer tu dimisión','Si te la aceptan, caerás con dignidad.']],def:1}; },
   res:(w,c,a,i)=>{ if(i===0){ bc(6); allMor(w,c,-1); return ['El presidente asiente, aunque deja claro que te vigila.','good']; } if(i===1){ if(rc(.5)){ bc(4); return ['Aceptan darte tiempo.','good']; } bc(-3); return ['La paciencia del consejo se agota.','bad']; }
     if(i===2){ allMor(w,c,-5); bc(1); return ['El vestuario se entera de tus palabras y se rompe la confianza.','bad']; } if(rc(.35)){ bc(-30); return ['La directiva acepta tu oferta… y empieza a buscar sustituto.','bad']; } bc(8); return ['El presidente rechaza tu dimisión y refuerza su confianza.','good']; }},
 capt:{n:'El capitán',w:2,gen:(w,c)=>{ const l=evStars(w,c).filter(p=>p.age>=24); if(l.length<2) return null; const p=l[0],q=l[1]; return {p:p.id,q:q.id,from:'Capitán',title:`${sname(p)} cuestiona tus decisiones en público`,body:`${pname(p)}, uno de los referentes del grupo, ha declarado que "a veces no entiende" tus rotaciones. ${sname(q)} y otros veteranos observan en silencio.`,opts:[['Hablar a solas con él','Resolver en privado.'],['Quitarle el brazalete','Autoridad total, pero lo humillas.'],['Responder en rueda de prensa','Lo airea todavía más.'],['Darle más protagonismo','Compras su lealtad con minutos.']],def:0}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'La polémica se apaga.'; if(i===0){ if(p.a[A.det]>=11||rc(.55)){ mor(p,5); return [`${sname(p)} reconoce que se pasó de la raya.`,'good']; } mor(p,-3); return [`${sname(p)} sale de tu despacho sin sonreír.`,'bad']; }
     if(i===1){ mor(p,-9); allMor(w,c,-1,p); c.cap=a.q; return [`El brazalete pasa a ${sname(w.players[a.q])}. ${sname(p)} no lo olvidará.`,'bad']; } if(i===2){ mor(p,-5); allMor(w,c,-2,p); bc(-1); return ['Los titulares comen tu mensaje y el vestuario se divide.','bad']; } mor(p,6); allMor(w,c,-1,p); p.role=Math.min(p.role??1,1); return `${sname(p)} sonríe, aunque otros compañeros notan el trato de favor.`; }},
 whistle:{n:'Polémica arbitral',w:3,gen:(w,c)=>{ const f=w.fx.filter(x=>x.r&&(x.h===c.id||x.a===c.id)&&w.day-x.day<=4&&x.r.w!==c.id).sort((a,b)=>b.day-a.day)[0]; if(!f) return null; return {from:'Prensa',title:'Polémica con el arbitraje del último partido',body:'Una acción dudosa ha marcado el resultado y los periodistas te preguntan si te sientes perjudicado.',opts:[['Quejarte públicamente','La grada te apoya. La federación, menos.'],['Reclamar a la federación en privado','Vías oficiales. Poco ruido.'],['Aceptar el error y pasar página','Madurez. Sin titulares.']],def:2}; },
   res:(w,c,a,i)=>{ if(i===0){ fanMood(w,c,4); if(rc(.4)){ const f=roundMoney(30000*lfC(c)); c.fin.bal-=f; c.fin.exp+=f; return [`Multa federativa de ${money(f)} por tus palabras.`,'bad']; } return ['La grada se pone de tu lado y el vestuario se siente protegido.','good']; }
     if(i===1){ if(rc(.35)){ bc(1); return ['La federación reconoce el error del colegiado.','good']; } return 'La reclamación queda en nada.'; } bc(1); return 'Pasas página con deportividad.'; }},
 docu:{n:'Documental',w:1,gen:(w,c)=>{ if(c.rep<35) return null; const v=roundMoney(c.rep*c.rep*900*lfC(c)); return {from:'Comercial',title:'Una plataforma quiere grabar un documental en el club',body:`Una productora ofrece ${money(v)} por acceso exclusivo al vestuario durante unas semanas. Habrá cámaras en entrenamientos y charlas.`,opts:[[`Aceptar (${money(v)})`,'Dinero e imagen, pero distrae al grupo.'],['Aceptar sin charlas','Menos dinero y menos riesgo.'],['Rechazar','Intimidad del vestuario ante todo.']],def:2,data:{v}}; },
   res:(w,c,a,i)=>{ if(i===2){ allMor(w,c,1); return 'El vestuario agradece la tranquilidad.'; } const v=i===0?a.v:Math.round(a.v*.5); c.fin.bal+=v; c.fin.inc+=v; c.rep=clamp(c.rep+(i===0?1:0),1,99); if(i===0){ sqOf(w,c).forEach(p=>{ p.cnd=Math.max(55,p.cnd-3); }); if(rc(.4)){ allMor(w,c,-3); return [`Las cámaras entran en un mal momento. Entran ${money(v)}, pero el ambiente se resiente.`,'bad']; } } return [`Entran ${money(v)} y la imagen del club crece.`,'good']; }},
 leaktr:{n:'Rumores de fichaje',w:3,gen:(w,c)=>{ const p=rp(evStars(w,c)); if(!p) return null; const o=rp(w.clubs.filter(x=>x.id!==c.id&&x.rep>c.rep)); if(!o) return null; return {p:p.id,o:o.id,from:'Prensa',title:`${o.name} quiere a ${sname(p)}, según la prensa`,body:`Varios medios aseguran que ${o.name} prepara una oferta por ${pname(p)}. El jugador ha evitado hablar del tema.`,opts:[['Hablar con el jugador','Aclarar su compromiso.'],['Blindarlo públicamente','"No se vende." Cierra el tema.'],['Dejar que fluya','Tal vez suba su cotización… o su ego.']],def:0}; },

function poMatch(w,a,b,neu){ const H=w.clubs[a], A=w.clubs[b]; fixLineup(w,H); fixLineup(w,A); const M=simQuick(w,H,A,{cup:true}); const hg=M.s[0].g, ag=M.s[1].g; let win=hg>ag?a:ag>hg?b:-1, pens=null;

function tourAdvance(w,T){

/* ---------- rivalidades, derbis y ciclos de los clubes ---------- */
const hashI=(a,b)=>{ let h=Math.imul(a+1,2654435761)^Math.imul(b+7,40503); h^=h>>>13; h=Math.imul(h,1274126177); return (h^(h>>>16))>>>0; };
function rivalOf(w,c){
  if(c.riv!=null&&w.clubs[c.riv]&&w.clubs[c.riv].lg===c.lg) return c.riv;
  const L=w.leagues[c.lg]; let best=-1,bs=1e9;
  for(const id of L.clubs){ if(id===c.id) continue; const o=w.clubs[id], s=Math.abs(o.rep-c.rep)+(o.city===c.city?-30:0)+(hashI(c.id,id)%9); if(s<bs){ bs=s; best=id; } }
  c.riv=best; return best; }
function isDerby(w,f){ if(f.cc!=null) return false; const a=w.clubs[f.h], b=w.clubs[f.a]; return !!(a&&b&&a.lg===b.lg&&(rivalOf(w,a)===b.id||rivalOf(w,b)===a.id)); }
const h2hKey=(a,b)=>a<b?a+'-'+b:b+'-'+a;

function h2hAdd(w,f){ w.h2h=w.h2h||{}; const k=h2hKey(f.h,f.a), r=w.h2h[k]||(w.h2h[k]=[0,0,0,0,0]), lo=f.h<f.a, gl=lo?f.r.hg:f.r.ag, gh=lo?f.r.ag:f.r.hg;
  r[3]+=gl; r[4]+=gh; if(gl>gh) r[0]++; else if(gl<gh) r[2]++; else r[1]++; }

function rivChip(c){ if(c.national||c.lg==null||!W.leagues[c.lg]) return ''; const r=rivalOf(W,c), o=W.clubs[r]; if(!o) return ''; const h=h2hRec(W,c.id,r);

// ciclos: los clubes viven épocas de gloria y de crisis que duran varios años
function clubEras(w){
  for(const c of w.clubs){ const L=w.leagues[c.lg]; if(c.era&&w.season>c.era.u) c.era=null;
    if(c.era){ if(c.era.k==='oro'){ c.rep=clamp(c.rep+1,1,99); c.fin.tb=roundMoney(c.fin.tb*1.15); } else if(c.id!==w.userClub){ c.rep=clamp(c.rep-1,1,99); c.fin.tb=roundMoney(c.fin.tb*.82); } continue; }
    const h=(c.hist||[]).slice(-3); if(h.length<3) continue; const n=L.clubs.length, avg=h.reduce((s,x)=>s+x.pos,0)/3;
    let k=avg<=3.2&&c.rep<93&&rc(.4)?'oro':avg>=n-4&&c.rep>28&&c.id!==w.userClub&&rc(.35)?'crisis':rc(.012)?(rc(.5)||c.id===w.userClub?'oro':'crisis'):null;
    if(!k) continue; c.era={k,u:w.season+ri(3,5)};

const AGP=[['duro','negociador duro','Pide más y cede poco.'],['leal','leal','Prefiere cerrar rápido y sin dramas.'],['codicioso','codicioso','Exige una prima de fichaje más alta.'],['dialogante','dialogante','Acepta cambios razonables.']];

function lkTop(w,c){ const ids=new Set((c.xi||[]).filter(id=>id>=0)); lkLeaders(w,c).forEach(p=>ids.add(p.id)); sqOf(w,c).filter(p=>!ids.has(p.id)&&p.inj<=0).sort((a,b)=>b.ovr-a.ovr).slice(0,6).forEach(p=>ids.add(p.id)); return [...ids].map(id=>w.players[id]).filter(p=>p&&p.club===c.id).slice(0,18); }
function lkBase(a,b){ // afinidad estable entre dos jugadores
