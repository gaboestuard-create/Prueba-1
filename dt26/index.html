 fansurvey:{n:'Encuesta de socios',w:2,gen:(w,c)=>{ const f=fansOf(c); return {from:'Club',title:'Los socios opinan sobre el precio de las entradas',body:`Una encuesta interna muestra que ${f.mood<50?'muchos aficionados consideran caras las entradas':'la afición está dividida entre mantener los precios o mejorar los ingresos'}. La directiva te pide opinión.`,opts:[['Abaratar las entradas','Más público y mejor ambiente. Menos ingresos.'],['Mantener los precios','Sin cambios.'],['Subir los precios','Más dinero. La grada se enfría.']],def:1}; },
   res:(w,c,a,i)=>{ const f=fansOf(c); if(i===0){ f.tix=Math.max(0,f.tix-1); fanMood(w,c,5); return ['La afición lo agradece: entradas más baratas desde ahora.','good']; } if(i===2){ f.tix=Math.min(4,f.tix+1); fanMood(w,c,-5); bc(1); return ['Suben los ingresos de taquilla y baja el ánimo en la grada.','bad']; } return 'Los precios no cambian.'; }},
 capinject:{n:'Inyección de capital',w:1,gen:(w,c)=>{ if(c.rep>85) return null; const v=roundMoney(c.fin.tb*.8+4e6*lfC(c)); return {from:'Directiva',title:'El presidente ofrece una inyección de capital',body:`El presidente propone aportar ${money(v)} para fichajes, pero pide más voz en las decisiones deportivas y en la planificación de las ventas.`,opts:[[`Aceptar ${money(v)}`,'Más presupuesto, menos autonomía.'],['Aceptar solo la mitad','Equilibrio.'],['Rechazar para mantener el control','Independencia total.']],def:2,data:{v}}; },
   res:(w,c,a,i)=>{ if(i===0){ c.fin.tb+=a.v; bc(-3); return [`Presupuesto de fichajes +${money(a.v)}. El presidente querrá opinar.`,'good']; } if(i===1){ const h=Math.round(a.v/2); c.fin.tb+=h; return `Presupuesto de fichajes +${money(h)} sin ceder el control.`; } bc(2); return 'El presidente respeta tu postura.'; }},
 stadsafe:{n:'Inspección del estadio',w:2,gen:(w,c)=>{ const cost=roundMoney(250000*lfC(c)); return {from:'Jefe de campo',title:`Inspección de seguridad en ${c.st.name}`,body:`La federación detecta pequeños defectos en las salidas de emergencia. Se pueden reparar ya o aplazarlo y asumir el riesgo de una sanción.`,opts:[[`Reparar ahora (${money(cost)})`,'Sin riesgos.'],['Parche rápido','Barato, pero no es definitivo.'],['Aplazarlo','Puede acabar en multa o cierre parcial.']],def:0,data:{cost}}; },
   res:(w,c,a,i)=>{ if(i===0){ if(c.fin.bal<a.cost) return ['No hay saldo para la reparación.','bad']; c.fin.bal-=a.cost; c.fin.exp+=a.cost; return ['Todo en regla. La grada no notará nada.','good']; } if(i===1){ const h=Math.round(a.cost/3); c.fin.bal-=h; c.fin.exp+=h; return rc(.25)?['El parche no convence a los inspectores y llega una multa.','bad']:'El parche pasa la inspección.'; }
     if(rc(.45)){ const f=roundMoney(a.cost*1.4); c.fin.bal-=f; c.fin.exp+=f; fanMood(w,c,-3); return [`Sanción de ${money(f)} por incumplimientos de seguridad.`,'bad']; } return 'Esta vez la federación no pone pegas.'; }},
 scoutq:{n:'Informe del ojeador',w:2,gen:(w,c)=>{ const a=avgOvr(w,c), p=w.players.filter(x=>x.club>=0&&x.club!==c.id&&!x.ret&&x.age<=24&&x.pa>=a+4&&x.ovr>=a-8).sort(()=>rf()-.5)[0]; if(!p) return null; const cost=roundMoney(30000*lfC(c));
   return {p:p.id,from:'Ojeador',title:`Un ojeador recomienda ver a ${sname(p)}`,body:`Mi informe: ${pname(p)} (${PES[p.pos]}, ${p.age} años, ${w.clubs[p.club].name}) tiene un techo muy alto. Propongo viajar a seguirlo dos semanas; el viaje cuesta ${money(cost)}.`,opts:[[`Enviar al ojeador (${money(cost)})`,'Informe completo y lo añadimos a la lista.'],['Seguirlo por vídeo','Gratis, pero con menos detalle.'],['No es prioridad','Descartar.']],def:1,data:{cost}}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||i===2) return 'Lo dejas pasar.'; if(i===0){ if(c.fin.bal<a.cost) return ['No hay saldo para el viaje.','bad']; c.fin.bal-=a.cost; c.fin.exp+=a.cost; } if(!w.short.includes(p.id)) w.short.push(p.id); return [`${pname(p)} entra en tu lista de seguimiento${i===0?' con un informe completo':''}.`,'good']; }},
 injplay:{n:'Quiere jugar lesionado',w:3,gen:(w,c)=>{ const p=evPick(w,c,x=>x.inj>0&&x.inj<=10&&x.ovr>=avgOvr(w,c)); if(!p) return null;

   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'Todo queda en nada.'; if(i===0){ p.inj=Math.max(0,p.inj-ri(3,7)); mor(p,6); if(rc(.4)){ p.inj=p.inj+ri(8,18); p.injT='Recaída'; fixLineup(w,c); return [`${sname(p)} recae y estará más tiempo fuera.`,'bad']; } fixLineup(w,c); return `${sname(p)} vuelve antes de lo previsto.`; }
     if(i===1){ mor(p,-2); return `${sname(p)} acepta esperar, aunque con cara de pocos amigos.`; } if(rc(.65)){ p.inj=Math.max(1,p.inj-ri(2,4)); return 'El médico acorta unos días el plazo con un plan específico.'; } mor(p,-1); return 'El médico recomienda prudencia total.'; }},
 newdad:{n:'Un nuevo papá',w:1,gen:(w,c)=>{ const p=evPick(w,c,x=>x.age>=22&&x.age<=34&&x.inj<=0); if(!p) return null; return {p:p.id,title:`${sname(p)} será padre`,body:`${pname(p)} te cuenta que su pareja dará a luz en pocos días y pide permiso para acompañarla. Hay partido próximamente.`,opts:[['Darle permiso total','Se pierde el próximo partido. Gesto humano.'],['Que viaje y vuelva a tiempo','Compromiso. Llega justo.'],['Pedirle que se concentre','Se siente incomprendido.']],def:0}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'Felicidades al jugador.'; if(i===0){ p.sus=Math.max(p.sus,1); mor(p,10); allMor(w,c,1,p); fixLineup(w,c); return [`${sname(p)} no lo olvidará. El vestuario valora tu humanidad.`,'good']; } if(i===1){ p.cnd=Math.max(50,p.cnd-8); mor(p,4); return `${sname(p)} vuelve cansado pero agradecido.`; } mor(p,-8); allMor(w,c,-1,p); return [`${sname(p)} se siente incomprendido y lo comenta en el vestuario.`,'bad']; }},
 viral:{n:'Viral en redes',w:2,gen:(w,c)=>{ const p=evPick(w,c,x=>x.age<=29&&x.ovr>=avgOvr(w,c)-2); if(!p) return null; return {p:p.id,from:'Comunicación',title:`${sname(p)} se hace viral con una celebración`,body:`El gesto de ${pname(p)} tras su último acierto da la vuelta a las redes. Unos lo adoran y otros lo consideran una falta de respeto al rival.`,opts:[['Elogiar su personalidad','Sube su confianza, pero lo expone.'],['Pedirle prudencia','Equilibrio. Mensaje claro.'],['Ignorarlo','La polémica se enfría sola.']],def:1}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'Se olvida pronto.'; if(i===0){ p.cf=clamp((p.cf??50)+7,0,100); mor(p,4); c.rep=clamp(c.rep+(rc(.3)?1:0),1,99); soc(w,`${sname(p)} y su celebración. Pura personalidad.`,'good'); return [`${sname(p)} se siente respaldado y gana confianza.`,'good']; } if(i===1){ mor(p,rc(.5)?2:-2); return 'Entiende el mensaje, aunque no todos los días le gusta.'; } return 'La polémica se diluye en un par de días.'; }},
 raise:{n:'Pide una mejora',w:3,gen:(w,c)=>{ const p=evPick(w,c,x=>x.club===c.id&&formAvg(x)>=7&&x.st.ap>=6&&x.wage<calcWage(x,lfC(c))*.95); if(!p) return null; const up=roundMoney(p.wage*.18);
   return {p:p.id,from:'Agente de '+sname(p),title:`${sname(p)} pide un aumento por su buen momento`,body:`${pname(p)} atraviesa un gran momento (nota media ${formAvg(p).toFixed(1)}) y su agente reclama una mejora de ${money(up)} semanales. Si no hay respuesta, sonará en otros clubes.`,opts:[['Concederle el aumento','Gasto fijo extra. Moral y confianza al alza.'],['Prometer revisarlo en verano','Aplazas el gasto con riesgo de molestia.'],['Negarse','Te mantienes firme.']],def:1,data:{up}}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'La petición pierde sentido.'; if(i===0){ p.wage+=a.up; mor(p,8); p.cf=clamp((p.cf??50)+5,0,100); return [`${sname(p)} firma una mejora y se siente valorado.`,'good']; } if(i===1){ if(rc(.55)){ mor(p,2); return `${sname(p)} acepta esperar.`; } mor(p,-5); return [`${sname(p)} no se fía de la promesa.`,'bad']; } mor(p,-7); if(rc(.3)){ p.unset=w.day; p.unsetAsk=0; } return [`${sname(p)} se enfada y empieza a oír ofertas.`,'bad']; }},
 pens:{n:'Disputa por los penaltis',w:2,gen:(w,c)=>{ const l=evStars(w,c).filter(p=>PGRP[p.pos]!=='g'); if(l.length<2) return null; const s=shuffle(l.slice()); const p=s[0],q=s[1];
   return {p:p.id,q:q.id,title:`${sname(p)} y ${sname(q)} se disputan los penaltis`,body:`Tras el último penalti fallado, ${pname(p)} y ${pname(q)} discuten quién debe lanzar. El resto del grupo se divide en la grada y en el campo.`,opts:[[`Elegir a ${sname(p)}`,`${sname(p)} gana confianza.`],[`Elegir a ${sname(q)}`,`${sname(q)} gana confianza.`],['Que decida el capitán en el campo','Delegas.']],def:2}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p], q=w.players[a.q]; if(!p||!q||p.club!==c.id||q.club!==c.id) return 'El asunto se arregla solo.'; if(i===0){ p.cf=clamp((p.cf??50)+6,0,100); mor(p,3); mor(q,-4); return `${sname(q)} acata, pero no le hace gracia.`; } if(i===1){ q.cf=clamp((q.cf??50)+6,0,100); mor(q,3); mor(p,-4); return `${sname(p)} acata, pero no le hace gracia.`; } const cap=w.players[c.cap]; if(cap&&cap.club===c.id) mor(cap,2); return 'El capitán lo resuelve en el campo sin dramas.'; }},
 interview:{n:'Entrevista polémica',w:2,gen:(w,c)=>{ const p=evPick(w,c,x=>x.club===c.id&&x.age>=22&&x.ovr>=avgOvr(w,c)-3); if(!p) return null; return {p:p.id,from:'Prensa',title:`${sname(p)} critica el estilo de juego en una entrevista`,body:`${pname(p)} ha dicho que "con otro sistema el equipo luciría más". Las palabras ya están en todos los medios y los compañeros esperan tu reacción.`,opts:[['Reprenderlo en público','Autoridad. Rompe confianza.'],['Hablar a solas con él','Dialogas en privado.'],['Dar valor a su opinión','Muestras apertura. Algunos lo verán como debilidad.']],def:1}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'Todo queda en nada.'; if(i===0){ mor(p,-8); p.cf=clamp((p.cf??50)-6,0,100); bc(1); allMor(w,c,-1,p); return [`${sname(p)} se siente humillado. El resto toma nota.`,'bad']; } if(i===1){ if(p.a[A.cmp]>=9||rc(.55)){ mor(p,3); return `${sname(p)} se disculpa y se compromete.`; } mor(p,-3); return [`${sname(p)} sigue pensando lo mismo.`,'bad']; } mor(p,6); c.tac.pr=clamp((c.tac.pr||0)+(rc(.5)?1:0),-2,2); return `${sname(p)} agradece que lo escuches. El vestuario ve a un técnico dialogante.`; }},
 agentpress:{n:'El agente habla en prensa',w:2,gen:(w,c)=>{ const p=evPick(w,c,x=>x.club===c.id&&x.ovr>=avgOvr(w,c)); if(!p) return null; const ag=agentOf(p); return {p:p.id,from:ag.n,title:`El agente de ${sname(p)} ataca al club`,body:`${ag.n} (${ag.t[1]}) declara que ${pname(p)} "merece un proyecto más ambicioso" y que el club "no valora su talento". El jugador no ha desmentido las palabras.`,opts:[['Responder en prensa','Defiendes tu proyecto.'],['Llamar al agente en privado','Intentas rebajar la tensión.'],['Ignorarlo','No dar importancia.']],def:1}; },
   res:(w,c,a,i)=>{ const p=w.players[a.p]; if(!p||p.club!==c.id) return 'El tema se queda en nada.'; if(i===0){ fanMood(w,c,3); mor(p,-4); return ['Tu respuesta gusta a la grada, pero el jugador se molesta.','bad']; } if(i===1){ if(rc(.6)){ mor(p,3); return 'El agente baja el tono tras la llamada.'; } mor(p,-2); return 'El agente no se deja convencer.'; } mor(p,-1); return 'La polémica se apaga poco a poco.'; }},
 mgrcritic:{n:'Columnista en contra',w:3,gen:(w,c)=>{ const nm=rp(COLUMN), og=rp(OUTL); return {from:og,title:`${nm} cuestiona tus decisiones en ${og}`,body:`En su columna de hoy, ${nm} asegura que tus alineaciones "no tienen lógica" y que el equipo "juega a pesar del técnico". La afición comenta el artículo.`,opts:[['Responder con argumentos','Lo desmontas con datos.'],['Invitarlo a un entrenamiento','Gesto de apertura.'],['Ignorarlo','Lo dejas pasar.'],['Ironizar en rueda de prensa','Divierte y calienta.']],def:2,data:{nm}}; },
   res:(w,c,a,i)=>{ if(i===0){ if(rc(.55)){ bc(2); fanMood(w,c,2); mgrRep(1); return [`Tus argumentos convencen a la grada: ${a.nm} pierde la discusión.`,'good']; } bc(-1); return 'Tu respuesta alimenta más la polémica.'; } if(i===1){ if(rc(.6)){ mgrRep(1); soc(w,`El míster invitó a ${a.nm} a ver un entrenamiento. Eso es tener clase.`,'good'); return ['La invitación desarma al columnista.','good']; } return `${a.nm} acepta, pero mantiene sus críticas.`; }
     if(i===3){ fanMood(w,c,3); if(rc(.35)){ bc(-1); return ['La ironía se vuelve viral, pero el palco no se ríe.','bad']; } return ['La ironía triunfa en las redes.','good']; } return 'La columna se olvida en dos días.'; }},
 mgrbook:{n:'Oferta editorial',w:1,gen:(w,c)=>{ if((W.mgr.rep||45)<48) return null; return {from:'Editorial',title:'Una editorial te propone escribir un libro',body:'Una editorial te ofrece publicar tus memorias y tu método de trabajo. Requiere tiempo y exponer detalles de tu vida y del vestuario.',opts:[['Aceptar y escribirlo','Mejora tu prestigio, pero te distrae.'],['Aceptar con un colaborador','Menos riesgo y menos prestigio.'],['Rechazar','Concentrado en el club.']],def:2}; },
   res:(w,c,a,i)=>{ if(i===0){ mgrRep(2); bc(-2); return ['Tu libro llama la atención. En el club, algunos opinan que estás distraído.','good']; } if(i===1){ mgrRep(1); return 'Un libro discreto que no molesta a nadie.'; } bc(1); return 'La directiva valora tu enfoque.'; }},
 mgrstress:{n:'Cansancio del técnico',w:1,gen:(w,c)=>{ if(w.day<60) return null; return {from:'Servicios médicos',title:'El médico te recomienda descansar',body:'Tras semanas de presión, tu médico te recomienda bajar el ritmo. Podrías delegar en tu asistente los entrenamientos de la semana.',opts:[['Delegar una semana en el asistente','Descansas. El grupo se acostumbra a otro ritmo.'],['Seguir con el ritmo habitual','Presión intacta. Riesgo de agotamiento.'],['Tomar un par de días libres','Descanso corto y discreto.']],def:2}; },
   res:(w,c,a,i)=>{ if(i===0){ sqOf(w,c).forEach(p=>{ p.cnd=Math.min(100,p.cnd+4); }); bc(-1); return 'Vuelves renovado. El asistente mantiene el ritmo, aunque el palco lo comenta.'; } if(i===1){ if(rc(.3)){ bc(-2); return ['El cansancio te pasa factura y cometes errores en la gestión.','bad']; } return 'Aguantas, pero el desgaste es evidente.'; } return 'Dos días de desconexión sientan de maravilla.'; }},
 mgrunion:{n:'Asociación de entrenadores',w:1,gen:(w,c)=>({from:'Asociación de entrenadores',title:'La asociación pide tu voz en una reforma',body:'La asociación de entrenadores propone limitar los horarios de los partidos para proteger a los jugadores. Te pide que firmes una carta pública.',opts:[['Firmar la carta','Respaldas a los entrenadores. La liga se incomoda.'],['Apoyar solo en privado','Discreción.'],['No posicionarte','Mantienes distancia.']],def:2}),
   res:(w,c,a,i)=>{ if(i===0){ mgrRep(1); fanMood(w,c,1); if(rc(.3)){ bc(-1); return ['La liga toma nota de tu postura pública.','bad']; } return ['Tu firma suma apoyos entre colegas.','good']; } if(i===1){ mgrRep(0); return 'Tu apoyo discreto se agradece en la asociación.'; } return 'Sin posicionamiento. Sin consecuencias.'; }},
 mgrcourse:{n:'Curso de entrenadores',w:1,gen:(w,c)=>{ if(w.day<20) return null; return {from:'Federación',title:'Invitación a un curso de formación',body:'La federación te invita a un curso internacional de metodología. Te ausentarás unos días y el asistente dirigirá algunos entrenamientos.',opts:[['Asistir al curso','Ganas prestigio y nuevas ideas.'],['Enviar a tu asistente','Menos prestigio, pero sigues al mando.'],['Declinar','Todo sigue igual.']],def:2}; },
   res:(w,c,a,i)=>{ if(i===0){ mgrRep(2); sqOf(w,c).forEach(p=>{ if(rc(.08)&&p.age<=24){ improve(p,0); upd(p); } }); return ['El curso te da ideas frescas y prestigio entre colegas.','good']; } if(i===1){ mgrRep(1); return 'Tu asistente vuelve con buenas ideas.'; } return 'Declinas con cortesía.'; }}

/* ---------- noticias que te afectan: rumores, elogios y críticas con tu club o tus jugadores ---------- */
function evUserNews(w){
  const me=w.clubs[w.userClub]; if(!me||w.jobless) return; const sq=sqOf(w,me); if(!sq.length) return; const p=rp(sq.filter(x=>x.ovr>=avgOvr(w,me)-2)||sq)||rp(sq);
  const rival=rp(w.leagues[me.lg].clubs.filter(id=>id!==me.id).map(id=>w.clubs[id])), nm=rp(COLUMN), og=rp(OUTL), t=table(w,me.lg), pos=t.findIndex(r=>r.id===me.id)+1;
  const V=[
   ()=>news(w,`${og} elogia a ${pname(p)}`,`El diario destaca la regularidad de ${pname(p)} y asegura que es "una de las piezas más infravaloradas de la liga".`,'decl',me.lg,{p:p.id}),
   ()=>news(w,`${nm} critica el rendimiento de ${pname(p)}`,`En su columna, el periodista dice que ${pname(p)} "está por debajo de su nivel" y pide al técnico que lo reconsidere.`,'decl',me.lg,{p:p.id}),
   ()=>{ const nat=w.leagues[me.lg].nat; news(w,`El seleccionador sigue de cerca a ${pname(p)}`,`El cuerpo técnico de ${NAT[p.nat]?NAT[p.nat][0]:'su selección'} lo ha visto en directo y valora llamarlo en la próxima lista.`,'rumor',me.lg,{p:p.id}); },
   ()=>{ const b=rp(w.clubs.filter(x=>x.id!==me.id&&x.rep>=me.rep)); if(b) news(w,`${b.name} vigila a ${pname(p)}`,`Ojeadores de ${b.name} han asistido a los últimos partidos de ${pname(p)}. Por ahora no hay oferta formal.`,'rumor',me.lg,{p:p.id}); },
   ()=>{ if(rival) news(w,`${rival.name} ${pos&&pos<=3?'envidia':'se burla de'} a ${me.name}`,`Un directivo de ${rival.name} habla de "${pos&&pos<=3?'el gran momento':'las dudas'}" de ${me.name} en una entrevista.`,'decl',me.lg,{c:me.id}); },
   ()=>news(w,`Los hinchas de ${me.name} ${fansOf(me).mood>=55?'respaldan':'cuestionan'} a ${W.mgr.name}`,`Una encuesta entre aficionados muestra que ${fansOf(me).mood>=55?'la mayoría confía en':'una parte importante duda de'} el trabajo del técnico.`,'gen',me.lg,{c:me.id}),
   ()=>news(w,`Rumores de tensión en el vestuario de ${me.name}`,`Varios medios hablan de un ambiente enrarecido en el vestuario de ${me.name}. En el club lo niegan.`,'rumor',me.lg,{c:me.id}),
   ()=>news(w,`${pname(p)} visita una fundación y gana simpatías`,`El jugador de ${me.name} pasa la tarde con niños de un colegio. La imagen recorre las redes.`,'gen',me.lg,{p:p.id}),
   ()=>{ const b=rp(w.clubs.filter(x=>x.id!==me.id)); if(b&&p) news(w,`${b.name} sondea a ${pname(p)} a través de su entorno`,`Su representante habría mantenido contactos con ${b.name}. Nadie lo confirma.`,'rumor',me.lg,{p:p.id}); }
  ]; try{ rp(V)(); }catch(e){ console.error('noticia',e); } }

const PRES_T={aus:['Austero','Prefiere cuentas sanas: recorta el presupuesto y premia el equilibrio.'],amb:['Ambicioso','Exige títulos: más presupuesto, pero presiona.'],pop:['Populista','Vive de la grada: la afición pesa en sus decisiones.'],pru:['Prudente','Estable y paciente: apenas interfiere.']};
function presOf(w,c){ if(!c.pres){ const n=genName(w.leagues[c.lg].nat); c.pres={n:n[0]+' '+n[1],t:rp(Object.keys(PRES_T)),s:w.season-ri(0,2),term:4}; } return c.pres; }

function presApply(w,c,t){ if(t==='aus') c.fin.tb=Math.round(c.fin.tb*.85); else if(t==='amb') c.fin.tb=Math.round(c.fin.tb*1.2); else if(t==='pop') fanMood(w,c,8); }

  const c=w.clubs[w.userClub]; if(!c||w.jobless) return; const P=presOf(w,c), t=table(w,c.lg), pos=t.findIndex(r=>r.id===c.id)+1; let d=0, why='';
  if(P.t==='aus'){ d=c.fin.bal>0?3:-3; why=c.fin.bal>0?'las cuentas están sanas':'el club está en números rojos'; }
  else if(P.t==='amb'){ d=pos&&pos<=3?4:-4; why=pos&&pos<=3?'el equipo peleó arriba':'esperaba pelear por los títulos'; }
  else if(P.t==='pop'){ const f=fansOf(c).mood; d=f>=60?3:-2; why=f>=60?'la grada está contenta':'la grada está descontenta'; }

  if(d){ w.board.conf=clamp(w.board.conf+d,0,100); mail(w,'Presidente',`Balance del presidente ${P.n}`,`${P.n} (${PRES_T[P.t][0].toLowerCase()}) ${d>0?'está satisfecho':'no está contento'}: ${why}. Su confianza en ti ${d>0?'sube':'baja'} ${Math.abs(d)} puntos.`,d>0?'good':'bad'); }
  if(w.season>=P.s+P.term) w.elecDue=1; }

function jugPick(w,c){
  const p=w.players[w.me], pc=w.pc, k=w.season*1000+w.day; if(!p||!c||p.club!==c.id) return; if(pc.pk===k) return; pc.pk=k;

  for(let i=0;i<11;i++){ const q=w.players[c.xi[i]]; if(!q) continue; const pos=form[i][0];
    const mine=posRating(p,pos)*(.72+.28*p.cnd/100)*(1+tb), th=posRating(q,pos)*(.72+.28*q.cnd/100);

function jugMonth(w,p,mo){

  if(T.f!=='pos') for(let k=0;k<I[2];k++){ if(p.ovr>=p.pa&&p.age<=31) break; if(rc(I[0]*ageF)){ jugImprove(p,T.f); n++; } }
  else { const tgt=T.pos&&PADJ[p.pos].includes(T.pos)?T.pos:PADJ[p.pos][0]; if(tgt){ const was=p.sec[tgt]||6; p.sec[tgt]=Math.min(20,Math.max(was,6)+ri(1,2)+(T.i==='alta'?1:T.i==='suave'?-1:0)); if(was<15&&p.sec[tgt]>=15) mail(w,'Cuerpo técnico',`Ya puedes jugar de ${PNAME[tgt].toLowerCase()}`,`Los entrenamientos dan fruto: el técnico ya te ve capaz de jugar como ${PNAME[tgt].toLowerCase()}.`,'good'); if(was<20&&p.sec[tgt]>=20) jugLog(w,`Domina la posición de ${PNAME[tgt].toLowerCase()}`); } }

}
function jugImprove(p,f){

  for(const k of keys){ const i=A[k]; if(p.a[i]>=20||k==='ecc'||k==='lth') continue; idx.push(i); ws.push(wt[i]+.5); }
  if(idx.length) p.a[wpick(idx,ws)]++;

function jugPend(w,t){ return w.inbox.some(m=>m.act&&m.act.t===t&&!m.act.done&&(m.act.exp==null||w.day<=m.act.exp)); }
function jugOffers(w,p){

  const role=jugRole(w,p,c), at=PGRP[p.pos]==='a', mid=p.pos==='AMC'||p.pos==='MC';
  const ap=role==='Titular'?24:role==='Rotación'?14:5, g=at?(role==='Titular'?12:role==='Rotación'?5:1):mid?(role==='Titular'?4:0):0;

function jugObjText(w){ const o=w.pc.obj; if(!o) return 'encontrar club'; return [`${o.ap} partidos`].concat(o.g?[`${o.g} gol${o.g>1?'es':''}`]:[]).concat(o.rt?[`nota media de ${o.rt.toFixed(1)}`]:[]).join(', '); }
function jugObjDone(o,ap,g,rt){ return !!o&&ap>=o.ap&&(!o.g||g>=o.g)&&(!o.rt||rt>=o.rt); }

// final de temporada (se llama dentro de endSeason, ya con la nueva temporada)
function jugSeasonEnd(w){

  const s=w.season-1, rows=p.car.filter(r=>r.s===s), ap=rows.reduce((a,r)=>a+r.ap,0), g=rows.reduce((a,r)=>a+r.g,0), as=rows.reduce((a,r)=>a+r.as,0), rt=ap?rows.reduce((a,r)=>a+r.rt*r.ap,0)/ap:0;
  const o=pc.obj, ok=jugObjDone(o,ap,g,rt);
  pc.fame=clamp((pc.fame||0)+(ok?3:-1)+(rt>=7.2?2:0),0,100);
  const tro=(p.tro||[]).filter(t=>t.s===s).map(t=>t.n), aw=(p.aw||[]).filter(a=>a.s===s&&!/del mes/.test(a.n)).map(a=>a.n);
  for(const t of tro) jugLog(w,`Campeón: ${t}`); for(const a of aw) jugLog(w,a);
  pc.fame=clamp(pc.fame+tro.length*2+aw.length*3,0,100);
  (pc.hist||(pc.hist=[])).push({s,c:rows.length?rows[rows.length-1].c:p.club,ap,g,as,rt:+rt.toFixed(2),ovr:p.ovr,ok:ok?1:0,t:tro.length,aw:aw.length});
  if(pc.hist.length>40) pc.hist.shift();
  const c=w.clubs[p.club], lines=[`Temporada ${s}/${String(s+1).slice(2)} con ${c?c.name:'tu último club'}: ${ap} partidos, ${g} goles, ${as} asistencias${ap?`, nota media ${rt.toFixed(2)}`:''}.`];
  if(o) lines.push(ok?`Objetivos cumplidos (${jugObjText(w)}). Tu nombre empieza a sonar.`:`No llegaste a los objetivos (${jugObjText(w)}).`);
  if(tro.length) lines.push(`Títulos: ${tro.join(', ')}.`); if(aw.length) lines.push(`Premios: ${aw.join(', ')}.`);
  lines.push(`Media actual: ${p.ovr}${pc.ovrS!=null?` (empezaste la temporada con ${pc.ovrS})`:''}.`);
  if(p.age>=41){ jugRetire(w,'Con 41 años, el cuerpo dice basta.'); return; }

function jugAsk(v){
  const p=jugMe(), c=W.clubs[p.club], pc=W.pc; if(!c||(p.loan&&['out','ren','loan'].includes(v))) return;
  if(v==='out'){ pc.wantOut=pc.wantOut?0:1; p.tr=pc.wantOut?1:0; if(pc.wantOut){ pc.trust=clamp(pc.trust-6,0,100); toast('El club ya sabe que quieres salir'); news(W,`${pname(p)} pide salir de ${c.name}`,`El jugador ha comunicado al club que quiere cambiar de aires.`,'rumor',c.lg,{p:p.id}); } else toast('Te quedas: el club lo agradece','good'); }
  else if(v==='ren'){ if(jugPend(W,'pren')){ toast('Ya tienes una propuesta de renovación en la bandeja'); return; }
    if(p.ovr>=avgOvr(W,c)-8||p.age<=21||pc.trust>=55){ jugRenewOffer(W,p,c); toast('El club te hace una propuesta: mira la bandeja','good'); } else { pc.renT=W.day; toast('El club prefiere esperar a ver cómo rindes','bad'); } }
  else if(v==='min'||v==='tip'){ if(W.day-(pc.talkT??-99)<30){ toast('Ya hablaste con el técnico hace poco. Espera unas semanas'); return; } pc.talkT=W.day;
    const m=c.mg>=0&&W.mgrs[c.mg]?mgrName(W.mgrs[c.mg]):'El técnico', fa=formAvg(p);
    if(v==='min'){ const good=pc.trust>=55||fa>=7||(jugRole(W,p,c)!=='Suplente'&&rc(.5));
      if(good){ pc.trust=clamp(pc.trust+5,0,100); mail(W,m,'Charla con el técnico',`"Lo sé, y lo estás haciendo bien. Vas a tener más oportunidades. Sigue así."`,'good'); toast('El técnico te tiene en cuenta','good'); }
      else { pc.trust=clamp(pc.trust-4,0,100); p.mor=clamp(p.mor-3,5,100); mail(W,m,'Charla con el técnico',`"Los minutos se ganan en los entrenamientos y en los partidos, no en mi despacho."`,'bad'); toast('Al técnico no le gustó la petición','bad'); } }
    else { const keys=(p.pos==='GK'?G_GK:G_TEC).concat(G_MEN,G_PHY).filter(k=>k!=='ecc'&&k!=='lth'), wt=PWA[p.pos];
      const weak=keys.map(k=>[k,wt[A[k]]*(20-p.a[A[k]])]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
      const grp=k=>G_MEN.includes(k)?'men':G_PHY.includes(k)?'fis':'tec', g=grp(weak[0]);
      pc.trust=clamp(pc.trust+1,0,100);
      mail(W,m,'Qué tienes que mejorar',`"Para tu puesto te falta sobre todo ${weak.map(k=>AN[k].toLowerCase()).join(', ')}. Yo pondría el foco en lo ${g==='men'?'mental':g==='fis'?'físico':'técnico'}."`,'');
      toast('El técnico te dio sus consejos: mira la bandeja','good'); } }
  else if(v==='loan'){ if(!(p.age<=23&&inWindow(W)&&jugStatus(W,p)[0]!=='Titular')) return;
    const to=rp(W.clubs.filter(x=>!x.national&&x.id!==c.id&&x.rep<=c.rep-2&&x.pids.length<26&&avgOvr(W,x)<=p.ovr+3&&avgOvr(W,x)>=p.ovr-8));
    if(!to){ toast('Ningún club encaja ahora mismo. Inténtalo más adelante','bad'); return; }
    jugMove(W,()=>loanMove(W,p,to,0,0)); W.userClub=to.id; pc.lc=to.id; pc.trust=55; jugSetObj(W); jugLog(W,`Cedido a ${to.name}`);
    news(W,`${c.name} cede a ${pname(p)} al ${to.name}`,`El joven jugará a préstamo hasta final de temporada para sumar minutos.`,'fich',c.lg,{p:p.id});
    mail(W,to.name,`Cedido a ${to.name}`,`Jugarás en ${to.name} hasta final de temporada. Nuevos objetivos: ${jugObjText(W)}.`,'good'); toast(`Cedido a ${to.name}`,'good'); }
  autosave(); render();
}

async function menuStartJug(){
  const P=APP.pick, c=W.clubs[P.club]; if(!c||APP.starting) return;
  APP.starting=true; try{ await tabTakeover(); await bakCurrent('replace','Antes de empezar una partida nueva'); }finally{ APP.starting=false; }
  APP.notice=null; jugPickDefaults(P);
  const tal=JUG_TAL[P.tal]||JUG_TAL[1], p=newP(W,{club:c.id,pos:P.pos,nat:P.nat,level:tal[2]/5,age:17});
  const fn=(P.fn||'').trim().slice(0,18), ln=(P.ln||'').trim().slice(0,20); if(fn) p.fn=fn; if(ln) p.ln=ln; p.nn=(P.nn||'').trim().slice(0,16);
  p.foot=P.foot; p.face=P.face; p.pa=ri(tal[3][0],tal[3][1]); p.a[A.det]=Math.max(p.a[A.det],12); upd(p);
  p.ce=W.season+3; p.wage=calcWage(p,W.leagues[c.lg].lf); p.mor=75; c.pids.push(p.id); p.val=calcValue(p); numberSquad(W,c);
  W.mode='jug'; W.me=p.id; W.userClub=c.id;
  W.pc={lc:c.id,s0:W.season,mv:W.season*400,tr:{f:'bal',i:'normal'},trust:50,fame:p.pa>=88?8:3,wantOut:0,ovrS:p.ovr,log:[],hist:[]};
  W.mgr={name:pname(p),nat:p.nat,face:p.face,rep:45,stints:[],ach:{},troph:[],aw:[],sacks:0,run:{u:0,w:0},cs:{}};
  W.day=0; W.inbox=[]; schedule(W); setExpectation(W); W.board.conf=60; fixLineup(W,c); W.tut={sq:1,tac:1,mk:1,hide:1};
  tourSetup(W); jugSetObj(W); jugLog(W,`Firma su primer contrato con ${c.name}`);
  mail(W,'Tu agente','Cómo funciona tu carrera',`Eres futbolista: el técnico del club decide la alineación, tú decides cómo entrenas, qué ofertas aceptas y cuándo renuevas.\n\nPulsa Continuar para avanzar hasta tu próximo partido. Si estás convocado, puedes verlo en 3D (la cámara Jugador te sigue) o pedir el resultado rápido.\n\nTus notas en los partidos y la intensidad del entrenamiento hacen crecer la confianza del técnico, y con ella tus minutos.\n\nCada temporada tienes objetivos. En verano y en enero llegan ofertas de otros clubes.`);
  mail(W,c.name,`Bienvenido a ${c.name}`,`${c.name} te da la bienvenida. Contrato hasta ${p.ce}, ${money(p.wage)} por semana, dorsal ${p.no}.\n\nPapel esperado: ${W.pc.obj.role.toLowerCase()}. Objetivos: ${jugObjText(W)}.`,'good');
  news(W,`${c.name} presenta a ${pname(p)}`,`El club incorpora a un ${PNAME[p.pos].toLowerCase()} de 17 años con mucho futuro.`,'fich',c.lg,{p:p.id});
  APP.game=W; APP.base=null;
  enterGame(); saveNow(); toast(`Bienvenido a ${c.name}`,'good');
}

/* ---------- capacidades del entorno ---------- */
async function wireCaps(){
  const C=window.claude; if(!C||typeof C.use!=='function') return;
  const use=n=>Promise.resolve().then(()=>C.use(n)).catch(()=>null);
  const [db,user,sample,dl]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  CAP.sample=sample||null; CAP.downloads=dl||null;
  if(db&&user){ try{ const id=await user.id(); if(id){ CAP.db=db; CAP.user=user; CAP.uid=id; } }catch(e){} }
  refresh();
}

/* ---------- arranque ---------- */
async function boot(){
  try{ const t=localStorage.getItem('dt26_theme'); if(t) setTheme(t); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){} // pide al navegador que no borre los datos del juego por falta de espacio
  let g=null, L={w:null};
  try{ L=await loadLocal(); }catch(e){ console.warn('save',e); }
  if(L.rec) APP.notice={bad:1,title:'Tu partida guardada estaba dañada',body:`No se pudo abrir (${L.why}), así que recuperamos la copia de seguridad del ${bakWhen(L.rec)}${L.rec.date?' ('+L.rec.date+')':''}. La partida dañada se conserva en Copias de seguridad.`};
  else if(L.lost) APP.notice={bad:1,title:'No se pudo abrir tu partida guardada',body:`El archivo está dañado (${L.lost}). Se conserva en Copias de seguridad por si se puede recuperar; mientras tanto puedes importar una copia descargada.`};
  if(L.w){ g=L.w;
    if((g.v||0)>VERSION){ APP.ro='newer'; APP.notice={bad:1,title:'Partida de una versión más nueva',body:'Esta partida se guardó con una versión más reciente de DT26. Puedes jugarla, pero esta versión no la guardará para no estropearla. Recarga la página para usar la versión nueva.'}; }
    else if((g.v||0)<VERSION) await bakPut('premig',L.s,L.meta||{});
    migrateWorld(g); W=fixWorld(g); APP.game=g; APP.savedT=SAVE.t=(L.meta&&L.meta.t)||0; rnd=RNG(newSeed()); }
  else genWorld(newSeed());
  if(W.settings&&W.settings.gfx) GFX.setQuality(W.settings.gfx);
  try{ if(!localStorage.getItem('dt26_snd')&&W.settings&&W.settings.audio===0){ SND.on=0; sndSave(); } }catch(e){}
  $('#boot').classList.add('hidden');
  showMenu();
  wireCaps();
}
let _booted=false;
function kickBoot(){ if(_booted) return; _booted=true; boot().catch(e=>{ console.error(e); const b=$('#boot'); if(b) b.innerHTML='DT26<small>No se pudo iniciar: '+esc(e&&e.message||e)+'</small>'; }); }
requestAnimationFrame(()=>setTimeout(kickBoot,20)); setTimeout(kickBoot,700); // si la pestaña arranca en segundo plano, no se queda colgada
